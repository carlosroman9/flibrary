<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fletcher Library Assistant</title>
  <link rel="icon" href="logo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --bg2:     #161b22;
      --bg3:     #21262d;
      --bg4:     #2d333b;
      --gold:    #f0a500;
      --gold2:   #fbbf24;
      --golddim: rgba(240,165,0,0.15);
      --text:    #e6edf3;
      --text2:   #8b949e;
      --text3:   #6e7681;
      --border:  #30363d;
      --border2: rgba(240,165,0,0.3);
      --green:   #3fb950;
      --red:     #f85149;
      --radius:  10px;
      --shadow:  0 1px 3px rgba(0,0,0,0.4);
      --shadow2: 0 4px 16px rgba(0,0,0,0.5);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    #root { max-width: 780px; margin: 0 auto; padding: 0 1.5rem 6rem; }

    /* ── TIGER ── */
    .tiger-corner { position:fixed; bottom:28px; right:28px; z-index:10; pointer-events:none; width:110px; transition:opacity .4s; }
    .tiger-corner.hidden { opacity:0; }
    .tiger-corner.visible { opacity:.85; }

    /* ── TOASTS ── */
    .toast-wrap { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
    .toast { font-family:'Inter',sans-serif; font-size:13px; font-weight:500; padding:9px 18px; border-radius:100px; box-shadow:var(--shadow2); animation:toastIn .2s ease both; white-space:nowrap; }
    .toast.success { background:var(--green); color:#fff; }
    .toast.error   { background:var(--red);   color:#fff; }
    .toast.info    { background:var(--bg4);   color:var(--text); border:1px solid var(--border); }
    .toast.fade-out { animation:toastOut .25s ease both; }
    @keyframes toastIn  { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    @keyframes toastOut { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(6px)} }

    /* ── HEADER ── */
    .header { padding: 2rem 0 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
    .header-top { display:flex; align-items:center; gap:1.25rem; margin-bottom:1rem; }
    .logo { width:72px; height:72px; border-radius:12px; object-fit:contain; background:var(--bg2); padding:6px; border:1px solid var(--border); flex-shrink:0; filter:sepia(.3) contrast(1.1); animation:breathe 5s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{filter:sepia(.3) contrast(1.1)} 50%{filter:sepia(.1) contrast(1.15) drop-shadow(0 0 8px rgba(240,165,0,.4))} }
    .header-text { flex:1; }
    .header-badge { font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-bottom:4px; }
    .header-title { font-family:'Playfair Display',serif; font-size:28px; font-weight:900; line-height:1.1; color:var(--text); margin-bottom:4px; }
    .header-sub { font-family:'Crimson Text',serif; font-size:15px; font-style:italic; color:var(--text2); }
    .header-actions { display:flex; gap:8px; align-items:flex-start; flex-shrink:0; }
    .header-btn { padding:6px 14px; font-size:12px; font-weight:500; border:1px solid var(--border); background:transparent; color:var(--text2); border-radius:6px; cursor:pointer; transition:all .15s; white-space:nowrap; }
    .header-btn:hover, .header-btn.active { border-color:var(--gold); color:var(--gold); background:var(--golddim); }

    .status-bar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
    .status-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text3); }
    .status-dot { width:7px; height:7px; border-radius:50%; background:var(--text3); flex-shrink:0; }
    .status-dot.ready  { background:var(--green); box-shadow:0 0 6px rgba(63,185,80,.5); }
    .status-dot.loading { background:var(--gold); animation:pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── PANELS ── */
    .panel { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
    .panel-title { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin-bottom:14px; }
    .panel p { font-family:'Crimson Text',serif; font-size:15px; color:var(--text2); line-height:1.7; margin-bottom:10px; }
    .panel p:last-child { margin-bottom:0; }
    .panel strong { color:var(--text); font-family:'Inter',sans-serif; font-size:13px; }

    .feature-grid { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .feature-tag { padding:4px 12px; background:var(--bg3); border:1px solid var(--border); border-radius:100px; font-size:12px; color:var(--text3); }

    /* ── ANALYTICS ── */
    .stats-grid { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .stat-card { flex:1; min-width:70px; background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:12px; text-align:center; }
    .stat-num { font-family:'Playfair Display',serif; font-size:26px; font-weight:700; color:var(--gold); line-height:1; }
    .stat-lbl { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-top:4px; }
    .stat-cols { display:flex; gap:16px; flex-wrap:wrap; }
    .stat-col { flex:1; min-width:150px; }
    .stat-col-title { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--text3); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border); }
    .stat-row { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:5px 0; border-bottom:1px solid rgba(48,54,61,.5); color:var(--text2); }
    .stat-row span:last-child { color:var(--gold); font-weight:600; }
    .stat-empty { font-family:'Crimson Text',serif; font-size:14px; color:var(--text3); font-style:italic; }

    /* ── PROFILE BAR ── */
    .section-label { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text3); margin-bottom:8px; }
    .profile-section { margin-bottom:20px; }
    .profile-pills { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .pill { padding:5px 14px; font-size:13px; font-weight:500; border:1px solid var(--border); background:transparent; color:var(--text3); cursor:pointer; transition:all .15s; border-radius:100px; }
    .pill:hover { border-color:var(--gold); color:var(--text); }
    .pill.active { background:var(--gold); border-color:var(--gold); color:#000; font-weight:600; }
    .pill.active-left { border-radius:100px 0 0 100px; background:var(--gold); border-color:var(--gold); color:#000; font-weight:600; border-right:none; }
    .pill-edit { padding:5px 10px; border-radius:0 100px 100px 0; background:var(--bg2); border:1px solid var(--gold); border-left:none; color:var(--gold); cursor:pointer; font-size:13px; transition:all .15s; }
    .pill-edit:hover { background:var(--golddim); }
    .pill-add { padding:5px 14px; font-size:13px; border:1px dashed var(--border); background:transparent; color:var(--text3); cursor:pointer; border-radius:100px; transition:all .15s; }
    .pill-add:hover { border-color:var(--gold); color:var(--gold); }
    .profile-meta { margin-top:8px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .profile-note { font-family:'Crimson Text',serif; font-size:14px; color:var(--text3); font-style:italic; }
    .summary-btn { font-size:12px; font-weight:500; padding:3px 12px; border:1px solid var(--border); background:transparent; color:var(--text3); border-radius:6px; cursor:pointer; transition:all .15s; }
    .summary-btn:hover { border-color:var(--gold); color:var(--gold); }
    .reluctant-badge { font-size:11px; font-weight:600; color:var(--gold); background:var(--golddim); border:1px solid var(--border2); border-radius:100px; padding:2px 10px; }

    /* ── EDITOR ── */
    .editor-panel { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
    .editor-title { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin-bottom:14px; }
    .editor-row { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
    .field { display:flex; flex-direction:column; gap:5px; }
    .field-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); }
    .field-input { padding:9px 12px; font-size:14px; background:var(--bg3); border:1px solid var(--border); color:var(--text); border-radius:7px; outline:none; font-family:'Inter',sans-serif; transition:border-color .15s; }
    .field-input:focus { border-color:var(--gold); }
    .field-input::placeholder { color:var(--text3); }

    .toggle-row { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--bg3); border:1px solid var(--border); border-radius:8px; cursor:pointer; transition:border-color .15s; margin-bottom:12px; }
    .toggle-row:hover, .toggle-row.on { border-color:var(--gold); }
    .toggle-sw { width:36px; height:20px; background:var(--border); border-radius:10px; position:relative; transition:background .15s; flex-shrink:0; }
    .toggle-sw.on { background:var(--gold); }
    .toggle-knob { position:absolute; top:3px; left:3px; width:14px; height:14px; background:#fff; border-radius:50%; transition:left .15s; }
    .toggle-sw.on .toggle-knob { left:19px; }
    .toggle-text { flex:1; }
    .toggle-label { font-size:13px; font-weight:500; color:var(--text2); }
    .toggle-sub { font-size:12px; color:var(--text3); font-style:italic; }

    /* ── SUMMARY PANEL ── */
    .summary-section-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid var(--border); }
    .summary-item { font-family:'Crimson Text',serif; font-size:14px; color:var(--text2); padding:3px 0; }
    .summary-section { margin-bottom:14px; }

    /* ── TABS ── */
    .tabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:20px; gap:0; }
    .tab { padding:10px 20px; font-size:13px; font-weight:500; background:transparent; border:none; border-bottom:2px solid transparent; cursor:pointer; color:var(--text3); transition:all .15s; margin-bottom:-1px; }
    .tab:hover { color:var(--text2); }
    .tab.active { color:var(--gold); border-bottom-color:var(--gold); }

    /* ── INPUTS ── */
    .input-section { margin-bottom:16px; }
    .main-input { width:100%; padding:11px 14px; font-size:15px; background:var(--bg2); border:1px solid var(--border); color:var(--text); border-radius:8px; outline:none; font-family:'Crimson Text',serif; transition:border-color .15s; }
    .main-input:focus { border-color:var(--gold); }
    .main-input::placeholder { color:var(--text3); font-style:italic; }
    .main-textarea { width:100%; padding:11px 14px; font-size:15px; background:var(--bg2); border:1px solid var(--border); color:var(--text); border-radius:8px; outline:none; font-family:'Crimson Text',serif; resize:vertical; line-height:1.7; transition:border-color .15s; }
    .main-textarea:focus { border-color:var(--gold); }
    .main-textarea::placeholder { color:var(--text3); font-style:italic; }
    .input-hint { font-size:12px; color:var(--text3); margin-top:5px; }

    /* ── DROPDOWN ── */
    .dropdown-wrap { position:relative; }
    .dropdown { position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:50; background:var(--bg2); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow2); overflow:hidden; }
    .dropdown-item { padding:10px 14px; font-size:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:baseline; gap:8px; border-bottom:1px solid var(--border); transition:background .1s; font-family:'Crimson Text',serif; }
    .dropdown-item:last-child { border-bottom:none; }
    .dropdown-item:hover, .dropdown-item.hi { background:var(--bg3); }
    .drop-title { color:var(--text); font-weight:600; }
    .drop-author { color:var(--text3); font-size:13px; flex-shrink:0; font-style:italic; }

    /* ── TROPES ── */
    .trope-section { margin-bottom:14px; }
    .trope-cat { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--text3); margin-bottom:8px; }
    .trope-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .trope-chip { padding:5px 13px; font-size:12px; font-weight:500; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--text3); transition:all .15s; border-radius:100px; }
    .trope-chip:hover { border-color:var(--gold); color:var(--text2); }
    .trope-chip.sel { background:var(--bg3); border-color:var(--text3); color:var(--text); }
    .trope-chip.prio { background:var(--gold); border-color:var(--gold2); color:#000; font-weight:600; }
    .trope-hint { font-family:'Crimson Text',serif; font-size:14px; color:var(--text3); font-style:italic; margin-bottom:14px; }

    /* ── CHIPS ── */
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .chip { display:flex; align-items:center; gap:5px; padding:4px 10px; background:var(--bg3); border:1px solid var(--border); font-size:13px; color:var(--text2); border-radius:100px; font-family:'Crimson Text',serif; }
    .chip.gold { border-color:var(--gold); color:var(--gold); background:var(--golddim); }
    .chip-x { background:none; border:none; cursor:pointer; color:var(--text3); padding:0; font-size:15px; line-height:1; transition:color .1s; }
    .chip-x:hover { color:var(--red); }

    /* ── LIKED BANNER ── */
    .liked-banner { padding:10px 16px; background:var(--golddim); border:1px solid var(--border2); border-radius:8px; font-size:13px; margin-bottom:16px; display:flex; align-items:flex-start; gap:8px; }
    .liked-banner-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
    .liked-banner-text { font-family:'Crimson Text',serif; color:var(--text2); line-height:1.5; }
    .liked-banner-text strong { color:var(--gold); font-family:'Inter',sans-serif; font-size:12px; font-weight:600; text-transform:uppercase; display:block; margin-bottom:2px; }

    /* ── SEARCH HISTORY ── */
    .history-wrap { margin-bottom:16px; }
    .history-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .history-chip { display:flex; align-items:center; gap:6px; padding:5px 12px; background:var(--bg2); border:1px solid var(--border); border-radius:100px; font-size:12px; color:var(--text3); cursor:pointer; transition:all .15s; }
    .history-chip:hover { border-color:var(--gold); color:var(--text2); }
    .history-mode { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); }

    /* ── SEARCH BUTTON ── */
    .search-btn { width:100%; padding:13px; font-family:'Inter',sans-serif; font-size:15px; font-weight:600; letter-spacing:.04em; background:var(--gold); color:#000; border:none; border-radius:10px; cursor:pointer; transition:all .2s; margin-bottom:24px; position:relative; overflow:hidden; }
    .search-btn::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,0); transition:background .2s; }
    .search-btn:hover::after { background:rgba(255,255,255,.1); }
    .search-btn:hover { transform:translateY(-1px); box-shadow:0 4px 20px rgba(240,165,0,.4); }
    .search-btn:active { transform:translateY(0); box-shadow:none; }
    .search-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }

    /* ── RESULTS ── */
    .results-header { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
    .results-title { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; font-style:italic; color:var(--text); }
    .results-line { flex:1; height:1px; background:linear-gradient(to right,var(--border),transparent); }
    .results-count { font-size:12px; font-weight:500; color:var(--text3); white-space:nowrap; }

    .result-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:12px; border-left:3px solid var(--gold); animation:fadeUp .35s ease both; box-shadow:var(--shadow); transition:box-shadow .2s; }
    .result-card:hover { box-shadow:var(--shadow2); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .result-num { display:inline-block; font-size:10px; font-weight:700; color:var(--gold); background:var(--golddim); border:1px solid var(--border2); border-radius:4px; padding:1px 7px; margin-bottom:10px; font-family:'Inter',sans-serif; letter-spacing:.05em; }
    .result-inner { display:flex; gap:14px; }
    .cover { width:58px; height:84px; flex-shrink:0; background:var(--bg3); border:1px solid var(--border); border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:20px; object-fit:cover; transition:transform .2s; }
    .cover:hover { transform:scale(1.05); }
    .result-body { flex:1; min-width:0; }
    .result-title-row { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:3px; }
    .result-title { font-family:'Playfair Display',serif; font-weight:700; font-size:17px; color:var(--text); line-height:1.2; }
    .heart-btn { background:none; border:none; cursor:pointer; font-size:20px; padding:0; flex-shrink:0; line-height:1; transition:transform .15s; }
    .heart-btn:hover { transform:scale(1.2); }
    .result-meta { font-size:12px; font-weight:500; color:var(--text3); margin-bottom:8px; }
    .result-series { color:var(--gold); margin-left:6px; }
    .result-reason { font-family:'Crimson Text',serif; font-size:14px; color:var(--text2); line-height:1.65; padding-left:10px; border-left:2px solid var(--border2); }
    .cursor { display:inline-block; width:2px; height:13px; background:var(--gold); margin-left:2px; animation:blink .7s step-end infinite; vertical-align:middle; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .expand-btn { background:none; border:none; cursor:pointer; font-size:12px; font-weight:500; color:var(--text3); padding:0; margin-top:8px; display:flex; align-items:center; gap:4px; transition:color .15s; }
    .expand-btn:hover { color:var(--gold); }
    .expand-arrow { display:inline-block; transition:transform .2s; font-size:9px; }
    .expand-arrow.open { transform:rotate(90deg); }
    .summary-box { margin-top:10px; padding:10px 13px; background:var(--bg3); border-radius:7px; font-family:'Crimson Text',serif; font-size:14px; color:var(--text2); line-height:1.65; font-style:italic; animation:fadeUp .2s ease; }
    .note-field { width:100%; margin-top:12px; padding:8px 12px; font-size:13px; background:var(--bg3); border:1px dashed var(--border); color:var(--text2); resize:none; font-family:'Inter',sans-serif; outline:none; line-height:1.6; border-radius:7px; transition:border-color .15s; }
    .note-field:focus { border-color:var(--gold); border-style:solid; }
    .note-field::placeholder { color:var(--text3); }

    /* ── RESULTS ACTIONS ── */
    .results-actions { display:flex; gap:8px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
    .action-btn { padding:8px 20px; font-size:13px; font-weight:500; background:transparent; border:1px solid var(--border); color:var(--text2); border-radius:8px; cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:6px; }
    .action-btn:hover { border-color:var(--gold); color:var(--gold); }
    .action-btn.primary { border-color:var(--gold); color:var(--gold); }
    .action-btn.primary:hover { background:var(--golddim); }
    .action-btn:disabled { opacity:.4; cursor:not-allowed; }

    /* ── LOADING ── */
    .loading-wrap { text-align:center; padding:3rem 0 2rem; }
    .loading-video { width:200px; max-width:100%; border-radius:10px; box-shadow:var(--shadow2); display:block; margin:0 auto 20px; border:1px solid var(--border); }
    .loading-card { display:inline-block; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:20px 28px; max-width:380px; width:100%; }
    .loading-bars { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
    .loading-bar { height:3px; background:var(--border); border-radius:2px; overflow:hidden; position:relative; }
    .loading-bar::after { content:''; position:absolute; top:0; left:-100%; width:100%; height:100%; background:var(--gold); animation:barSlide 1.8s ease-in-out infinite; }
    .loading-bar:nth-child(1)::after { animation-delay:0s; width:80%; }
    .loading-bar:nth-child(2)::after { animation-delay:.15s; width:95%; }
    .loading-bar:nth-child(3)::after { animation-delay:.3s;  width:70%; }
    .loading-bar:nth-child(4)::after { animation-delay:.45s; width:88%; }
    @keyframes barSlide { 0%{left:-100%} 100%{left:100%} }

function cosine(a,b) {
  let dot=0,na=0,nb=0;
  for(let i=0;i<a.length;i++){dot+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}
  return dot/(Math.sqrt(na)*Math.sqrt(nb)||1);
}

// ── CANDIDATE RETRIEVAL ──────────────────────────────────────────────────
async function getCandidates(books,queryText,bookEmbeddings,likedKws=[],n=70,excl=null,alreadyRead=new Set(),shown=new Set(),refAuthor=null) {
  const pool = books.filter(b=>b.title!==excl&&!alreadyRead.has(b.title)&&!shown.has(b.title));

  const authorLast = refAuthor ? refAuthor.split(',')[0].trim().toLowerCase() : null;
  const sameAuthor = new Set(authorLast ? pool.filter(b=>(b.author||'').toLowerCase().includes(authorLast)).map(b=>b.title) : []);

  // Embedding path
  if (bookEmbeddings && Object.keys(bookEmbeddings).length > 0) {
    try {
      const res = await fetch(EMBED_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:queryText})});
      if (!res.ok) throw new Error(`embed ${res.status}`);
      const {embedding:qEmb} = await res.json();
      const lSet = new Set(likedKws);
      const scored = pool.map(b=>{
        const bEmb = bookEmbeddings[b.title];
        const sim  = bEmb ? cosine(qEmb,bEmb) : 0;
        const toks = tokenize(`${b.enriched_subjects||b.subjects||''} ${b.enriched_summary||b.summary||''}`);
        const likedBoost  = toks.filter(t=>lSet.has(t)).length*0.01;
        const authorBoost = sameAuthor.has(b.title)?0.15:0;
        return {...b,_s:sim+likedBoost+authorBoost};
      }).sort((a,b)=>b._s-a._s);
      return scored.slice(0,n);
    } catch(err) {
      console.warn('Embedding failed — using keyword fallback:',err);
    }
  }

  // Keyword fallback
  const kws=tokenize(queryText), kSet=new Set(kws), lSet=new Set(likedKws);
  let scored=pool.map(b=>{
    const st=new Set(tokenize(b.enriched_subjects||b.subjects||''));
    const sm=new Set(tokenize(b.enriched_summary||b.summary||''));
    const ti=new Set(tokenize(b.title||''));
    const base=[...kSet].filter(k=>st.has(k)).length*3+[...kSet].filter(k=>sm.has(k)).length+[...kSet].filter(k=>ti.has(k)).length;
    const liked=[...lSet].filter(k=>st.has(k)).length*4+[...lSet].filter(k=>sm.has(k)).length*2;
    const authorBoost=sameAuthor.has(b.title)?10:0;
    return {...b,_s:base+liked+authorBoost};
  }).filter(b=>b._s>0);
  if(!scored.length) scored=pool;
  return scored.sort((a,b)=>b._s-a._s).slice(0,n);
}

// ── CLAUDE CALL ──────────────────────────────────────────────────────────
async function callClaude(candidates,ctx,excluded=[],priorityLabel=null,likedTitles=[],likedThemes="",prefNote="",reluctantNote="",didntLikeNote="") {
  const exclNote  = excluded.length    ? `\n\nDo NOT recommend: ${excluded.join(", ")}` : "";
  const prioNote  = priorityLabel      ? `\n\nMust-have: "${priorityLabel}" — every pick MUST feature this.` : "";
  const likedNote = likedTitles.length ? `\n\nThis student loved: ${likedTitles.join(", ")}. Weight toward similar feel.` : "";
  const list = candidates.map((b,i)=>`${i+1}. "${b.title}" by ${b.author}\n   ${(b.enriched_summary||b.summary||"").slice(0,200)}`).join("\n\n");

  const res = await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,
      system:"You are an expert school librarian recommending middle school and YA fiction. Return only valid JSON arrays, no markdown.",
      messages:[{role:"user",content:`${ctx}${prioNote}${likedNote}${likedThemes}${prefNote}${reluctantNote}${didntLikeNote}${exclNote}\n\nChoose 6 best matches:\n\n${list}\n\nReturn ONLY: [{"title":"...","author":"...","reason":"1-2 sentence explanation"}]`}]})});

  const raw=await res.text();
  if(!res.ok) throw new Error(`Worker ${res.status}`);
  let data;
  try{data=JSON.parse(raw);}catch(e){console.error("Bad JSON from worker:",raw);throw e;}
  const text=data.content?.[0]?.text||"[]";
  const clean=text.replace(/```json|```/g,"").trim();
  const jsonText=(clean.match(/\[[\s\S]*\]/)||[clean])[0];
  return JSON.parse(jsonText);
}

  const[displayed,setDisplayed]=React.useState("");

  React.useEffect(()=>{

    return()=>clearInterval(iv);
  },[text]);
  return <span className="result-reason">{displayed}{!done&&<span className="cursor"/>}</span>;
}

function BookSearch({books,exclude,onSelect,placeholder}){
  const[inp,setInp]=React.useState("");const[sugg,setSugg]=React.useState([]);const[hi,setHi]=React.useState(-1);
  const onChange=v=>{setInp(v);setHi(-1);if(v.length>1)setSugg(books.filter(b=>(b.title||"").toLowerCase().includes(v.toLowerCase())&&!exclude.has(b.title)).slice(0,6));else setSugg([]);};
  const pick=b=>{onSelect(b);setInp("");setSugg([]);setHi(-1);};
  const onKD=e=>{if(!sugg.length)return;if(e.key==="ArrowDown"){e.preventDefault();setHi(h=>Math.min(h+1,sugg.length-1));}else if(e.key==="ArrowUp"){e.preventDefault();setHi(h=>Math.max(h-1,-1));}else if(e.key==="Enter"&&hi>=0){e.preventDefault();pick(sugg[hi]);}else if(e.key==="Escape"){setSugg([]);setHi(-1);}};
  return <div className="dropdown-wrap">
    <input className="field-input" style={{width:"100%"}} value={inp} onChange={e=>onChange(e.target.value)} onKeyDown={onKD} placeholder={placeholder||"Type a title…"}/>

      <div className="field" style={{flex:1,minWidth:130}}>
        <label className="field-label">Reading preferences</label>
        <input className="field-input" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="e.g. loves fantasy, avoids romance…"/>
      </div>
    </div>
    <div className={`toggle-row${reluctant?" on":""}`} onClick={()=>setReluctant(p=>!p)}>
      <div className={`toggle-sw${reluctant?" on":""}`}><div className="toggle-knob"/></div>
      <div className="toggle-text"><div className="toggle-label">⚡ Reluctant reader</div><div className="toggle-sub">Prioritize short, fast-paced books with high action</div></div>
    </div>
    <div style={{marginBottom:12}}>
      <label className="field-label" style={{display:"block",marginBottom:6}}>Liked books</label>
      <BookSearch books={books} exclude={new Set(liked)} onSelect={b=>setLiked(prev=>[...prev,b.title])} placeholder="Add a book they enjoy…"/>
      <ChipList items={liked} onRemove={t=>setLiked(prev=>prev.filter(x=>x!==t))} gold/>
    </div>
    <div style={{marginBottom:16}}>
      <label className="field-label" style={{display:"block",marginBottom:6}}>Already read</label>
      <BookSearch books={books} exclude={new Set(read)} onSelect={b=>setRead(prev=>[...prev,b.title])} placeholder="Add a book they've finished…"/>
      <ChipList items={read} onRemove={t=>setRead(prev=>prev.filter(x=>x!==t))}/>
    </div>
    <div className="btn-row">
      <div style={{display:"flex",gap:8}}>
        <button className="btn btn-primary" onClick={save}>{isNew?"Save Profile":"Update Profile"}</button>
        <button className="btn btn-secondary" onClick={onCancel}>Cancel</button>
      </div>
      {!isNew&&<button className="btn btn-danger" onClick={()=>onDelete(profile.id)}>Delete Profile</button>}
    </div>
  </div>;
}

function AnalyticsPanel({analytics}){
  const topTropes=Object.entries(analytics.tropeSearches||{}).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topBooks=Object.entries(analytics.recommendedBooks||{}).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const sm=analytics.searchModes||{};
  return <div className="panel">
    <div className="panel-title">Usage Statistics</div>
    <div className="stats-grid">
      {[["Total Searches",analytics.totalSearches||0],["Find Similar",sm.similar||0],["By Trope",sm.tropes||0],["Describe It",sm.freetext||0]].map(([l,v])=>(
        <div key={l} className="stat-card"><div className="stat-num">{v}</div><div className="stat-lbl">{l}</div></div>
      ))}
    </div>
    <div className="stat-cols">
      <div className="stat-col">
        <div className="stat-col-title">Top tropes searched</div>
        {topTropes.length?topTropes.map(([id,n])=>{const label=TROPES.find(t=>t.id===id)?.label||id;return <div key={id} className="stat-row"><span>{label}</span><span>{n}</span></div>;}): <span className="stat-empty">No searches yet</span>}
      </div>
      <div className="stat-col">
        <div className="stat-col-title">Most recommended</div>
        {topBooks.length?topBooks.map(([title,n])=><div key={title} className="stat-row"><span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginRight:8}}>{title}</span><span>{n}</span></div>):<span className="stat-empty">No recommendations yet</span>}
      </div>
    </div>
  </div>;
}

function AboutPanel(){
  return <div className="panel">
    <div className="panel-title">About This Tool</div>
    <p>The Fletcher Library Assistant is an AI-powered book recommendation system built for the Fletcher Middle School library. It combines semantic search, enriched catalog data, and Claude AI to surface the most relevant fiction titles for each student — understanding meaning and context, not just keywords.</p>
    <p><strong>Three search modes</strong> — Find books similar to a title a student loved, browse by narrative tropes and themes, or describe what a student is looking for in plain language.</p>
    <p><strong>Semantic matching</strong> — Powered by vector embeddings, the system understands that a student asking for "something like Hunger Games" wants survival, dystopia, and strong protagonists — not just books with those exact words in their description.</p>
    <p><strong>Student profiles</strong> — Save reading preferences, liked books, and already-read lists per student. Liked books actively influence recommendation results through subject heading extraction.</p>
    <div className="feature-grid">
      {["3,500+ Fiction Titles","Voyage AI Embeddings","Claude Sonnet","Enriched MARC Data","Student Profiles","Cloudflare Workers","GitHub Pages"].map(t=><span key={t} className="feature-tag">{t}</span>)}
    </div>
  </div>;
}

function LoadingView({stageMsg}){
  return <div className="loading-wrap">
    <video className="loading-video" src="A_–_second_seamless_loop_for.mp4" autoPlay muted loop playsInline/>
    <div className="loading-card">
      <div className="loading-bars"><div className="loading-bar"/><div className="loading-bar"/><div className="loading-bar"/><div className="loading-bar"/></div>
      <div className="loading-text">{stageMsg}</div>
    </div>
  </div>;
}

// ── APP ──────────────────────────────────────────────────────────────────
function App(){
  const[books,setBooks]                     = React.useState([]);
  const[bookCount,setBookCount]             = React.useState(0);
  const[bookEmbeddings,setBookEmbeddings]   = React.useState(null);
  const[embedReady,setEmbedReady]           = React.useState(null); // null=loading, true=ready, false=fallback
  const[loadError,setLoadError]             = React.useState(false);
  const[profiles,setProfiles]               = React.useState(()=>lsLoad("profiles",[]));
  const[activeProfileId,setActiveProfileId] = React.useState(null);
  const[editing,setEditing]                 = React.useState(null);
  const[showAnalytics,setShowAnalytics]     = React.useState(false);
  const[showAbout,setShowAbout]             = React.useState(false);
  const[showSummary,setShowSummary]         = React.useState(false);
  const[analytics,setAnalytics]             = React.useState(()=>lsLoad("analytics",DEFAULT_ANALYTICS));
  const[mode,setMode]                       = React.useState("similar");
  const[query,setQuery]                     = React.useState("");
  const[selTropes,setSelTropes]             = React.useState(new Set());
  const[priorityTrope,setPriorityTrope]     = React.useState(null);
  const[alreadyRead,setAlreadyRead]         = React.useState(new Set());
  const[didntLike,setDidntLike]             = React.useState("");
  const[results,setResults]                 = React.useState(null);
  const[loading,setLoading]                 = React.useState(false);
  const[loadingMore,setLoadingMore]         = React.useState(false);
  const[stageMsg,setStageMsg]               = React.useState(STAGE_MSGS[0]);
  const[error,setError]                     = React.useState("");
  const[suggestions,setSuggestions]         = React.useState([]);
  const[refBook,setRefBook]                 = React.useState(null);
  const[shownTitles,setShownTitles]         = React.useState(new Set());
  const[toasts,setToasts]                   = React.useState([]);
  const[searchHistory,setSearchHistory]     = React.useState([]);
  const lastSearch = React.useRef(null);
  const stageRef   = React.useRef(null);

  // Load CSV
  React.useEffect(()=>{
    fetch(CSV_FILE).then(r=>{if(!r.ok)throw new Error();return r.text();})
      .then(text=>{Papa.parse(text,{header:true,skipEmptyLines:true,complete:r=>{setBooks(r.data);setBookCount(r.data.length);}});})
      .catch(()=>setLoadError(true));
  },[]);

  // Load embeddings
  React.useEffect(()=>{
    fetch('book_embeddings.json')
      .then(r=>{if(!r.ok)throw new Error();return r.json();})
      .then(data=>{setBookEmbeddings(data);setEmbedReady(true);console.log(`Embeddings: ${Object.keys(data).length} books`);})
      .catch(()=>{setBookEmbeddings({});setEmbedReady(false);console.warn('Embeddings not found — keyword fallback');});
  },[]);

  // Tiger + stage messages
  React.useEffect(()=>{
    setTigerVisible(!(loading||loadingMore));
    if(loading||loadingMore){
      let i=0;
      stageRef.current=setInterval(()=>{i=(i+1)%STAGE_MSGS.length;setStageMsg(STAGE_MSGS[i]);},2000);
    } else {
      if(stageRef.current) clearInterval(stageRef.current);
      setStageMsg(STAGE_MSGS[0]);
    }
    return()=>{if(stageRef.current)clearInterval(stageRef.current);};
  },[loading,loadingMore]);

  // Auto-scroll to results
  const resultsRef = React.useRef(null);
  React.useEffect(()=>{
    if(results?.length&&resultsRef.current) setTimeout(()=>resultsRef.current.scrollIntoView({behavior:'smooth',block:'start'}),150);
  },[results]);

  const addToast=(msg,type='success')=>{
    const id=Date.now()+Math.random();
    setToasts(prev=>[...prev,{id,msg,type}]);
    setTimeout(()=>setToasts(prev=>prev.filter(t=>t.id!==id)),2800);
  };

  const saveProfiles  = p=>{setProfiles(p);lsSave("profiles",p);};
  const saveAnalytics = a=>{setAnalytics(a);lsSave("analytics",a);};
  const activeProfile = profiles.find(p=>p.id===activeProfileId)||null;

  const selectProfile = id=>{
    setActiveProfileId(id);setEditing(null);setResults(null);
    setShownTitles(new Set());lastSearch.current=null;setShowSummary(false);
    setAlreadyRead(id?new Set(profiles.find(p=>p.id===id)?.alreadyRead||[]):new Set());
  };

  const toggleHeart=title=>{
    if(!activeProfile) return;
    const liked=activeProfile.likedBooks||[];
    const nowLiked=!liked.includes(title);
    const updated=nowLiked?[...liked,title]:liked.filter(t=>t!==title);
    saveProfiles(profiles.map(p=>p.id===activeProfileId?{...p,likedBooks:updated}:p));
    addToast(nowLiked?`❤ Added to liked books`:`Removed from liked books`);
  };

  const trackSearch=(m,tropes=[])=>{
    const a={...analytics,totalSearches:(analytics.totalSearches||0)+1,searchModes:{...analytics.searchModes,[m]:(analytics.searchModes[m]||0)+1},tropeSearches:{...analytics.tropeSearches}};
    tropes.forEach(t=>{a.tropeSearches[t]=(a.tropeSearches[t]||0)+1;});
    saveAnalytics(a);
  };

  const trackRecs=recs=>{
    const a={...analytics,recommendedBooks:{...analytics.recommendedBooks}};
    recs.forEach(b=>{a.recommendedBooks[b.title]=(a.recommendedBooks[b.title]||0)+1;});
    saveAnalytics(a);
  };

  const addToHistory=(label,m)=>{
    setSearchHistory(prev=>[{label,mode:m,id:Date.now()},...prev.filter(e=>e.label!==label)].slice(0,5));
  };

  const getLikedKws=()=>{
    if(!activeProfile?.likedBooks?.length) return[];
    const objs=books.filter(b=>activeProfile.likedBooks.includes(b.title));
    const st=objs.map(b=>b.enriched_subjects||b.subjects||"").join(" ");
    const sm=objs.map(b=>b.enriched_summary||b.summary||"").join(" ");
    return[...tokenize(st),...tokenize(st),...tokenize(st),...tokenize(sm)];
  };

  const getLikedThemes=()=>{
    if(!activeProfile?.likedBooks?.length) return"";
    const objs=books.filter(b=>activeProfile.likedBooks.includes(b.title));
    const all=objs.flatMap(b=>(b.enriched_subjects||b.subjects||"").split("|").map(s=>s.trim())).filter(Boolean);
    const unique=[...new Set(all)].slice(0,12);
    return unique.length?`\n\nThemes from books this student enjoyed: ${unique.join("; ")}. Prioritize books sharing these themes.`:"";
  };

  const onQueryChange=val=>{
    setQuery(val);setRefBook(null);
    if(mode==="similar"&&val.length>1) setSuggestions(books.filter(b=>(b.title||"").toLowerCase().includes(val.toLowerCase())).slice(0,6));
    else setSuggestions([]);
  };

  const toggleTrope=id=>{
    setSelTropes(prev=>{
      const n=new Set(prev);
      if(!n.has(id)){n.add(id);}
      else if(priorityTrope!==id){setPriorityTrope(id);}
      else{n.delete(id);setPriorityTrope(null);}
      return n;
    });
  };

  const switchMode=m=>{
    setMode(m);setResults(null);setError("");setQuery("");setRefBook(null);
    setSuggestions([]);setSelTropes(new Set());setPriorityTrope(null);
    setShownTitles(new Set());lastSearch.current=null;
  };

  const buildParams=()=>{
    let ctx="",excl=null,priorityLabel=null;
    if(mode==="similar"){
      const ref=refBook||books.find(b=>(b.title||"").toLowerCase()===query.toLowerCase());
      if(!ref) return null;
      excl=ref.title;
      ctx=`A student loved "${ref.title}" by ${ref.author}.\n\nSummary: ${ref.enriched_summary||ref.summary||""}\n\nFind books with similar themes, characters, tone, and plot elements.`;
    } else if(mode==="tropes"){
      if(!selTropes.size) return null;
      const labels=TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label);
      if(priorityTrope) priorityLabel=TROPES.find(t=>t.id===priorityTrope)?.label;
      ctx=`A student wants books with: ${labels.join(", ")}. Find the best matches.`;
    } else {
      if(!query.trim()) return null;
      ctx=`A student wants: "${query}". Find the best matches.`;
    }
    return{ctx,excl,priorityLabel};
  };

  const buildQueryText=()=>{
    if(mode==="similar"&&refBook)
      return `${refBook.title} ${refBook.author} ${refBook.enriched_subjects||refBook.subjects||""} ${refBook.enriched_summary||refBook.summary||""}`;
    if(mode==="tropes"){
      const labels=TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label);
      const kws=[...new Set(labels.flatMap(l=>{const id=TROPES.find(t=>t.label===l)?.id;return[...tokenize(l),...(TROPE_KEYWORDS[id]||[])]}))];
      return kws.join(' ');
    }
    return query;
  };

  const runSearch=async(params,shown,isMore=false)=>{
    const{ctx,excl,priorityLabel}=params;
    const queryText=buildQueryText();
    const refAuthor=(mode==='similar'&&refBook)?refBook.author:null;
    const cands=await getCandidates(books,queryText,bookEmbeddings,getLikedKws(),70,excl,alreadyRead,shown,refAuthor);
    const prefNote=activeProfile?.notes?`\n\nStudent reading preferences: ${activeProfile.notes}. Please respect these.`:"";
    const reluctantNote=activeProfile?.reluctant?`\n\nThis is a reluctant reader — ONLY recommend fast-paced books with short chapters and high action.`:"";
    const didntLikeNote=didntLike.trim()?`\n\nThe student did NOT enjoy: "${didntLike.trim()}". Avoid books with these qualities.`:"";
    const recs=await callClaude(cands,ctx,[...alreadyRead,...shown],priorityLabel,activeProfile?.likedBooks||[],getLikedThemes(),prefNote,reluctantNote,didntLikeNote);
    const enriched=recs.map(r=>({...(books.find(b=>b.title===r.title&&b.author===r.author)||books.find(b=>b.title===r.title)||r),...r}));
    setShownTitles(new Set([...shown,...enriched.map(b=>b.title)]));
    if(isMore) setResults(prev=>[...(prev||[]),...enriched]);
    else setResults(enriched);
    trackRecs(enriched);
  };

  const search=async()=>{
    setError("");setResults(null);setLoading(true);setShownTitles(new Set());lastSearch.current=null;
    try{
      const params=buildParams();
      if(!params){
        setError(mode==="similar"?"Please select a title from the suggestions.":mode==="tropes"?"Please select at least one trope.":"Please describe what you're looking for.");
        setLoading(false);return;
      }
      lastSearch.current=params;
      const histLabel=mode==="similar"?query:mode==="tropes"?TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label).join(', '):query;
      addToHistory(histLabel,mode);
      await runSearch(params,new Set());
      trackSearch(mode,mode==="tropes"?[...selTropes]:[]);
    }catch(e){console.error(e);setError("Search failed — please try again.");}
    setLoading(false);
  };

  const searchMore=async()=>{
    if(!lastSearch.current) return;
    setLoadingMore(true);
    try{await runSearch(lastSearch.current,shownTitles,true);}
    catch{setError("Search failed — please try again.");}
    setLoadingMore(false);
  };

  const copyResults=()=>{
    if(!results?.length) return;
    const text=results.map((b,i)=>`${ROMAN[i]||i+1}. ${b.title} by ${b.author}\n   ${b.reason||""}`).join('\n\n');
    navigator.clipboard.writeText(text).then(()=>addToast('📋 Recommendations copied to clipboard')).catch(()=>addToast('Could not copy to clipboard','error'));
  };

  const saveProfile=p=>{
    const updated=profiles.find(x=>x.id===p.id)?profiles.map(x=>x.id===p.id?p:x):[...profiles,p];
    saveProfiles(updated);setActiveProfileId(p.id);setAlreadyRead(new Set(p.alreadyRead||[]));setEditing(null);
    addToast('Student profile saved ✓');
  };

  const deleteProfile=id=>{
    saveProfiles(profiles.filter(p=>p.id!==id));
    if(activeProfileId===id){setActiveProfileId(null);setAlreadyRead(new Set());}
    setEditing(null);addToast('Profile deleted');
  };

  const loaded=bookCount>0;
  const modeLabels={similar:"Similar",tropes:"Trope",freetext:"Describe"};
  const modes=[{id:"similar",label:"Find Similar"},{id:"tropes",label:"By Trope"},{id:"freetext",label:"Describe It"}];

  return <div>
    <ToastContainer toasts={toasts}/>

    {/* HEADER */}
    <div className="header">
      <div className="header-top">
        <img className="logo" src={LOGO_FILE} alt="Fletcher Library"/>
        <div className="header-text">
          <div className="header-badge">Fletcher Middle School Library</div>
          <h1 className="header-title">Library Assistant</h1>
          <p className="header-sub">AI-powered book recommendations for your students</p>
        </div>
        <div className="header-actions">
          <button className={`header-btn${showAbout?" active":""}`} onClick={()=>{setShowAbout(p=>!p);setShowAnalytics(false);}}>About</button>
          <button className={`header-btn${showAnalytics?" active":""}`} onClick={()=>{setShowAnalytics(p=>!p);setShowAbout(false);}}>Stats</button>
        </div>
      </div>
      <div className="status-bar">
        <div className="status-item">
          <div className={`status-dot${loaded?" ready":""}`}/>
          <span>{loaded?`${bookCount.toLocaleString()} titles loaded`:"Loading catalog…"}</span>
        </div>
        <div className="status-item">
          <div className={`status-dot${embedReady===true?" ready":embedReady===false?"":""} ${embedReady===null?" loading":""}`}
               style={embedReady===false?{background:"var(--text3)"}:{}}/>
          <span>{embedReady===null?"Loading semantic search…":embedReady?"Semantic search ready":"Keyword search active"}</span>
        </div>
      </div>
    </div>

    {showAbout&&<AboutPanel/>}
    {showAnalytics&&<AnalyticsPanel analytics={analytics}/>}

    {loadError&&<div className="error-msg">⚠ Could not load the book catalog. Make sure {CSV_FILE} is in your repository.</div>}

    {loaded&&<>
      {/* PROFILES */}
      <div className="profile-section">
        <div className="section-label">Student Profile</div>
        <div className="profile-pills">
          <button className={`pill${!activeProfileId?" active":""}`} onClick={()=>selectProfile(null)}>No Profile</button>
          {profiles.map(p=><div key={p.id} style={{display:"flex",alignItems:"center"}}>
            <button className={`pill${activeProfileId===p.id?" active-left":""}`} onClick={()=>selectProfile(p.id)}>
              {p.initials} <span style={{fontSize:11,opacity:.7}}>{p.grade}</span>
            </button>
            {activeProfileId===p.id&&<button className="pill-edit" onClick={()=>setEditing(editing?.id===p.id?null:p)}>✎</button>}
          </div>)}
          {profiles.length<10&&<button className="pill-add" onClick={()=>setEditing({initials:"",grade:"6th",notes:"",reluctant:false,likedBooks:[],alreadyRead:[]})}>+ New</button>}
        </div>
        {activeProfile&&<div className="profile-meta">
          {activeProfile.notes&&<span className="profile-note">"{activeProfile.notes}"</span>}
          <button className="summary-btn" onClick={()=>setShowSummary(p=>!p)}>{showSummary?"Hide profile":"View profile"}</button>
          {activeProfile.reluctant&&<span className="reluctant-badge">⚡ Reluctant reader</span>}
        </div>}
      </div>

      {showSummary&&activeProfile&&<StudentSummary profile={activeProfile} onClose={()=>setShowSummary(false)}/>}
      {editing&&<ProfileEditor profile={editing} books={books} onSave={saveProfile} onDelete={deleteProfile} onCancel={()=>setEditing(null)}/>}

      {!editing&&<>
        {/* SEARCH HISTORY */}
        {searchHistory.length>0&&<div className="history-wrap">
          <div className="section-label" style={{marginBottom:6}}>Recent searches</div>
          <div className="history-chips">
            {searchHistory.map(h=><div key={h.id} className="history-chip" onClick={()=>{switchMode(h.mode);if(h.mode!=="tropes")setQuery(h.label);}}>
              <span className="history-mode">{modeLabels[h.mode]}</span>
              <span>{h.label.length>42?h.label.slice(0,42)+'…':h.label}</span>
            </div>)}
          </div>
        </div>}

        {/* TABS */}
        <div className="tabs">
          {modes.map(m=><button key={m.id} className={`tab${mode===m.id?" active":""}`} onClick={()=>switchMode(m.id)}>{m.label}</button>)}
        </div>

        {/* SEARCH INPUTS */}
        {mode==="similar"&&<div className="input-section">
          <div className="section-label">Book title</div>
          <MainInput value={query} onChange={onQueryChange} onEnter={search} suggestions={suggestions}
            onSelectSuggestion={b=>{setRefBook(b);setQuery(b.title);setSuggestions([]);}}
            clearSuggestions={()=>setSuggestions([])}/>
          <div className="input-hint">Select a title from the suggestions, then click Find Books</div>
        </div>}

        {mode==="freetext"&&<div className="input-section">
          <div className="section-label">Describe what the student is looking for</div>
          <textarea className="main-textarea" value={query} onChange={e=>setQuery(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();search();}}}
            rows={3} placeholder='e.g. "A fantasy with a strong female lead and a mystery to solve"'/>
          <div className="input-hint">Press Enter to search · Shift+Enter for a new line</div>
        </div>}

        {mode==="tropes"&&<div className="input-section">
          <p className="trope-hint">Click once to select · Click again to mark as must-have (★)</p>
          {CATS.map(cat=><div key={cat} className="trope-section">
            <div className="trope-cat">{cat}</div>
            <div className="trope-chips">
              {TROPES.filter(t=>t.cat===cat).map(t=>{
                const on=selTropes.has(t.id),isPrio=priorityTrope===t.id;
                return <button key={t.id} onClick={()=>toggleTrope(t.id)} className={`trope-chip${isPrio?" prio":on?" sel":""}`}>
                  {isPrio?"★ ":""}{t.label}
                </button>;
              })}
            </div>
          </div>)}
        </div>}

        {/* ALREADY READ */}
        <div className="input-section">
          <div className="section-label">Exclude books already read</div>
          <BookSearch books={books} exclude={alreadyRead} onSelect={b=>setAlreadyRead(prev=>new Set([...prev,b.title]))} placeholder="Add a book to exclude…"/>
          <ChipList items={[...alreadyRead]} onRemove={t=>setAlreadyRead(prev=>{const n=new Set(prev);n.delete(t);return n;})}/>
        </div>

        {/* LIKED BANNER */}
        {activeProfile?.likedBooks?.length>0&&<div className="liked-banner">
          <span className="liked-banner-icon">❤</span>
          <div className="liked-banner-text">
            <strong>Influencing recommendations</strong>
            {activeProfile.likedBooks.join(", ")}
          </div>
        </div>}

        {/* DIDNT LIKE */}
        <div className="input-section">
          <div className="section-label">What didn't they enjoy? <span style={{color:"var(--text3)",fontWeight:400,textTransform:"none",letterSpacing:0,fontSize:12}}>(optional)</span></div>
          <input className="main-input" value={didntLike} onChange={e=>setDidntLike(e.target.value)} placeholder='e.g. "too slow, too much romance, confusing ending"'/>
        </div>

        {error&&<div className="error-msg"><span>⚠</span>{error}</div>}

        {loading&&<LoadingView stageMsg={stageMsg}/>}
        {loadingMore&&<LoadingView stageMsg={stageMsg}/>}

        {!loading&&<button className="search-btn" onClick={search} disabled={loadingMore}>Find Books</button>}

        {/* RESULTS */}
        {results&&results.length>0&&!loading&&<div ref={resultsRef}>
          <div className="results-header">
            <span className="results-title">Recommendations</span>
            <div className="results-line"/>
            <span className="results-count">{results.length} titles</span>
          </div>
          {results.map((b,i)=><ResultCard key={`${b.title}-${i}`} book={b} index={i} activeProfile={activeProfile} onHeart={toggleHeart} onNoteSave={()=>addToast('Note saved ✓')}/>)}
          <div className="results-actions">
            <button className="action-btn" onClick={()=>window.print()}>🖨 Print</button>
            <button className="action-btn" onClick={copyResults}>📋 Copy list</button>
            {!loadingMore&&<button className="action-btn primary" onClick={searchMore}>Load more →</button>}
          </div>
        </div>}

        {results&&results.length===0&&!loading&&<div className="empty-state">
          <p className="empty-msg">No matching titles found.</p>
          <div className="empty-actions">
            <div className="empty-chip" onClick={()=>switchMode("freetext")}>Try describing it</div>
            <div className="empty-chip" onClick={()=>switchMode("tropes")}>Browse by trope</div>
            <div className="empty-chip" onClick={()=>setResults(null)}>Start over</div>
          </div>
        </div>}
      </>}
    </>}
  </div>;
}

const rootEl=document.getElementById("root");
if(ReactDOM.createRoot){ReactDOM.createRoot(rootEl).render(<App/>);}
else{ReactDOM.render(<App/>,rootEl);}
</script>
</body>
</html>
