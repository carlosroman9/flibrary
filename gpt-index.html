<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fletcher ReaderMatch</title>
  <link rel="icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface2: #f8fafc;
      --surface3: #eef2f7;
      --text: #0f172a;
      --muted: #64748b;
      --muted2: #94a3b8;
      --border: #e2e8f0;
      --blue: #1d4ed8;
      --blue2: #1e40af;
      --blueLt: #dbeafe;
      --teal: #0f766e;
      --tealLt: #ccfbf1;
      --green: #059669;
      --greenLt: #d1fae5;
      --amber: #d97706;
      --amberLt: #fef3c7;
      --red: #dc2626;
      --redLt: #fee2e2;
      --shadow: 0 8px 25px rgba(15,23,42,.08), 0 2px 7px rgba(15,23,42,.05);
      --shadow2: 0 18px 48px rgba(15,23,42,.12), 0 8px 18px rgba(15,23,42,.08);
      --r: 22px;
    }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 292px; flex-shrink: 0; background: rgba(255,255,255,.94); border-right: 1px solid var(--border); padding: 22px; position: sticky; top: 0; height: 100vh; overflow: auto; box-shadow: 1px 0 0 rgba(15,23,42,.02); }
    .brand { display: flex; gap: 12px; align-items: center; margin-bottom: 28px; }
    .brand-mark { width: 46px; height: 46px; border-radius: 18px; background: var(--blue); color: white; display: grid; place-items: center; font-size: 24px; box-shadow: var(--shadow); }
    .brand-title { font-family: 'Playfair Display', serif; font-size: 21px; font-weight: 900; line-height: 1.05; }
    .brand-sub { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .nav { display: grid; gap: 6px; }
    .nav-btn { border: 0; background: transparent; width: 100%; text-align: left; border-radius: 16px; padding: 13px 14px; display: flex; align-items: center; gap: 12px; font-weight: 700; color: #475569; transition: .16s ease; }
    .nav-btn:hover { background: var(--surface2); color: var(--text); }
    .nav-btn.on { background: var(--blue); color: white; box-shadow: 0 8px 20px rgba(29,78,216,.25); }
    .nav-icon { font-size: 18px; width: 23px; text-align: center; }
    .privacy-card { margin-top: 28px; padding: 16px; border-radius: 22px; border: 1px solid #a7f3d0; background: #ecfdf5; color: #065f46; }
    .privacy-card strong { display: block; font-size: 13px; margin-bottom: 6px; }
    .privacy-card p { font-size: 12px; line-height: 1.55; }
    .main { flex: 1; min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 50; padding: 16px 26px; background: rgba(255,255,255,.88); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .page-title { font-size: 25px; font-weight: 900; letter-spacing: -.03em; }
    .page-sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
    .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 7px 10px; font-size: 12px; font-weight: 800; border: 1px solid transparent; white-space: nowrap; }
    .badge.green { background: var(--greenLt); color: #047857; border-color: #a7f3d0; }
    .badge.amber { background: var(--amberLt); color: #92400e; border-color: #fde68a; }
    .badge.blue { background: var(--blueLt); color: #1e3a8a; border-color: #bfdbfe; }
    .content { padding: 26px; max-width: 1500px; margin: 0 auto; }
    .hero { position: relative; overflow: hidden; background: linear-gradient(135deg, #1e3a8a, #1d4ed8 50%, #0f766e); color: white; border-radius: 32px; padding: 34px; box-shadow: var(--shadow2); }
    .hero:after { content: ''; position: absolute; right: -80px; top: -120px; width: 360px; height: 360px; border-radius: 50%; background: rgba(255,255,255,.12); }
    .hero > * { position: relative; z-index: 1; }
    .hero-kicker { display: inline-flex; gap: 8px; align-items: center; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.2); color: #eff6ff; border-radius: 999px; padding: 7px 12px; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; font-weight: 900; margin-bottom: 14px; }
    .hero h2 { font-family: 'Playfair Display', serif; font-size: clamp(34px, 5vw, 58px); max-width: 850px; line-height: .98; font-weight: 900; }
    .hero p { margin-top: 16px; color: #dbeafe; font-size: 16px; line-height: 1.75; max-width: 730px; }
    .hero-actions { margin-top: 23px; display: flex; flex-wrap: wrap; gap: 10px; }
    .btn { border: 0; background: var(--surface); color: var(--text); padding: 10px 15px; border-radius: 15px; font-weight: 800; transition: .16s ease; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(15,23,42,.06); }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    .btn.primary { background: var(--blue); color: white; }
    .btn.primary:hover { background: var(--blue2); }
    .btn.light { background: white; color: var(--blue2); }
    .btn.ghost { background: rgba(255,255,255,.12); color: white; border: 1px solid rgba(255,255,255,.3); }
    .btn.outline { background: white; border: 1px solid var(--border); color: var(--text); box-shadow: none; }
    .btn.small { padding: 8px 11px; border-radius: 12px; font-size: 12px; }
    .grid { display: grid; gap: 18px; }
    .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 18px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); }
    .card.pad { padding: 22px; }
    .metric-icon { width: 44px; height: 44px; border-radius: 17px; background: #eff6ff; color: var(--blue); display: grid; place-items: center; font-size: 21px; margin-bottom: 14px; }
    .metric-val { font-size: 29px; font-weight: 900; letter-spacing: -.03em; }
    .metric-label { margin-top: 4px; font-size: 13px; font-weight: 800; color: #475569; }
    .metric-sub { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .section-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
    .section-head h3, .section-head h2 { font-size: 21px; font-weight: 900; letter-spacing: -.02em; }
    .section-head p { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .split { grid-template-columns: 2fr 1fr; margin-top: 18px; }
    .workflow-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .workflow { border: 1px solid var(--border); background: white; border-radius: 24px; padding: 20px; text-align: left; transition: .16s ease; }
    .workflow:hover { transform: translateY(-2px); border-color: #bfdbfe; box-shadow: var(--shadow); }
    .workflow .icon { font-size: 27px; margin-bottom: 12px; }
    .workflow h4 { font-size: 16px; font-weight: 900; }
    .workflow p { font-size: 13px; line-height: 1.6; color: var(--muted); margin-top: 8px; }
    .status-list { display: grid; gap: 12px; }
    .status-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
    .status-row span:first-child { color: #475569; font-weight: 700; }
    .recommend-layout { display: grid; grid-template-columns: 430px minmax(0, 1fr); gap: 22px; }
    .field { margin-bottom: 18px; }
    .label { display: block; font-size: 11px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .seg button { border: 1px solid var(--border); background: white; border-radius: 17px; padding: 12px 6px; font-weight: 900; color: #475569; transition: .16s ease; }
    .seg button.on { background: #eff6ff; color: var(--blue2); border-color: #93c5fd; }
    .input, .textarea, .select { width: 100%; border: 1px solid var(--border); background: white; border-radius: 17px; padding: 13px 14px; outline: none; font-size: 14px; color: var(--text); transition: .16s ease; }
    .textarea { resize: vertical; min-height: 126px; line-height: 1.65; }
    .input:focus, .textarea:focus, .select:focus { border-color: #60a5fa; box-shadow: 0 0 0 4px #dbeafe; }
    .filter-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 22px; padding: 16px; margin-bottom: 18px; }
    .filter-title { font-weight: 900; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .filter-row { background: white; border-radius: 15px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
    .filter-row:last-child { margin-bottom: 0; }
    .filter-row b { color: #475569; }
    .filter-row span { font-weight: 900; text-align: right; }
    .trope-cloud { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { border: 1px solid var(--border); background: white; color: #475569; border-radius: 999px; padding: 7px 11px; font-size: 12px; font-weight: 800; transition: .16s ease; }
    .chip:hover { border-color: #93c5fd; background: #eff6ff; color: var(--blue2); }
    .chip.on { background: var(--blue); color: white; border-color: var(--blue); }
    .chip.teal { background: #f0fdfa; color: #115e59; border-color: #99f6e4; }
    .chip.amber { background: var(--amberLt); color: #92400e; border-color: #fde68a; }
    .result-card { overflow: hidden; transition: .16s ease; }
    .result-card:hover { transform: translateY(-1px); box-shadow: var(--shadow2); }
    .result-inner { display: grid; grid-template-columns: 112px minmax(0, 1fr); }
    .cover-cell { background: linear-gradient(135deg, #eff6ff, #ccfbf1); padding: 18px; display: flex; align-items: center; justify-content: center; }
    .cover { width: 76px; height: 112px; border-radius: 14px; border: 1px solid #bfdbfe; background: white; box-shadow: 0 8px 18px rgba(15,23,42,.12); display: grid; place-items: center; font-size: 32px; overflow: hidden; }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .result-body { padding: 20px; }
    .result-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .match-badge { display: inline-flex; background: #f0fdfa; color: #115e59; border: 1px solid #99f6e4; border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 900; margin-bottom: 7px; }
    .result-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 900; line-height: 1.08; }
    .result-author { font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 4px; }
    .heart { border: 1px solid var(--border); background: white; width: 38px; height: 38px; border-radius: 14px; font-size: 18px; }
    .heart.on { background: #fff1f2; border-color: #fecdd3; color: #e11d48; }
    .reason-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .micro-label { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
    .reason-grid p { color: #334155; font-size: 14px; line-height: 1.65; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
    .result-actions { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .catalog-info { color: var(--muted); font-size: 13px; font-weight: 800; }
    .action-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .profile-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .avatar { width: 52px; height: 52px; border-radius: 19px; background: var(--blue); color: white; display: grid; place-items: center; font-weight: 900; box-shadow: var(--shadow); }
    .profile-head { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .profile-name { font-weight: 900; }
    .profile-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .tag-section { margin-top: 14px; }
    .insight-table { border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
    .insight-row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .insight-row:last-child { border-bottom: 0; }
    .insight-row strong { font-weight: 900; }
    .weak-list { display: grid; gap: 10px; }
    .weak-item { padding: 13px; border-radius: 17px; background: var(--amberLt); border: 1px solid #fde68a; color: #92400e; font-weight: 800; font-size: 13px; line-height: 1.5; }
    .list-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px; }
    .list-row + .list-row { border-top: 1px solid var(--border); }
    .list-title { font-weight: 900; }
    .list-meta { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .settings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .setting-row { background: var(--surface2); border-radius: 15px; padding: 12px 13px; display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 9px; font-size: 13px; }
    .setting-row span:first-child { color: #475569; font-weight: 800; }
    .setting-row span:last-child { font-weight: 900; text-align: right; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #0f172a; color: white; border-radius: 999px; padding: 11px 18px; font-size: 13px; font-weight: 800; box-shadow: var(--shadow2); z-index: 999; animation: toastIn .2s ease; }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .mobile-tabs { display: none; overflow-x: auto; gap: 8px; padding: 10px 14px; background: white; border-bottom: 1px solid var(--border); }
    .mobile-tabs .nav-btn { white-space: nowrap; width: auto; padding: 10px 12px; font-size: 12px; }
    .print-sheet { display: none; }
    @media (max-width: 1100px) {
      .sidebar { display: none; }
      .mobile-tabs { display: flex; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .split, .recommend-layout, .settings-grid { grid-template-columns: 1fr; }
      .profile-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .topbar { align-items: flex-start; flex-direction: column; padding: 14px 16px; }
      .content { padding: 16px; }
      .hero { padding: 24px; }
      .metrics, .workflow-grid, .profile-grid, .reason-grid { grid-template-columns: 1fr; }
      .result-inner { grid-template-columns: 1fr; }
      .cover-cell { display: none; }
      .seg { grid-template-columns: 1fr; }
    }
    @media print {
      body { background: white; }
      .sidebar, .topbar, .mobile-tabs, .content > *:not(.print-sheet), .toast { display: none !important; }
      .main { display: block; }
      .content { padding: 0; max-width: none; }
      .print-sheet { display: block !important; padding: 32px; }
      .print-title { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 900; margin-bottom: 6px; }
      .print-meta { color: #475569; margin-bottom: 22px; }
      .print-book { border-top: 1px solid #cbd5e1; padding: 16px 0; page-break-inside: avoid; }
      .print-book h3 { font-size: 18px; margin-bottom: 4px; }
      .print-book p { line-height: 1.5; margin-top: 6px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const CSV_FILE = "books_fiction_enriched.csv";
    const STORAGE = {
      profiles: "rm_profiles_v1",
      analytics: "rm_analytics_v1",
      lists: "rm_saved_lists_v1",
      settings: "rm_settings_v1"
    };

    const NAV = [
      ["dashboard", "Dashboard", "🏛️"],
      ["recommend", "Recommend", "✨"],
      ["profiles", "Reader Profiles", "👥"],
      ["analytics", "Analytics", "📊"],
      ["lists", "Saved Lists", "🔖"],
      ["settings", "Settings", "⚙️"],
    ];

    const TROPE_OPTIONS = [
      "Fantasy mystery", "Enemies to lovers", "Fast-paced", "Girl protagonist", "Special powers", "Magic school",
      "Sports story", "Friendship", "Found family", "Dystopian", "Murder mystery", "Humor", "Short chapters", "Graphic novel"
    ];

    const SAMPLE_BOOKS = [
      {
        title: "Amari and the Night Brothers", author: "B. B. Alston", isbn: "9780062975164",
        enriched_summary: "A girl discovers a secret supernatural bureau and competes to prove she belongs while investigating her missing brother.",
        enriched_subjects: "fantasy mystery magic school special powers girl protagonist fast-paced secret world friendship",
        series: "Supernatural Investigations"
      },
      {
        title: "The Marvellers", author: "Dhonielle Clayton", isbn: "9781250174949",
        enriched_summary: "A girl enters an elite magical academy and navigates friendship, prejudice, and mystery in a global magical world.",
        enriched_subjects: "magic school fantasy friendship belonging girl protagonist mystery identity",
        series: "The Marvellers"
      },
      {
        title: "Furthermore", author: "Tahereh Mafi", isbn: "9781101994764",
        enriched_summary: "A girl with unusual magic travels through a strange world to find her father and understand her own power.",
        enriched_subjects: "quest fantasy special powers girl protagonist adventure identity whimsy",
        series: "Furthermore"
      },
      {
        title: "City Spies", author: "James Ponti", isbn: "9781534414914",
        enriched_summary: "A team of young spies use their different talents to solve missions around the world.",
        enriched_subjects: "spy adventure fast-paced mystery teamwork heist action",
        series: "City Spies"
      },
      {
        title: "The Last Last-Day-of-Summer", author: "Lamar Giles", isbn: "9781328460837",
        enriched_summary: "Two cousins find themselves in a time-bending adventure full of humor, mystery, and action.",
        enriched_subjects: "mystery adventure humor time travel fast-paced friendship",
        series: "Legendary Alston Boys"
      }
    ];

    const DEFAULT_PROFILES = [
      { id: "ar", initials: "A.R.", grade: "7th", type: "Selective fantasy reader", likes: ["Percy Jackson", "Amari", "mysteries"], avoids: ["slow starts", "animal protagonists"], alreadyRead: [] },
      { id: "mk", initials: "M.K.", grade: "6th", type: "Reluctant reader", likes: ["sports", "funny books", "short chapters"], avoids: ["long books"], alreadyRead: [] },
      { id: "js", initials: "J.S.", grade: "8th", type: "Avid reader", likes: ["romance", "dystopian", "strong heroines"], avoids: ["predictable endings"], alreadyRead: [] },
    ];

    const DEFAULT_ANALYTICS = { total: 0, modes: { similar: 0, describe: 0, tropes: 0 }, tropeCounts: {}, recommended: {}, weak: [] };
    const DEFAULT_SETTINGS = { mascot: false, covers: true, summaries: true, professionalNotes: true, avoidRead: true };

    const stop = new Set("the and for that with this she her his him they their was are have has been from but not all can its you who one had what when into more will about after also some such than then them these those very just each like want wants book books story good read reading".split(" "));
    const load = (key, fallback) => { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; } };
    const save = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };
    const today = () => new Date().toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    const tokenize = (text) => (text || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(w => w.length > 2 && !stop.has(w));
    const bookText = (b) => `${b.title || ""} ${b.author || ""} ${b.series || ""} ${b.enriched_subjects || b.subjects || ""} ${b.enriched_summary || b.summary || ""}`;
    const normalizeBook = (b) => ({
      title: b.title || b.Title || b.TITLE || "Untitled",
      author: b.author || b.Author || b.AUTHOR || "Unknown author",
      isbn: b.isbn || b.ISBN || b.isbn13 || b.ISBN13 || "",
      series: b.series || b.Series || "",
      summary: b.summary || b.Summary || "",
      subjects: b.subjects || b.Subjects || "",
      enriched_summary: b.enriched_summary || b.enrichedSummary || b.summary || b.Summary || "",
      enriched_subjects: b.enriched_subjects || b.enrichedSubjects || b.subjects || b.Subjects || "",
      call_number: b.call_number || b.callNumber || b.call || b.Call || "FIC",
      available: b.available || b.Available || "Demo status"
    });

    function App() {
      const [active, setActive] = React.useState("dashboard");
      const [books, setBooks] = React.useState([]);
      const [catalogStatus, setCatalogStatus] = React.useState("Loading catalog…");
      const [profiles, setProfiles] = React.useState(() => load(STORAGE.profiles, DEFAULT_PROFILES));
      const [analytics, setAnalytics] = React.useState(() => load(STORAGE.analytics, DEFAULT_ANALYTICS));
      const [lists, setLists] = React.useState(() => load(STORAGE.lists, []));
      const [settings, setSettings] = React.useState(() => load(STORAGE.settings, DEFAULT_SETTINGS));
      const [toast, setToast] = React.useState("");
      const [results, setResults] = React.useState([]);
      const [lastRequest, setLastRequest] = React.useState("Fantasy mystery with a girl main character, hidden powers, and a fast-paced plot. Not too hard.");

      React.useEffect(() => {
        fetch(CSV_FILE)
          .then(r => {
            if (!r.ok) throw new Error("CSV not found");
            return r.text();
          })
          .then(text => {
            Papa.parse(text, {
              header: true,
              skipEmptyLines: true,
              complete: (res) => {
                const cleaned = res.data.map(normalizeBook).filter(b => b.title && b.title !== "Untitled");
                setBooks(cleaned.length ? cleaned : SAMPLE_BOOKS);
                setCatalogStatus(cleaned.length ? "Catalog Ready" : "Demo Catalog");
              }
            });
          })
          .catch(() => {
            setBooks(SAMPLE_BOOKS);
            setCatalogStatus("Demo Catalog");
          });
      }, []);

      React.useEffect(() => save(STORAGE.profiles, profiles), [profiles]);
      React.useEffect(() => save(STORAGE.analytics, analytics), [analytics]);
      React.useEffect(() => save(STORAGE.lists, lists), [lists]);
      React.useEffect(() => save(STORAGE.settings, settings), [settings]);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2300); };
      const page = NAV.find(n => n[0] === active) || NAV[0];
      const ctx = { books, catalogStatus, profiles, setProfiles, analytics, setAnalytics, lists, setLists, settings, setSettings, results, setResults, lastRequest, setLastRequest, showToast, setActive };

      return <>
        <div className="app">
          <aside className="sidebar">
            <Brand />
            <Nav active={active} setActive={setActive} />
            <div className="privacy-card">
              <strong>🛡️ Privacy-first demo</strong>
              <p>Reader profiles use initials and local browser data. The workflow is designed for librarian-mediated advisory.</p>
            </div>
          </aside>

          <main className="main">
            <header className="topbar">
              <div>
                <div className="page-title">{page[1]}</div>
                <div className="page-sub">AI-assisted readers’ advisory for the Fletcher Library collection</div>
              </div>
              <div className="top-actions">
                <span className={"badge " + (catalogStatus === "Catalog Ready" ? "green" : "amber")}>● {catalogStatus}</span>
                <button className="btn outline small" onClick={() => window.print()}>🖨️ Print</button>
              </div>
            </header>
            <div className="mobile-tabs"><Nav active={active} setActive={setActive} /></div>
            <section className="content">
              {active === "dashboard" && <Dashboard {...ctx} />}
              {active === "recommend" && <Recommend {...ctx} />}
              {active === "profiles" && <Profiles {...ctx} />}
              {active === "analytics" && <Analytics {...ctx} />}
              {active === "lists" && <SavedLists {...ctx} />}
              {active === "settings" && <SettingsPanel {...ctx} />}
              <PrintSheet results={results} lastRequest={lastRequest} />
            </section>
          </main>
        </div>
        {toast && <div className="toast">{toast}</div>}
      </>;
    }

    function Brand() {
      return <div className="brand">
        <div className="brand-mark">📚</div>
        <div>
          <div className="brand-title">Fletcher ReaderMatch</div>
          <div className="brand-sub">Professional Demo v1.0</div>
        </div>
      </div>;
    }

    function Nav({ active, setActive }) {
      return <nav className="nav">{NAV.map(([id, label, icon]) =>
        <button key={id} className={"nav-btn " + (active === id ? "on" : "")} onClick={() => setActive(id)}>
          <span className="nav-icon">{icon}</span><span>{label}</span>
        </button>
      )}</nav>;
    }

    function Dashboard({ books, catalogStatus, analytics, setActive }) {
      const topTrope = Object.entries(analytics.tropeCounts || {}).sort((a,b)=>b[1]-a[1])[0]?.[0] || "Fantasy mystery";
      return <div>
        <div className="hero">
          <div className="hero-kicker">✨ AI-assisted, librarian-controlled</div>
          <h2>Find the right book faster, using your actual catalog.</h2>
          <p>ReaderMatch turns vague student requests into librarian-friendly recommendations with explanations, profile context, and collection insights.</p>
          <div className="hero-actions">
            <button className="btn light" onClick={() => setActive("recommend")}>Generate Recommendations ›</button>
            <button className="btn ghost" onClick={() => setActive("analytics")}>View Insights</button>
          </div>
        </div>

        <div className="grid metrics">
          <Metric icon="🗄️" value={books.length.toLocaleString()} label="Fiction titles loaded" sub={catalogStatus === "Catalog Ready" ? "From your enriched CSV" : "Using demo fallback records"} />
          <Metric icon="✅" value={catalogStatus === "Catalog Ready" ? "Ready" : "Demo"} label="Catalog status" sub="GitHub Pages compatible" />
          <Metric icon="🔎" value={analytics.total || 0} label="Searches tracked" sub="Stored locally in this browser" />
          <Metric icon="📈" value={topTrope} label="Top request" sub="Based on saved demo analytics" />
        </div>

        <div className="grid split">
          <div className="card pad">
            <div className="section-head"><div><h3>Quick workflows</h3><p>Choose the path that matches the student conversation.</p></div></div>
            <div className="grid workflow-grid">
              <Workflow icon="✨" title="Similar Book" text="Start with a title the student already liked." onClick={() => setActive("recommend")} />
              <Workflow icon="📝" title="Describe It" text="Use natural language for vague requests." onClick={() => setActive("recommend")} />
              <Workflow icon="🎛️" title="Tropes & Themes" text="Browse story elements and appeal factors." onClick={() => setActive("recommend")} />
            </div>
          </div>
          <div className="card pad">
            <div className="section-head"><div><h3>Catalog health</h3><p>Professional demo readiness check.</p></div></div>
            <div className="status-list">
              <StatusRow label="Catalog import" status={catalogStatus} good={catalogStatus === "Catalog Ready"} />
              <StatusRow label="Recommendation engine" status="Local ranking" good />
              <StatusRow label="Reader profiles" status="Local demo" good={false} />
              <StatusRow label="Print sheets" status="Ready" good />
            </div>
          </div>
        </div>
      </div>;
    }

    function Metric({ icon, value, label, sub }) {
      return <div className="card pad"><div className="metric-icon">{icon}</div><div className="metric-val">{value}</div><div className="metric-label">{label}</div><div className="metric-sub">{sub}</div></div>;
    }
    function Workflow({ icon, title, text, onClick }) { return <button className="workflow" onClick={onClick}><div className="icon">{icon}</div><h4>{title}</h4><p>{text}</p></button>; }
    function StatusRow({ label, status, good }) { return <div className="status-row"><span>{label}</span><span className={"badge " + (good ? "green" : "amber")}>{good ? "✓" : "!"} {status}</span></div>; }

    function Recommend(props) {
      const { books, profiles, analytics, setAnalytics, results, setResults, lastRequest, setLastRequest, lists, setLists, showToast, setActive } = props;
      const [mode, setMode] = React.useState("describe");
      const [profileId, setProfileId] = React.useState(profiles[0]?.id || "");
      const [request, setRequest] = React.useState(lastRequest);
      const [selectedTropes, setSelectedTropes] = React.useState(["Fantasy mystery", "Girl protagonist", "Special powers", "Fast-paced"]);
      const [difficulty, setDifficulty] = React.useState("Easier / accessible");
      const profile = profiles.find(p => p.id === profileId) || profiles[0];

      function toggleTrope(t) {
        setSelectedTropes(prev => prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]);
      }

      function generate() {
        const query = [request, selectedTropes.join(" "), profile?.likes?.join(" "), difficulty].join(" ");
        const qTokens = tokenize(query);
        const qSet = new Set(qTokens);
        const already = new Set(profile?.alreadyRead || []);
        const scored = books
          .filter(b => !already.has(b.title))
          .map(b => {
            const txt = bookText(b);
            const toks = tokenize(txt);
            const tSet = new Set(toks);
            let score = 0;
            qSet.forEach(t => { if (tSet.has(t)) score += 3; });
            selectedTropes.forEach(trope => {
              tokenize(trope).forEach(t => { if (tSet.has(t)) score += 4; });
            });
            (profile?.likes || []).forEach(like => tokenize(like).forEach(t => { if (tSet.has(t)) score += 2; }));
            if (/easy|easier|accessible|short/.test(difficulty.toLowerCase() + " " + query.toLowerCase())) {
              if (/short|accessible|middle|fast|humor|graphic/.test(txt.toLowerCase())) score += 2;
            }
            return { ...b, score };
          })
          .sort((a,b)=>b.score-a.score)
          .slice(0, 6);
        const final = scored.length && scored[0].score > 0 ? scored : books.slice(0, 6);
        const enhanced = final.map((b, i) => ({ ...b, confidence: Math.max(68, Math.min(96, 96 - i*5 + Math.round((b.score || 0) / 3))), reason: makeReason(b, selectedTropes, profile), goodToKnow: makeGoodToKnow(b, difficulty) }));
        setResults(enhanced);
        setLastRequest(request);
        const tropeCounts = { ...(analytics.tropeCounts || {}) };
        selectedTropes.forEach(t => tropeCounts[t] = (tropeCounts[t] || 0) + 1);
        const recommended = { ...(analytics.recommended || {}) };
        enhanced.forEach(b => recommended[b.title] = (recommended[b.title] || 0) + 1);
        setAnalytics({ ...analytics, total: (analytics.total || 0) + 1, modes: { ...(analytics.modes || {}), [mode]: ((analytics.modes || {})[mode] || 0) + 1 }, tropeCounts, recommended });
        showToast("Recommendations generated");
      }

      function saveList() {
        if (!results.length) { showToast("Generate recommendations first"); return; }
        const item = { id: Date.now(), name: `${profile?.initials || "Reader"} recommendation list`, profile: profile?.initials || "No profile", request: lastRequest, createdAt: today(), books: results.map(b => ({ title: b.title, author: b.author, reason: b.reason })) };
        setLists([item, ...lists]);
        showToast("Saved recommendation list");
        setActive("lists");
      }

      return <div className="recommend-layout">
        <div className="card pad">
          <div className="section-head"><div><h2>Reader request</h2><p>Capture what the student means, not just keywords.</p></div></div>
          <div className="field"><label className="label">Mode</label><div className="seg">
            {[['similar','✨ Similar'], ['describe','📝 Describe'], ['tropes','🎛️ Tropes']].map(([id,label]) => <button key={id} className={mode===id?'on':''} onClick={()=>setMode(id)}>{label}</button>)}
          </div></div>
          <div className="field"><label className="label">Reader profile</label><select className="select" value={profileId} onChange={e=>setProfileId(e.target.value)}>{profiles.map(p=><option key={p.id} value={p.id}>{p.initials} · {p.grade} · {p.type}</option>)}</select></div>
          <div className="field"><label className="label">Request</label><textarea className="textarea" value={request} onChange={e=>setRequest(e.target.value)} /></div>
          <div className="field"><label className="label">Tropes & appeal factors</label><div className="trope-cloud">{TROPE_OPTIONS.map(t => <button key={t} className={'chip ' + (selectedTropes.includes(t)?'on':'')} onClick={()=>toggleTrope(t)}>{t}</button>)}</div></div>
          <div className="filter-box"><div className="filter-title">🎛️ Professional filters</div>
            <div className="filter-row"><b>Difficulty</b><select value={difficulty} onChange={e=>setDifficulty(e.target.value)}><option>Easier / accessible</option><option>Average middle grade</option><option>Challenging</option></select></div>
            <div className="filter-row"><b>Profile likes</b><span>{profile?.likes?.slice(0,3).join(', ') || 'None'}</span></div>
            <div className="filter-row"><b>Avoid</b><span>{profile?.avoids?.slice(0,2).join(', ') || 'None'}</span></div>
          </div>
          <button className="btn primary" style={{width:'100%', justifyContent:'center', padding:'15px'}} onClick={generate}>✨ Generate Recommendations</button>
        </div>

        <div>
          <div className="section-head"><div><h2>Recommended matches</h2><p>Structured explanations designed for librarian review.</p></div><div className="top-actions"><button className="btn outline small" onClick={saveList}>💾 Save list</button><button className="btn outline small" onClick={()=>window.print()}>🖨️ Print</button></div></div>
          <div className="grid">{results.length ? results.map((b,i)=><RecommendationCard key={b.title+i} book={b} index={i} showToast={showToast} />) : <EmptyRecommend generate={generate} />}</div>
        </div>
      </div>;
    }

    function makeReason(book, tropes, profile) {
      const txt = bookText(book).toLowerCase();
      const matched = tropes.filter(t => tokenize(t).some(tok => txt.includes(tok))).slice(0,3);
      const first = matched.length ? `Matches ${matched.join(', ').toLowerCase()}` : "Matches the overall request through subject, summary, and appeal-factor overlap";
      const profileBit = profile?.likes?.length ? ` It also connects to this reader's known interests: ${profile.likes.slice(0,2).join(' and ')}.` : "";
      return first + "." + profileBit;
    }
    function makeGoodToKnow(book, difficulty) {
      const txt = bookText(book).toLowerCase();
      if (txt.includes("graphic")) return "Strong choice for visual readers or students who prefer graphic formats.";
      if (txt.includes("mystery")) return "Good option when the student wants suspense, clues, and a reason to keep turning pages.";
      if (txt.includes("fantasy") || txt.includes("magic")) return "Best for readers open to world-building, unusual rules, and high-imagination settings.";
      if (difficulty.includes("Easier")) return "Review length and first chapter before handing to a reluctant reader.";
      return "Use librarian judgment for tone, maturity, and reading stamina fit.";
    }

    function Cover({ book }) {
      const [bad, setBad] = React.useState(false);
      const isbn = (book.isbn || '').replace(/[^0-9X]/gi, '');
      if (!isbn || bad) return <div className="cover">📘</div>;
      return <div className="cover"><img src={`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg`} onError={()=>setBad(true)} alt="" /></div>;
    }

    function RecommendationCard({ book, index, showToast }) {
      const [liked, setLiked] = React.useState(false);
      const summary = book.enriched_summary || book.summary || "Summary not available in this catalog record.";
      const tags = extractTags(book).slice(0,4);
      return <div className="card result-card">
        <div className="result-inner">
          <div className="cover-cell"><Cover book={book} /></div>
          <div className="result-body">
            <div className="result-top"><div><div className="match-badge">Match #{index+1} · {book.confidence || 82}% confidence</div><div className="result-title">{book.title}</div><div className="result-author">by {book.author}{book.series ? ` · ${book.series}` : ''}</div></div><button className={'heart '+(liked?'on':'')} onClick={()=>{setLiked(!liked); showToast(liked ? 'Removed from liked' : 'Marked as liked');}}>♥</button></div>
            <div className="reason-grid"><div><div className="micro-label">Why this fits</div><p>{book.reason}</p></div><div><div className="micro-label">Good to know</div><p>{book.goodToKnow}</p></div></div>
            <div className="tag-row">{tags.map(t=><span key={t} className="chip teal">{t}</span>)}</div>
            <div className="result-actions"><div className="catalog-info">{book.available || 'Available status unknown'} · {book.call_number || 'FIC'} {book.author?.split(' ').pop()?.toUpperCase() || ''}</div><div className="action-row"><button className="btn outline small" onClick={()=>showToast('Feedback saved: good match')}>👍 Good match</button><button className="btn outline small" onClick={()=>showToast('Feedback saved: not a fit')}>👎 Not a fit</button><button className="btn outline small" onClick={()=>alert(summary)}>👁️ Summary</button></div></div>
          </div>
        </div>
      </div>;
    }
    function extractTags(book) {
      const words = tokenize(book.enriched_subjects || book.subjects || book.enriched_summary || book.summary || '');
      const map = { fantasy:'Fantasy', mystery:'Mystery', magic:'Magic', friendship:'Friendship', adventure:'Adventure', sports:'Sports', romance:'Romance', humor:'Humor', powers:'Special powers', school:'School setting', dystopian:'Dystopian', family:'Family' };
      const out = [];
      Object.keys(map).forEach(k => { if (words.includes(k)) out.push(map[k]); });
      return out.length ? out : ['Catalog match', 'Reader appeal'];
    }
    function EmptyRecommend({ generate }) { return <div className="card pad" style={{textAlign:'center', padding:'52px'}}><div style={{fontSize:46}}>✨</div><h3 style={{fontSize:22, marginTop:12}}>Ready to recommend</h3><p style={{color:'var(--muted)', margin:'8px auto 18px', maxWidth:480, lineHeight:1.6}}>Generate a list to see professional recommendation cards with reasoning, appeal factors, catalog information, and feedback actions.</p><button className="btn primary" onClick={generate}>Generate sample recommendations</button></div>; }

    function Profiles({ profiles, setProfiles, showToast }) {
      function addProfile() {
        const initials = prompt("Reader initials, e.g. L.M.");
        if (!initials) return;
        const p = { id: Date.now().toString(), initials: initials.toUpperCase(), grade: "7th", type: "New reader profile", likes: [], avoids: [], alreadyRead: [] };
        setProfiles([p, ...profiles]);
        showToast("Profile added");
      }
      return <div>
        <div className="section-head"><div><h2>Reader profiles</h2><p>Professionalized version of the initials-based profile workflow.</p></div><button className="btn primary" onClick={addProfile}>👤 New profile</button></div>
        <div className="grid profile-grid">{profiles.map(p => <div className="card pad" key={p.id}><div className="profile-head"><div className="avatar">{p.initials}</div><div><div className="profile-name">Reader {p.initials}</div><div className="profile-meta">{p.grade} · {p.type}</div></div></div><TagSection title="Likes" tags={p.likes} /><TagSection title="Avoids" tags={p.avoids} amber /><button className="btn outline" style={{width:'100%', justifyContent:'center', marginTop:18}} onClick={()=>showToast('Profile editor coming next')}>Open profile</button></div>)}</div>
      </div>;
    }
    function TagSection({ title, tags, amber }) { return <div className="tag-section"><div className="micro-label">{title}</div><div className="tag-row">{(tags && tags.length ? tags : ['None recorded']).map(t=><span key={t} className={'chip '+(amber?'amber':'teal')}>{t}</span>)}</div></div>; }

    function Analytics({ analytics }) {
      const top = Object.entries(analytics.tropeCounts || {}).sort((a,b)=>b[1]-a[1]).slice(0,6);
      const recs = Object.entries(analytics.recommended || {}).sort((a,b)=>b[1]-a[1]).slice(0,6);
      return <div className="grid split">
        <div className="card pad"><div className="section-head"><div><h2>Collection insights</h2><p>Turns reader demand into professional library intelligence.</p></div></div><div className="insight-table">{(top.length ? top : [['Fantasy mystery', 42], ['Enemies to lovers', 31], ['Sports story', 24], ['Fast-paced easy fantasy', 19]]).map(([topic,count],i)=><div className="insight-row" key={topic}><strong>{topic}</strong><span>{count} searches</span><span className="badge green">+{i+6}%</span></div>)}</div></div>
        <div className="card pad"><div className="section-head"><div><h2>Most recommended</h2><p>Based on saved local analytics.</p></div></div><div className="weak-list">{(recs.length ? recs : [['Amari and the Night Brothers', 8], ['The Marvellers', 5], ['City Spies', 4]]).map(([title,count])=><div className="weak-item" key={title}>{title}<br/><span style={{fontWeight:600}}>{count} recommendations</span></div>)}</div></div>
      </div>;
    }

    function SavedLists({ lists, setLists, showToast }) {
      const demo = [{ id:'demo1', name:'A.R. fantasy mystery options', profile:'A.R.', createdAt:today(), books:[{title:'Amari and the Night Brothers'}], request:'Fantasy mystery with hidden powers' }];
      const shown = lists.length ? lists : demo;
      function clearLists() { setLists([]); showToast('Saved lists cleared'); }
      return <div><div className="section-head"><div><h2>Saved recommendation lists</h2><p>Print, share, and revisit advisory sessions.</p></div><button className="btn outline" onClick={clearLists}>Clear lists</button></div><div className="card">{shown.map(l=><div className="list-row" key={l.id}><div><div className="list-title">{l.name}</div><div className="list-meta">{l.books?.length || 0} books · {l.createdAt} · Reader profile {l.profile}</div><div className="list-meta">Request: {l.request}</div></div><div className="top-actions"><button className="btn outline small" onClick={()=>window.print()}>🖨️ Print</button><button className="btn outline small" onClick={()=>alert((l.books||[]).map(b=>`${b.title} ${b.author? 'by '+b.author : ''}`).join('\n'))}>Open</button></div></div>)}</div></div>;
    }

    function SettingsPanel({ books, catalogStatus, settings, setSettings, analytics, setAnalytics, showToast }) {
      function toggle(k) { setSettings({ ...settings, [k]: !settings[k] }); }
      function clearAnalytics() { setAnalytics(DEFAULT_ANALYTICS); showToast('Analytics cleared'); }
      return <div className="grid settings-grid">
        <SettingsCard title="Catalog" rows={[["Current file", CSV_FILE], ["Total records", books.length.toLocaleString()], ["Status", catalogStatus], ["Hosting", "GitHub Pages compatible"]]} />
        <div className="card pad"><h3>Recommendation rules</h3>{[["avoidRead","Avoid already-read titles"],["professionalNotes","Show professional notes"],["summaries","Show summaries"],["covers","Show cover images"],["mascot","Mascot animation"]].map(([k,label])=><div className="setting-row" key={k}><span>{label}</span><button className={'badge '+(settings[k]?'green':'amber')} onClick={()=>toggle(k)}>{settings[k]?'On':'Off'}</button></div>)}</div>
        <SettingsCard title="Display" rows={[["Product name", "Fletcher ReaderMatch"], ["Version", "Professional Demo v1.0"], ["Print sheets", "Ready"], ["Theme", "Navy / teal"]]} />
        <div className="card pad"><h3>Data</h3><div className="setting-row"><span>Profile storage</span><span>Local browser</span></div><div className="setting-row"><span>Analytics storage</span><span>Local browser</span></div><div className="setting-row"><span>Clear analytics</span><button className="btn outline small" onClick={clearAnalytics}>Clear</button></div></div>
      </div>;
    }
    function SettingsCard({ title, rows }) { return <div className="card pad"><h3>{title}</h3>{rows.map(([a,b])=><div className="setting-row" key={a}><span>{a}</span><span>{b}</span></div>)}</div>; }

    function PrintSheet({ results, lastRequest }) {
      return <div className="print-sheet"><div className="print-title">Fletcher Library Recommended Reads</div><div className="print-meta">Request: {lastRequest}<br/>Generated: {today()}</div>{results.map((b,i)=><div className="print-book" key={b.title+i}><h3>{i+1}. {b.title} by {b.author}</h3><p><strong>Why this fits:</strong> {b.reason}</p><p><strong>Good to know:</strong> {b.goodToKnow}</p></div>)}</div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
