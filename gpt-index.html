<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fletcher ReaderMatch | Fletcher Library</title>
  <link rel="icon" href="logo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --page:     #F7F5EE;
      --surface:  #FFFFFF;
      --surface2: #FBFAF6;
      --surface3: #F2E8C9;
      --navy:     #111111;
      --navy-dk:  #000000;
      --navy-lt:  #FFF4C2;
      --navy-txt: #3D2A00;
      --teal:     #D4A017;
      --teal-dk:  #9A6B00;
      --teal-lt:  #FFF8DD;
      --teal-bd:  #F1D37A;
      --text:     #111827;
      --text2:    #4B5563;
      --text3:    #9CA3AF;
      --border:   #E5E7EB;
      --border2:  #D1D5DB;
      --green:    #059669;
      --red:      #DC2626;
      --red-lt:   #FEF2F2;
      --amber:    #B77900;
      --amber-lt: #FFF8DD;
      --r:        14px;
      --sh-sm:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --sh:       0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
      --sh-lg:    0 10px 28px rgba(0,0,0,.1), 0 4px 10px rgba(0,0,0,.05);
    }

    body { font-family:'Inter',sans-serif; background:var(--page); color:var(--text); min-height:100vh; font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }

    #root { max-width:1080px; margin:0 auto; padding:0 1.5rem 6rem; }

    /* ── TIGER ── */
    .tiger { display:none; position:fixed; bottom:24px; right:24px; z-index:10; pointer-events:none; width:100px; transition:opacity .4s; filter:drop-shadow(0 4px 12px rgba(0,0,0,.2)); }
    .tiger.hide { opacity:0; }
    .tiger.show { opacity:1; }

    /* ── TOASTS ── */
    .toasts { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
    .toast { font-size:13px; font-weight:500; padding:10px 20px; border-radius:100px; box-shadow:var(--sh-lg); animation:tIn .2s ease both; white-space:nowrap; }
    .toast.success { background:var(--green); color:#fff; }
    .toast.error   { background:var(--red);   color:#fff; }
    .toast.info    { background:var(--text);   color:#fff; }
    @keyframes tIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    /* ── HEADER ── */
    .hdr { background:#111; border-bottom:3px solid #D4A017; margin-bottom:0; padding:0; position:sticky; top:0; z-index:100; box-shadow:0 6px 20px rgba(0,0,0,.18); }
    .hdr-inner { max-width:1080px; margin:0 auto; padding:0 1.5rem; display:flex; align-items:center; gap:16px; min-height:76px; }
    .hdr-logo { width:56px; height:56px; border-radius:14px; object-fit:contain; padding:6px; background:#fff; flex-shrink:0; border:2px solid #D4A017; box-shadow:0 4px 14px rgba(0,0,0,.25); }
    .hdr-brand { flex:1; }
    .hdr-title { font-family:'Playfair Display',serif; font-size:24px; font-weight:900; color:#fff; line-height:1.05; letter-spacing:.01em; }
    .hdr-sub { font-size:12px; color:#F6D66D; font-weight:600; letter-spacing:.02em; }
    .hdr-actions { display:flex; gap:6px; align-items:center; }
    .hdr-btn { padding:8px 15px; font-size:12px; font-weight:700; border:1px solid rgba(212,160,23,.6); background:rgba(255,255,255,.04); color:#F6D66D; border-radius:999px; cursor:pointer; transition:all .15s; white-space:nowrap; }
    .hdr-btn:hover { border-color:#F6D66D; color:#111; background:#F6D66D; }
    .hdr-btn.on { border-color:#F6D66D; color:#111; background:#F6D66D; }

    /* ── PAGE BODY ── */
    .page-body { padding-top:24px; }

    /* ── STATUS BAR ── */
    .status-bar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:10px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); margin-bottom:20px; box-shadow:var(--sh-sm); }
    .status-item { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:500; color:var(--text2); }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--text3); flex-shrink:0; }
    .dot.ready { background:var(--green); box-shadow:0 0 6px rgba(5,150,105,.4); }
    .dot.spin { background:var(--amber); animation:pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── CARD ── */
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:20px; margin-bottom:16px; box-shadow:var(--sh-sm); }
    .card-title { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--navy-txt); margin-bottom:14px; display:flex; align-items:center; gap:6px; }
    .card-title::before { content:''; display:block; width:3px; height:14px; background:var(--navy); border-radius:2px; }

    /* ── ABOUT ── */
    .about-card p { font-family:'Crimson Text',serif; font-size:15px; color:var(--text2); line-height:1.75; margin-bottom:10px; }
    .about-card p:last-of-type { margin-bottom:12px; }
    .about-card strong { font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--text); }
    .feature-tags { display:flex; flex-wrap:wrap; gap:6px; }
    .ftag { padding:4px 12px; background:var(--navy-lt); border:1px solid #BFDBFE; border-radius:100px; font-size:11px; font-weight:500; color:var(--navy-txt); }

    /* ── ANALYTICS ── */
    .stats-row { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .stat-box { flex:1; min-width:80px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:14px 12px; text-align:center; }
    .stat-n { font-family:'Playfair Display',serif; font-size:28px; font-weight:700; color:var(--navy); line-height:1; }
    .stat-l { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-top:4px; }
    .stat-cols { display:flex; gap:20px; flex-wrap:wrap; }
    .stat-col { flex:1; min-width:150px; }
    .stat-col-h { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border); }
    .stat-row { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:5px 0; border-bottom:1px solid var(--border); color:var(--text2); }
    .stat-row:last-child { border-bottom:none; }
    .stat-row span:last-child { font-weight:600; color:var(--navy); }
    .stat-empty { font-family:'Crimson Text',serif; font-size:14px; color:var(--text3); font-style:italic; }

    /* ── PROFILE SECTION ── */
    .section { margin-bottom:20px; }
    .sec-label { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text3); margin-bottom:8px; }
    .pills { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .pill { padding:6px 16px; font-size:13px; font-weight:500; border:1px solid var(--border); background:transparent; color:var(--text2); cursor:pointer; transition:all .15s; border-radius:100px; }
    .pill:hover { border-color:var(--navy); color:var(--navy); background:var(--navy-lt); }
    .pill.on { background:var(--navy); border-color:var(--navy); color:#fff; }
    .pill.on-l { border-radius:100px 0 0 100px; background:var(--navy); border-color:var(--navy); color:#fff; border-right:none; }
    .pill-edit { padding:6px 10px; border-radius:0 100px 100px 0; background:var(--surface); border:1px solid var(--navy); border-left:none; color:var(--navy); cursor:pointer; font-size:13px; transition:all .15s; }
    .pill-edit:hover { background:var(--navy-lt); }
    .pill-add { padding:6px 16px; font-size:13px; font-weight:500; border:1.5px dashed var(--border2); background:transparent; color:var(--text3); cursor:pointer; border-radius:100px; transition:all .15s; }
    .pill-add:hover { border-color:var(--navy); color:var(--navy); }
    .profile-meta { margin-top:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .profile-note { font-family:'Crimson Text',serif; font-size:14px; color:var(--text2); font-style:italic; }
    .profile-btn { font-size:12px; font-weight:500; padding:4px 12px; border:1px solid var(--border); background:transparent; color:var(--text2); border-radius:6px; cursor:pointer; transition:all .15s; }
    .profile-btn:hover { border-color:var(--navy); color:var(--navy); }
    .reluctant-tag { font-size:11px; font-weight:600; color:var(--amber); background:var(--amber-lt); border:1px solid #FDE68A; border-radius:100px; padding:3px 10px; }

    /* ── EDITOR ── */
    .editor { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:20px; margin-bottom:16px; box-shadow:var(--sh-sm); }
    .editor-title { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--navy-txt); margin-bottom:16px; display:flex; align-items:center; gap:6px; }
    .editor-title::before { content:''; display:block; width:3px; height:14px; background:var(--navy); border-radius:2px; }
    .ed-row { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
    .field { display:flex; flex-direction:column; gap:5px; }
    .field label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); }
    .finput { padding:9px 13px; font-size:14px; background:var(--surface2); border:1.5px solid var(--border); color:var(--text); border-radius:8px; outline:none; font-family:'Inter',sans-serif; transition:border-color .15s, box-shadow .15s; }
    .finput:focus { border-color:var(--navy); box-shadow:0 0 0 3px var(--navy-lt); }
    .finput::placeholder { color:var(--text3); }

    .toggle { display:flex; align-items:center; gap:12px; padding:11px 14px; background:var(--surface2); border:1.5px solid var(--border); border-radius:9px; cursor:pointer; transition:all .15s; margin-bottom:12px; }
    .toggle:hover, .toggle.on { border-color:var(--teal); background:var(--teal-lt); }
    .toggle-sw { width:38px; height:22px; background:var(--border2); border-radius:11px; position:relative; transition:background .15s; flex-shrink:0; }
    .toggle-sw.on { background:var(--teal); }
    .toggle-knob { position:absolute; top:3px; left:3px; width:16px; height:16px; background:#fff; border-radius:50%; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .toggle-sw.on .toggle-knob { left:19px; }
    .toggle-info { flex:1; }
    .toggle-lbl { font-size:13px; font-weight:500; color:var(--text); }
    .toggle-sub { font-size:12px; color:var(--text3); }

    /* ── SUMMARY ── */
    .summary-hd { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); margin-bottom:6px; padding-bottom:5px; border-bottom:1px solid var(--border); }
    .summary-sec { margin-bottom:12px; }
    .summary-item { font-family:'Crimson Text',serif; font-size:14px; color:var(--text2); padding:2px 0; }

    /* ── TABS ── */
    .tabs { display:flex; border-bottom:2px solid var(--border); margin-bottom:20px; }
    .tab { padding:10px 20px; font-size:13px; font-weight:500; background:transparent; border:none; border-bottom:2.5px solid transparent; cursor:pointer; color:var(--text3); transition:all .15s; margin-bottom:-2px; white-space:nowrap; }
    .tab:hover { color:var(--text2); }
    .tab.on { color:var(--navy); border-bottom-color:var(--navy); }

    /* ── INPUTS ── */
    .inp-sec { margin-bottom:16px; }
    .main-input { width:100%; padding:11px 14px; font-size:15px; font-family:'Inter',sans-serif; background:var(--surface); border:1.5px solid var(--border); color:var(--text); border-radius:9px; outline:none; transition:border-color .15s, box-shadow .15s; box-shadow:var(--sh-sm); }
    .main-input:focus { border-color:var(--navy); box-shadow:0 0 0 3px var(--navy-lt); }
    .main-input::placeholder { color:var(--text3); }
    .main-textarea { width:100%; padding:11px 14px; font-size:15px; font-family:'Crimson Text',serif; background:var(--surface); border:1.5px solid var(--border); color:var(--text); border-radius:9px; outline:none; resize:vertical; line-height:1.7; transition:border-color .15s, box-shadow .15s; box-shadow:var(--sh-sm); }
    .main-textarea:focus { border-color:var(--navy); box-shadow:0 0 0 3px var(--navy-lt); }
    .main-textarea::placeholder { color:var(--text3); }
    .inp-hint { font-size:12px; color:var(--text3); margin-top:5px; }

    /* ── DROPDOWN ── */
    .dd-wrap { position:relative; }
    .dd { position:absolute; top:calc(100% + 5px); left:0; right:0; z-index:50; background:var(--surface); border:1.5px solid var(--border); border-radius:10px; box-shadow:var(--sh-lg); overflow:hidden; }
    .dd-item { padding:11px 14px; font-size:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:baseline; gap:8px; border-bottom:1px solid var(--border); transition:background .1s; }
    .dd-item:last-child { border-bottom:none; }
    .dd-item:hover, .dd-item.hi { background:var(--surface2); }
    .dd-title { color:var(--text); font-weight:500; font-family:'Inter',sans-serif; }
    .dd-author { color:var(--text3); font-size:12px; flex-shrink:0; font-style:italic; font-family:'Crimson Text',serif; }

    /* ── TROPES ── */
    .trope-sec { margin-bottom:14px; }
    .trope-cat { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--text3); margin-bottom:8px; }
    .trope-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .tchip { padding:5px 14px; font-size:12px; font-weight:500; cursor:pointer; border:1.5px solid var(--border); background:var(--surface); color:var(--text2); transition:all .15s; border-radius:100px; box-shadow:var(--sh-sm); }
    .tchip:hover { border-color:var(--navy); color:var(--navy); background:var(--navy-lt); }
    .tchip.sel { background:var(--navy-lt); border-color:var(--navy); color:var(--navy-txt); font-weight:600; }
    .tchip.prio { background:var(--teal); border-color:var(--teal-dk); color:#fff; font-weight:600; }
    .trope-hint { font-family:'Crimson Text',serif; font-size:14px; color:var(--text3); font-style:italic; margin-bottom:14px; }

    /* ── CHIPS ── */
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .chip { display:flex; align-items:center; gap:5px; padding:4px 12px; background:var(--surface2); border:1px solid var(--border); font-size:13px; color:var(--text2); border-radius:100px; font-family:'Crimson Text',serif; }
    .chip.gold { border-color:#FDE68A; color:var(--amber); background:var(--amber-lt); }
    .chip-x { background:none; border:none; cursor:pointer; color:var(--text3); padding:0; font-size:16px; line-height:1; transition:color .1s; }
    .chip-x:hover { color:var(--red); }

    /* ── LIKED BANNER ── */
    .liked-banner { display:flex; align-items:flex-start; gap:10px; padding:12px 16px; background:var(--amber-lt); border:1.5px solid #FDE68A; border-radius:9px; margin-bottom:16px; }
    .liked-icon { font-size:16px; flex-shrink:0; margin-top:2px; }
    .liked-body { font-family:'Crimson Text',serif; font-size:14px; color:var(--text2); line-height:1.5; }
    .liked-body strong { font-family:'Inter',sans-serif; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--amber); display:block; margin-bottom:2px; }

    /* ── HISTORY ── */
    .history { margin-bottom:16px; }
    .history-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .hchip { display:flex; align-items:center; gap:7px; padding:5px 13px; background:var(--surface); border:1px solid var(--border); border-radius:100px; font-size:12px; color:var(--text2); cursor:pointer; transition:all .15s; box-shadow:var(--sh-sm); }
    .hchip:hover { border-color:var(--navy); color:var(--navy); background:var(--navy-lt); }
    .hmode { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--teal); }

    /* ── SEARCH BUTTON ── */
    .search-btn { width:100%; padding:14px; font-size:15px; font-weight:600; letter-spacing:.02em; background:var(--navy); color:#fff; border:none; border-radius:10px; cursor:pointer; transition:all .2s; margin-bottom:24px; box-shadow:0 4px 14px rgba(29,78,216,.3); }
    .search-btn:hover { background:var(--navy-dk); box-shadow:0 6px 20px rgba(29,78,216,.4); transform:translateY(-1px); }
    .search-btn:active { transform:translateY(0); box-shadow:0 2px 8px rgba(29,78,216,.3); }
    .search-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }

    /* ── RESULTS ── */
    .results-hdr { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
    .results-title { font-family:'Playfair Display',serif; font-size:21px; font-weight:700; color:var(--text); }
    .results-line { flex:1; height:1px; background:linear-gradient(to right,var(--border),transparent); }
    .results-count { font-size:12px; font-weight:500; color:var(--text3); white-space:nowrap; }

    .rcard { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:18px; margin-bottom:12px; border-left:4px solid var(--teal); animation:fadeUp .35s ease both; box-shadow:var(--sh-sm); transition:box-shadow .2s, transform .2s; }
    .rcard:hover { box-shadow:var(--sh); transform:translateY(-1px); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .rnum { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:6px; background:var(--teal-lt); border:1px solid var(--teal-bd); font-size:11px; font-weight:700; color:var(--teal-dk); margin-bottom:10px; }
    .rinner { display:flex; gap:14px; }
    .cover { width:62px; height:90px; flex-shrink:0; background:var(--surface2); border:1px solid var(--border); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:22px; object-fit:cover; transition:transform .2s; }
    .cover:hover { transform:scale(1.04); }
    .rbody { flex:1; min-width:0; }
    .rtitle-row { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:3px; }
    .rtitle { font-family:'Playfair Display',serif; font-weight:700; font-size:17px; color:var(--text); line-height:1.2; }
    .heart-btn { background:none; border:none; cursor:pointer; font-size:20px; padding:0; flex-shrink:0; line-height:1; transition:transform .15s; }
    .heart-btn:hover { transform:scale(1.2); }
    .rmeta { font-size:12px; font-weight:500; color:var(--text3); margin-bottom:9px; }
    .rseries { color:var(--teal); margin-left:6px; }
    .rreason { font-family:'Crimson Text',serif; font-size:14px; color:var(--text2); line-height:1.65; padding-left:10px; border-left:2px solid var(--teal-bd); }
    .cursor { display:inline-block; width:2px; height:13px; background:var(--teal); margin-left:2px; animation:blink .7s step-end infinite; vertical-align:middle; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .expand-btn { background:none; border:none; cursor:pointer; font-size:12px; font-weight:500; color:var(--text3); padding:0; margin-top:8px; display:flex; align-items:center; gap:4px; transition:color .15s; }
    .expand-btn:hover { color:var(--teal); }
    .earrow { display:inline-block; transition:transform .2s; font-size:9px; }
    .earrow.open { transform:rotate(90deg); }
    .summary-box { margin-top:10px; padding:12px 14px; background:var(--surface2); border-radius:8px; font-family:'Crimson Text',serif; font-size:14px; color:var(--text2); line-height:1.7; font-style:italic; border-left:3px solid var(--teal-bd); animation:fadeUp .2s ease; }
    .note-field { width:100%; margin-top:12px; padding:9px 13px; font-size:13px; background:var(--surface2); border:1.5px dashed var(--border2); color:var(--text); resize:none; font-family:'Inter',sans-serif; outline:none; line-height:1.6; border-radius:8px; transition:border-color .15s, box-shadow .15s; }
    .note-field:focus { border-color:var(--navy); border-style:solid; box-shadow:0 0 0 3px var(--navy-lt); }
    .note-field::placeholder { color:var(--text3); }

    /* ── RESULTS ACTIONS ── */
    .ractions { display:flex; gap:8px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
    .act-btn { padding:9px 20px; font-size:13px; font-weight:500; background:var(--surface); border:1.5px solid var(--border); color:var(--text2); border-radius:9px; cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:6px; box-shadow:var(--sh-sm); }

const CATS   = [...new Set(TROPES.map(t=>t.cat))];

function cosine(a,b){ let d=0,na=0,nb=0; for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];} return d/(Math.sqrt(na)*Math.sqrt(nb)||1); }
function setTiger(v){ const el=document.getElementById('corner-tiger'); if(el) el.className='tiger '+(v?'show':'hide'); }

// ── CANDIDATES ───────────────────────────────────────────────────────────
async function getCandidates(books,queryText,bookEmbeddings,likedKws=[],n=70,excl=null,alreadyRead=new Set(),shown=new Set(),refAuthor=null){
  const pool=books.filter(b=>b.title!==excl&&!alreadyRead.has(b.title)&&!shown.has(b.title));
  const authorLast=refAuthor?refAuthor.split(',')[0].trim().toLowerCase():null;
  const sameAuthor=new Set(authorLast?pool.filter(b=>(b.author||'').toLowerCase().includes(authorLast)).map(b=>b.title):[]);

  if(bookEmbeddings&&Object.keys(bookEmbeddings).length>0){
    try{
      const res=await fetch(EMBED_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:queryText})});
      if(!res.ok) throw new Error(`embed ${res.status}`);
      const{embedding:qEmb}=await res.json();
      const lSet=new Set(likedKws);
      const scored=pool.map(b=>{
        const bEmb=bookEmbeddings[b.title];
        const sim=bEmb?cosine(qEmb,bEmb):0;
        const toks=tokenize(`${b.enriched_subjects||b.subjects||''} ${b.enriched_summary||b.summary||''}`);
        const likedBoost=toks.filter(t=>lSet.has(t)).length*0.01;
        const authorBoost=sameAuthor.has(b.title)?0.15:0;
        return{...b,_s:sim+likedBoost+authorBoost};
      }).sort((a,b)=>b._s-a._s);
      return scored.slice(0,n);
    }catch(err){console.warn('Embedding failed — keyword fallback:',err);}
  }

  const kws=tokenize(queryText),kSet=new Set(kws),lSet=new Set(likedKws);
  let scored=pool.map(b=>{
    const st=new Set(tokenize(b.enriched_subjects||b.subjects||''));
    const sm=new Set(tokenize(b.enriched_summary||b.summary||''));
    const ti=new Set(tokenize(b.title||''));
    const base=[...kSet].filter(k=>st.has(k)).length*3+[...kSet].filter(k=>sm.has(k)).length+[...kSet].filter(k=>ti.has(k)).length;
    const liked=[...lSet].filter(k=>st.has(k)).length*4+[...lSet].filter(k=>sm.has(k)).length*2;
    const authorBoost=sameAuthor.has(b.title)?10:0;
    return{...b,_s:base+liked+authorBoost};
  }).filter(b=>b._s>0);
  if(!scored.length) scored=pool;
  return scored.sort((a,b)=>b._s-a._s).slice(0,n);
}

// ── CLAUDE CALL ──────────────────────────────────────────────────────────
async function callClaude(candidates,ctx,excluded=[],priorityLabel=null,likedTitles=[],likedThemes="",prefNote="",reluctantNote="",didntLikeNote=""){
  const exclNote=excluded.length?`\n\nDo NOT recommend: ${excluded.join(", ")}`:"";
  const prioNote=priorityLabel?`\n\nMust-have: "${priorityLabel}" — every pick MUST feature this.`:"";
  const likedNote=likedTitles.length?`\n\nThis student loved: ${likedTitles.join(", ")}. Weight toward similar feel.`:"";
  const list=candidates.map((b,i)=>`${i+1}. "${b.title}" by ${b.author}\n   ${(b.enriched_summary||b.summary||"").slice(0,200)}`).join("\n\n");
  const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,
      system:"You are an expert school librarian recommending middle school and YA fiction. Return only valid JSON arrays, no markdown.",
      messages:[{role:"user",content:`${ctx}${prioNote}${likedNote}${likedThemes}${prefNote}${reluctantNote}${didntLikeNote}${exclNote}\n\nChoose 6 best matches:\n\n${list}\n\nReturn ONLY: [{"title":"...","author":"...","reason":"1-2 sentence explanation"}]`}]})});
  const raw=await res.text();
  if(!res.ok) throw new Error(`Worker ${res.status}`);
  let data; try{data=JSON.parse(raw);}catch(e){console.error("Worker JSON error:",raw);throw e;}
  const text=data.content?.[0]?.text||"[]";
  const clean=text.replace(/```json|```/g,"").trim();
  const jsonText=(clean.match(/\[[\s\S]*\]/)||[clean])[0];
  return JSON.parse(jsonText);
}

// ── COMPONENTS ───────────────────────────────────────────────────────────
function Toasts({toasts}){ return <div className="toasts">{toasts.map(t=><div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>)}</div>; }

function CoverImg({isbn}){
  const[failed,setFailed]=React.useState(false);
  if(!isbn||failed) return <div className="cover">📖</div>;
  return <img className="cover" src={`https://covers.openlibrary.org/b/isbn/${isbn.replace(/[^0-9X]/g,"")}-M.jpg`} alt="" onError={()=>setFailed(true)}/>;
}

function TypewriterText({text}){
  const[displayed,setDisplayed]=React.useState("");
  const[done,setDone]=React.useState(false);
  React.useEffect(()=>{
    setDisplayed("");setDone(false);let i=0;
    const iv=setInterval(()=>{if(i<text.length){setDisplayed(text.slice(0,i+1));i++;}else{setDone(true);clearInterval(iv);}},16);
    return()=>clearInterval(iv);
  },[text]);
  return <span className="rreason">{displayed}{!done&&<span className="cursor"/>}</span>;
}

function NoteField({title,onSave}){
  const key=`note:${title}`;
  const[note,setNote]=React.useState(()=>localStorage.getItem(key)||"");
  const onChange=v=>{setNote(v);localStorage.setItem(key,v);};
  return <textarea className="note-field" value={note} onChange={e=>onChange(e.target.value)}
    onBlur={()=>{if(note&&onSave)onSave();}} placeholder="Librarian notes…" rows={1} onFocus={e=>e.target.rows=3}/>;
}

function ResultCard({book,index,activeProfile,onHeart,onNoteSave}){

  const isLiked=activeProfile?.likedBooks?.includes(book.title);
  const summary=book.enriched_summary||book.summary;
  const subjects=(book.enriched_subjects||book.subjects||"").split("|").map(s=>s.trim()).filter(Boolean).slice(0,4);
  return <div className="rcard" style={{animationDelay:`${index*0.07}s`}}>
    <div className="rnum">{ROMAN[index]||index+1}</div>
    <div className="rinner">
      <CoverImg isbn={book.isbn}/>

            {isLiked?"♥":"♡"}

        <div style={{fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:".07em",color:"var(--navy-txt)",marginBottom:4}}>Why this fits</div>
        <TypewriterText text={book.reason||""}/>
        <div className="pro-badges">
          {summary&&<span className="pro-badge">Summary available</span>}
          {(book.enriched_subjects||book.subjects)&&<span className="pro-badge">Subject data</span>}

        </div>
        {subjects.length>0&&<div className="chips" style={{marginTop:10}}>{subjects.map(s=><span key={s} className="chip gold">{s}</span>)}</div>}
        {summary&&<>
          <button className="expand-btn" onClick={()=>setExpanded(p=>!p)}>
            <span className={`earrow${expanded?" open":""}`}>▶</span>
            {expanded?"Hide catalog summary":"Read catalog summary"}

    </div>
    <NoteField title={book.title} onSave={onNoteSave}/>
  </div>;
}

function BookSearch({books,exclude,onSelect,placeholder}){
  const[inp,setInp]=React.useState("");const[sugg,setSugg]=React.useState([]);const[hi,setHi]=React.useState(-1);
  const onChange=v=>{setInp(v);setHi(-1);if(v.length>1)setSugg(books.filter(b=>(b.title||"").toLowerCase().includes(v.toLowerCase())&&!exclude.has(b.title)).slice(0,6));else setSugg([]);};
  const pick=b=>{onSelect(b);setInp("");setSugg([]);setHi(-1);};
  const onKD=e=>{if(!sugg.length)return;if(e.key==="ArrowDown"){e.preventDefault();setHi(h=>Math.min(h+1,sugg.length-1));}else if(e.key==="ArrowUp"){e.preventDefault();setHi(h=>Math.max(h-1,-1));}else if(e.key==="Enter"&&hi>=0){e.preventDefault();pick(sugg[hi]);}else if(e.key==="Escape"){setSugg([]);setHi(-1);}};
  return <div className="dd-wrap">
    <input className="finput" style={{width:"100%"}} value={inp} onChange={e=>onChange(e.target.value)} onKeyDown={onKD} placeholder={placeholder||"Type a title…"}/>
    {sugg.length>0&&<div className="dd">{sugg.map((b,i)=><div key={i} className={`dd-item${hi===i?" hi":""}`} onClick={()=>pick(b)}><span className="dd-title">{b.title}</span><span className="dd-author">{b.author}</span></div>)}</div>}
  </div>;
}

function MainInput({value,onChange,onEnter,suggestions,onSelect,clearSugg}){
  const[hi,setHi]=React.useState(-1);
  const onKD=e=>{
    if(suggestions.length){
      if(e.key==="ArrowDown"){e.preventDefault();setHi(h=>Math.min(h+1,suggestions.length-1));}
      else if(e.key==="ArrowUp"){e.preventDefault();setHi(h=>Math.max(h-1,-1));}
      else if(e.key==="Enter"&&hi>=0){e.preventDefault();onSelect(suggestions[hi]);setHi(-1);}
      else if(e.key==="Enter"){e.preventDefault();clearSugg();onEnter();}
      else if(e.key==="Escape"){clearSugg();setHi(-1);}
    }else if(e.key==="Enter"){e.preventDefault();onEnter();}
  };
  return <div className="dd-wrap">
    <input className="main-input" value={value} onChange={e=>onChange(e.target.value)} onKeyDown={onKD} placeholder="Start typing a title…"/>
    {suggestions.length>0&&<div className="dd">{suggestions.map((b,i)=><div key={i} className={`dd-item${hi===i?" hi":""}`} onClick={()=>{onSelect(b);setHi(-1);}}><span className="dd-title">{b.title}</span><span className="dd-author">{b.author}</span></div>)}</div>}
  </div>;
}

function ChipList({items,onRemove,gold}){
  if(!items.length) return null;
  return <div className="chips">{items.map((t,i)=><div key={i} className={`chip${gold?" gold":""}`}><span>{t}</span><button className="chip-x" onClick={()=>onRemove(t)}>×</button></div>)}</div>;
}

// ── APP ──────────────────────────────────────────────────────────────────
function App(){
  const[books,setBooks]=React.useState([]);
  const[bookCount,setBookCount]=React.useState(0);
  const[bookEmbeddings,setBookEmbeddings]=React.useState(null);
  const[embedReady,setEmbedReady]=React.useState(null);
  const[loadError,setLoadError]=React.useState(false);
  const[profiles,setProfiles]=React.useState(()=>lsLoad("profiles",[]));
  const[activeProfileId,setActiveProfileId]=React.useState(null);
  const[editing,setEditing]=React.useState(null);
  const[showStats,setShowStats]=React.useState(false);
  const[showAbout,setShowAbout]=React.useState(false);
  const[showSummary,setShowSummary]=React.useState(false);
  const[analytics,setAnalytics]=React.useState(()=>lsLoad("analytics",DEFAULT_ANALYTICS));
  const[mode,setMode]=React.useState("similar");
  const[query,setQuery]=React.useState("");
  const[selTropes,setSelTropes]=React.useState(new Set());
  const[priorityTrope,setPriorityTrope]=React.useState(null);
  const[alreadyRead,setAlreadyRead]=React.useState(new Set());
  const[didntLike,setDidntLike]=React.useState("");
  const[results,setResults]=React.useState(null);
  const[loading,setLoading]=React.useState(false);
  const[loadingMore,setLoadingMore]=React.useState(false);
  const[stageMsg,setStageMsg]=React.useState(STAGE_MSGS[0]);
  const[error,setError]=React.useState("");
  const[suggestions,setSuggestions]=React.useState([]);
  const[refBook,setRefBook]=React.useState(null);
  const[shownTitles,setShownTitles]=React.useState(new Set());
  const[toasts,setToasts]=React.useState([]);
  const[searchHistory,setSearchHistory]=React.useState([]);
  const lastSearch=React.useRef(null);
  const stageRef=React.useRef(null);
  const resultsRef=React.useRef(null);

  React.useEffect(()=>{
    fetch(CSV_FILE).then(r=>{if(!r.ok)throw new Error();return r.text();})
      .then(t=>Papa.parse(t,{header:true,skipEmptyLines:true,complete:r=>{setBooks(r.data);setBookCount(r.data.length);}}))
      .catch(()=>setLoadError(true));
  },[]);

  React.useEffect(()=>{
    fetch('book_embeddings.json').then(r=>{if(!r.ok)throw new Error();return r.json();})
      .then(d=>{setBookEmbeddings(d);setEmbedReady(true);console.log(`Embeddings: ${Object.keys(d).length} books`);})
      .catch(()=>{setBookEmbeddings({});setEmbedReady(false);});
  },[]);

  React.useEffect(()=>{
    setTiger(!(loading||loadingMore));
    if(loading||loadingMore){let i=0;stageRef.current=setInterval(()=>{i=(i+1)%STAGE_MSGS.length;setStageMsg(STAGE_MSGS[i]);},2000);}
    else{if(stageRef.current)clearInterval(stageRef.current);setStageMsg(STAGE_MSGS[0]);}
    return()=>{if(stageRef.current)clearInterval(stageRef.current);};
  },[loading,loadingMore]);

  React.useEffect(()=>{
    if(results?.length&&resultsRef.current) setTimeout(()=>resultsRef.current.scrollIntoView({behavior:'smooth',block:'start'}),150);
  },[results]);

  const addToast=(msg,type='success')=>{
    const id=Date.now()+Math.random();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),2800);
  };

  const saveProfiles=p=>{setProfiles(p);lsSave("profiles",p);};
  const saveAnalytics=a=>{setAnalytics(a);lsSave("analytics",a);};
  const activeProfile=profiles.find(p=>p.id===activeProfileId)||null;

  const selectProfile=id=>{
    setActiveProfileId(id);setEditing(null);setResults(null);
    setShownTitles(new Set());lastSearch.current=null;setShowSummary(false);
    setAlreadyRead(id?new Set(profiles.find(p=>p.id===id)?.alreadyRead||[]):new Set());
  };

  const toggleHeart=title=>{
    if(!activeProfile) return;
    const liked=activeProfile.likedBooks||[];
    const nowLiked=!liked.includes(title);
    const updated=nowLiked?[...liked,title]:liked.filter(t=>t!==title);
    saveProfiles(profiles.map(p=>p.id===activeProfileId?{...p,likedBooks:updated}:p));
    addToast(nowLiked?'❤ Added to liked books':'Removed from liked books');
  };

  const trackSearch=(m,tropes=[])=>{
    const a={...analytics,totalSearches:(analytics.totalSearches||0)+1,searchModes:{...analytics.searchModes,[m]:(analytics.searchModes[m]||0)+1},tropeSearches:{...analytics.tropeSearches}};
    tropes.forEach(t=>{a.tropeSearches[t]=(a.tropeSearches[t]||0)+1;});
    saveAnalytics(a);
  };

  const trackRecs=recs=>{
    const a={...analytics,recommendedBooks:{...analytics.recommendedBooks}};
    recs.forEach(b=>{a.recommendedBooks[b.title]=(a.recommendedBooks[b.title]||0)+1;});
    saveAnalytics(a);
  };

  const addToHistory=(label,m)=>setSearchHistory(p=>[{label,mode:m,id:Date.now()},...p.filter(e=>e.label!==label)].slice(0,5));

  const getLikedKws=()=>{
    if(!activeProfile?.likedBooks?.length) return[];
    const objs=books.filter(b=>activeProfile.likedBooks.includes(b.title));
    const st=objs.map(b=>b.enriched_subjects||b.subjects||"").join(" ");
    const sm=objs.map(b=>b.enriched_summary||b.summary||"").join(" ");
    return[...tokenize(st),...tokenize(st),...tokenize(st),...tokenize(sm)];
  };

  const getLikedThemes=()=>{
    if(!activeProfile?.likedBooks?.length) return"";
    const objs=books.filter(b=>activeProfile.likedBooks.includes(b.title));
    const all=objs.flatMap(b=>(b.enriched_subjects||b.subjects||"").split("|").map(s=>s.trim())).filter(Boolean);
    const unique=[...new Set(all)].slice(0,12);
    return unique.length?`\n\nThemes from books this student enjoyed: ${unique.join("; ")}. Prioritize books sharing these themes.`:"";
  };

  const onQueryChange=val=>{
    setQuery(val);setRefBook(null);
    if(mode==="similar"&&val.length>1) setSuggestions(books.filter(b=>(b.title||"").toLowerCase().includes(val.toLowerCase())).slice(0,6));
    else setSuggestions([]);
  };

  const toggleTrope=id=>{
    setSelTropes(prev=>{
      const n=new Set(prev);
      if(!n.has(id)){n.add(id);}
      else if(priorityTrope!==id){setPriorityTrope(id);}
      else{n.delete(id);setPriorityTrope(null);}
      return n;
    });
  };

  const switchMode=m=>{
    setMode(m);setResults(null);setError("");setQuery("");setRefBook(null);
    setSuggestions([]);setSelTropes(new Set());setPriorityTrope(null);
    setShownTitles(new Set());lastSearch.current=null;
  };

  const buildParams=()=>{
    let ctx="",excl=null,priorityLabel=null;
    if(mode==="similar"){
      const ref=refBook||books.find(b=>(b.title||"").toLowerCase()===query.toLowerCase());
      if(!ref) return null;
      excl=ref.title;
      ctx=`A student loved "${ref.title}" by ${ref.author}.\n\nSummary: ${ref.enriched_summary||ref.summary||""}\n\nFind books with similar themes, characters, tone, and plot elements.`;
    } else if(mode==="tropes"){
      if(!selTropes.size) return null;
      const labels=TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label);
      if(priorityTrope) priorityLabel=TROPES.find(t=>t.id===priorityTrope)?.label;
      ctx=`A student wants books with: ${labels.join(", ")}. Find the best matches.`;
    } else {
      if(!query.trim()) return null;
      ctx=`A student wants: "${query}". Find the best matches.`;
    }
    return{ctx,excl,priorityLabel};
  };

  const buildQueryText=()=>{
    if(mode==="similar"&&refBook)
      return `${refBook.title} ${refBook.author} ${refBook.enriched_subjects||refBook.subjects||""} ${refBook.enriched_summary||refBook.summary||""}`;
    if(mode==="tropes"){
      const labels=TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label);
      return[...new Set(labels.flatMap(l=>{const id=TROPES.find(t=>t.label===l)?.id;return[...tokenize(l),...(TROPE_KEYWORDS[id]||[])]}))].join(' ');
    }
    return query;
  };

  const runSearch=async(params,shown,isMore=false)=>{
    const{ctx,excl,priorityLabel}=params;
    const queryText=buildQueryText();
    const refAuthor=(mode==='similar'&&refBook)?refBook.author:null;
    const cands=await getCandidates(books,queryText,bookEmbeddings,getLikedKws(),70,excl,alreadyRead,shown,refAuthor);
    const prefNote=activeProfile?.notes?`\n\nStudent reading preferences: ${activeProfile.notes}. Please respect these.`:"";
    const reluctantNote=activeProfile?.reluctant?`\n\nThis is a reluctant reader — ONLY recommend fast-paced books with short chapters and high action.`:"";
    const didntLikeNote=didntLike.trim()?`\n\nThe student did NOT enjoy: "${didntLike.trim()}". Avoid books with these qualities.`:"";
    const recs=await callClaude(cands,ctx,[...alreadyRead,...shown],priorityLabel,activeProfile?.likedBooks||[],getLikedThemes(),prefNote,reluctantNote,didntLikeNote);
    const enriched=recs.map(r=>({...(books.find(b=>b.title===r.title&&b.author===r.author)||books.find(b=>b.title===r.title)||r),...r}));
    setShownTitles(new Set([...shown,...enriched.map(b=>b.title)]));
    if(isMore) setResults(p=>[...(p||[]),...enriched]);
    else setResults(enriched);
    trackRecs(enriched);
  };

  const search=async()=>{
    setError("");setResults(null);setLoading(true);setShownTitles(new Set());lastSearch.current=null;
    try{
      const params=buildParams();
      if(!params){setError(mode==="similar"?"Please select a title from the list.":mode==="tropes"?"Please select at least one trope.":"Please describe what the student is looking for.");setLoading(false);return;}
      lastSearch.current=params;
      const histLabel=mode==="similar"?query:mode==="tropes"?TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label).join(', '):query;
      addToHistory(histLabel,mode);
      await runSearch(params,new Set());
      trackSearch(mode,mode==="tropes"?[...selTropes]:[]);
    }catch(e){console.error(e);setError("Search failed. Please check your connection and try again.");}
    setLoading(false);
  };

  const searchMore=async()=>{
    if(!lastSearch.current) return;
    setLoadingMore(true);
    try{await runSearch(lastSearch.current,shownTitles,true);}
    catch{setError("Search failed. Please try again.");}
    setLoadingMore(false);
  };

  const copyResults=()=>{
    if(!results?.length) return;
    const text=results.map((b,i)=>`${ROMAN[i]||i+1}. ${b.title} by ${b.author}\n   ${b.reason||""}`).join('\n\n');
    navigator.clipboard.writeText(text).then(()=>addToast('📋 Recommendations copied')).catch(()=>addToast('Could not copy','error'));
  };

  const saveProfile=p=>{
    const updated=profiles.find(x=>x.id===p.id)?profiles.map(x=>x.id===p.id?p:x):[...profiles,p];
    saveProfiles(updated);setActiveProfileId(p.id);setAlreadyRead(new Set(p.alreadyRead||[]));setEditing(null);
    addToast('Student profile saved ✓');
  };

  const deleteProfile=id=>{
    saveProfiles(profiles.filter(p=>p.id!==id));
    if(activeProfileId===id){setActiveProfileId(null);setAlreadyRead(new Set());}
    setEditing(null);addToast('Profile deleted');
  };

  const loaded=bookCount>0;
  const modeLbls={similar:"Similar",tropes:"Trope",freetext:"Describe"};

  // Wire header buttons to React state via portal
  React.useEffect(()=>{
    const el=document.getElementById('hdr-btns');
    if(!el) return;
    const root=ReactDOM.createRoot?ReactDOM.createRoot(el):null;
    if(root){
      root.render(<>
        <button className={`hdr-btn${showAbout?" on":""}`} onClick={()=>{setShowAbout(p=>!p);setShowStats(false);}}>About</button>
        <button className={`hdr-btn${showStats?" on":""}`} onClick={()=>{setShowStats(p=>!p);setShowAbout(false);}}>Stats</button>
      </>);
    }
  },[showAbout,showStats]);

  return <div className="page-body">
    <Toasts toasts={toasts}/>

    {/* STATUS BAR */}
    <div className="status-bar">
      <div className="status-item"><div className={`dot${loaded?" ready":""}`}/><span>{loaded?`${bookCount.toLocaleString()} titles loaded`:"Loading catalog…"}</span></div>
      <div className="status-item">
        <div className={`dot${embedReady===true?" ready":embedReady===null?" spin":""}`}/>
        <span>{embedReady===null?"Initializing semantic search…":embedReady?"Semantic search ready":"Keyword search active"}</span>
      </div>
    </div>

    <section className="fletcher-hero">
      <div className="hero-kicker">Fletcher Library · Professional Demo</div>
      <div className="hero-title">Catalog-based recommendations for real student readers.</div>
      <p className="hero-copy">Use the same working recommendation engine from the original prototype, now wrapped in a cleaner black-and-gold Fletcher Library interface. This version uses your catalog and your original trope set — no generic demo categories.</p>
      <div className="hero-metrics">
        <div className="hero-metric"><strong>{loaded?bookCount.toLocaleString():"—"}</strong><span>Fletcher fiction records</span></div>
        <div className="hero-metric"><strong>{TROPES.length}</strong><span>Original advisory tropes</span></div>
        <div className="hero-metric"><strong>{profiles.length}</strong><span>Local reader profiles</span></div>
      </div>
    </section>

    {showAbout&&<AboutPanel/>}
    {showStats&&<AnalyticsPanel analytics={analytics}/>}

    {loadError&&<div className="error-msg">⚠ Could not load the book catalog. Make sure {CSV_FILE} is in your repository.</div>}

    {loaded&&<>
      <div className="review-note">
        <div style={{fontSize:20}}>⚠</div>
        <div><strong>Librarian review required</strong><p>ReaderMatch supports professional readers’ advisory. Please review tone, difficulty, content, and student context before recommending a title.</p></div>
      </div>
      {/* STUDENT PROFILES */}
      <div className="section">
        <div className="sec-label">Student Profile</div>
        <div className="pills">
          <button className={`pill${!activeProfileId?" on":""}`} onClick={()=>selectProfile(null)}>No Profile</button>
          {profiles.map(p=><div key={p.id} style={{display:"flex",alignItems:"center"}}>
            <button className={`pill${activeProfileId===p.id?" on-l":""}`} onClick={()=>selectProfile(p.id)}>
              {p.initials} <span style={{fontSize:11,opacity:.7,marginLeft:2}}>{p.grade}</span>
            </button>
            {activeProfileId===p.id&&<button className="pill-edit" onClick={()=>setEditing(editing?.id===p.id?null:p)}>✎</button>}
          </div>)}
          {profiles.length<10&&<button className="pill-add" onClick={()=>setEditing({initials:"",grade:"6th",notes:"",reluctant:false,likedBooks:[],alreadyRead:[]})}>+ New Profile</button>}
        </div>
        {activeProfile&&<div className="profile-meta">
          {activeProfile.notes&&<span className="profile-note">"{activeProfile.notes}"</span>}
          <button className="profile-btn" onClick={()=>setShowSummary(p=>!p)}>{showSummary?"Hide":"View profile"}</button>
          {activeProfile.reluctant&&<span className="reluctant-tag">⚡ Reluctant reader</span>}
        </div>}
      </div>

      {showSummary&&activeProfile&&<ProfileSummary profile={activeProfile} onClose={()=>setShowSummary(false)}/>}
      {editing&&<ProfileEditor profile={editing} books={books} onSave={saveProfile} onDelete={deleteProfile} onCancel={()=>setEditing(null)}/>}

      {!editing&&<>
        {/* SEARCH HISTORY */}
        {searchHistory.length>0&&<div className="history">
          <div className="sec-label" style={{marginBottom:8}}>Recent searches</div>
          <div className="history-chips">
            {searchHistory.map(h=><div key={h.id} className="hchip" onClick={()=>{switchMode(h.mode);if(h.mode!=="tropes")setQuery(h.label);}}>
              <span className="hmode">{modeLbls[h.mode]}</span>
              <span>{h.label.length>42?h.label.slice(0,42)+'…':h.label}</span>
            </div>)}
          </div>
        </div>}

        {/* SEARCH MODES */}
        <div className="tabs">
          {[{id:"similar",label:"Find Similar"},{id:"tropes",label:"By Trope"},{id:"freetext",label:"Describe It"}].map(m=>(
            <button key={m.id} className={`tab${mode===m.id?" on":""}`} onClick={()=>switchMode(m.id)}>{m.label}</button>
          ))}
        </div>

        {mode==="similar"&&<div className="inp-sec">
          <div className="sec-label">Book title</div>
          <MainInput value={query} onChange={onQueryChange} onEnter={search} suggestions={suggestions}
            onSelect={b=>{setRefBook(b);setQuery(b.title);setSuggestions([]);}} clearSugg={()=>setSuggestions([])}/>
          <div className="inp-hint">Select a title from the suggestions, then click Find Books</div>
        </div>}

        {mode==="freetext"&&<div className="inp-sec">
          <div className="sec-label">Describe what the student is looking for</div>
          <textarea className="main-textarea" value={query} onChange={e=>setQuery(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();search();}}}
            rows={3} placeholder='e.g. "A fantasy with a strong female lead who discovers she has hidden powers"'/>
          <div className="inp-hint">Press Enter to search · Shift+Enter for a new line</div>
        </div>}

        {mode==="tropes"&&<div className="inp-sec">
          <p className="trope-hint">Select one or more tropes · Click again to mark as must-have (★)</p>
          {CATS.map(cat=><div key={cat} className="trope-sec">
            <div className="trope-cat">{cat}</div>
            <div className="trope-chips">
              {TROPES.filter(t=>t.cat===cat).map(t=>{
                const on=selTropes.has(t.id),isPrio=priorityTrope===t.id;
                return <button key={t.id} onClick={()=>toggleTrope(t.id)} className={`tchip${isPrio?" prio":on?" sel":""}`}>
                  {isPrio?"★ ":""}{t.label}
                </button>;
              })}
            </div>
          </div>)}
        </div>}

        {/* ALREADY READ */}
        <div className="inp-sec">
          <div className="sec-label">Exclude books already read</div>
          <BookSearch books={books} exclude={alreadyRead} onSelect={b=>setAlreadyRead(prev=>new Set([...prev,b.title]))} placeholder="Add a title to exclude…"/>
          <ChipList items={[...alreadyRead]} onRemove={t=>setAlreadyRead(prev=>{const n=new Set(prev);n.delete(t);return n;})}/>
        </div>

        {/* LIKED BANNER */}
        {activeProfile?.likedBooks?.length>0&&<div className="liked-banner">
          <span className="liked-icon">❤</span>
          <div className="liked-body">
            <strong>Influencing recommendations</strong>
            {activeProfile.likedBooks.join(", ")}
          </div>
        </div>}

        {/* DIDNT LIKE */}
        <div className="inp-sec">
          <div className="sec-label">What didn't the student enjoy? <span style={{color:"var(--text3)",fontWeight:400,textTransform:"none",letterSpacing:0,fontSize:12}}>(optional)</span></div>
          <input className="main-input" value={didntLike} onChange={e=>setDidntLike(e.target.value)} placeholder='e.g. "too slow, too much romance, confusing ending"'/>
        </div>

        {error&&<div className="error-msg"><span>⚠</span>{error}</div>}

        {loading&&<LoadingView stageMsg={stageMsg}/>}
        {loadingMore&&<LoadingView stageMsg={stageMsg}/>}

        {!loading&&<button className="search-btn" onClick={search} disabled={loadingMore}>Find Books</button>}

        {/* RESULTS */}
        {results&&results.length>0&&!loading&&<div ref={resultsRef}>
          <div className="results-hdr">
            <span className="results-title">Recommendations</span>
            <div className="results-line"/>
            <span className="results-count">{results.length} titles</span>
          </div>
          {results.map((b,i)=><ResultCard key={`${b.title}-${i}`} book={b} index={i} activeProfile={activeProfile} onHeart={toggleHeart} onNoteSave={()=>addToast('Note saved ✓')}/>)}
          <div className="ractions">
            <button className="act-btn" onClick={()=>window.print()}>🖨 Print</button>
            <button className="act-btn" onClick={copyResults}>📋 Copy list</button>
            <button className="act-btn" onClick={()=>addToast('Use Print to create a polished handout ✓','info')}>✨ Book talk ready</button>
            {!loadingMore&&<button className="act-btn primary" onClick={searchMore}>Load more →</button>}
          </div>
        </div>}

        {results&&results.length===0&&!loading&&<div className="empty">
          <p className="empty-title">No matching titles found.</p>
          <p className="empty-sub">Try broadening your search or using a different mode.</p>
          <div className="empty-actions">
            <div className="echip" onClick={()=>switchMode("freetext")}>Try describing it</div>
            <div className="echip" onClick={()=>switchMode("tropes")}>Browse by trope</div>
            <div className="echip" onClick={()=>setResults(null)}>Start over</div>
          </div>
        </div>}
      </>}
    </>}
  </div>;
}

const rootEl=document.getElementById("root");
if(ReactDOM.createRoot){ReactDOM.createRoot(rootEl).render(<App/>);}
else{ReactDOM.render(<App/>,rootEl);}
</script>
</body>
</html>
