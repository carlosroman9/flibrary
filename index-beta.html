<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fletcher ReaderMatch — Structured Judgment v6</title>
  <link rel="icon" href="logo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>

@font-face {
  font-family: "SNF Little Star";
  src: url("snflittlestar%20(1).ttf") format("truetype"),
       url("snflittlestar (1).ttf") format("truetype"),
       url("snflittlestar.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
:root { --display-font: "SNF Little Star", Cinzel, serif; }


*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black:#050403;
  --ink:#0a0906;
  --panel:rgba(18,16,11,.88);
  --panel2:rgba(31,26,17,.78);
  --panel3:rgba(54,42,24,.58);
  --gold:#d6aa3d;
  --gold2:#f1cf6b;
  --gold3:#9e7422;
  --cream:#f4e7c6;
  --paper:#e7d2a0;
  --muted:#b9a879;
  --dim:#7b6b4a;
  --line:rgba(214,170,61,.34);
  --line2:rgba(244,231,198,.12);
  --green:#a9cf99;
  --red:#d88b68;
  --red-lt:rgba(216,139,104,.12);
  --amber:#d6aa3d;
  --amber-lt:rgba(214,170,61,.12);
  --page:#050403;
  --surface:rgba(18,16,11,.88);
  --surface2:rgba(244,231,198,.055);
  --surface3:rgba(214,170,61,.10);
  --navy:#d6aa3d;
  --navy-dk:#9e7422;
  --navy-lt:rgba(214,170,61,.14);
  --navy-txt:#f1cf6b;
  --teal:#f1cf6b;
  --teal-dk:#d6aa3d;
  --teal-lt:rgba(214,170,61,.12);
  --teal-bd:rgba(214,170,61,.34);
  --text:#f4e7c6;
  --text2:#cdbf98;
  --text3:#8f7f5e;
  --border:rgba(214,170,61,.24);
  --border2:rgba(214,170,61,.42);
  --r:24px;
  --sh-sm:0 10px 30px rgba(0,0,0,.22);
  --sh:0 20px 55px rgba(0,0,0,.36);
  --sh-lg:0 26px 80px rgba(0,0,0,.55);
}

html, body {
  min-height: 100%;
  background: var(--black);
  color: var(--cream);
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body {
  overflow-x: hidden;
  background:
    radial-gradient(circle at 20% 10%,rgba(214,170,61,.15),transparent 30%),
    radial-gradient(circle at 86% 10%,rgba(214,170,61,.10),transparent 28%),
    radial-gradient(circle at 55% 120%,rgba(214,170,61,.12),transparent 42%),
    linear-gradient(135deg,#050403 0%,#11100c 50%,#050403 100%);
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.24;
  background-image:
    linear-gradient(rgba(244,231,198,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(244,231,198,.035) 1px,transparent 1px);
  background-size:88px 88px;
  mask-image:radial-gradient(circle at center,#000,transparent 84%);
}

body::after {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.42;
  background:
    radial-gradient(circle at 11% 15%,rgba(255,255,255,.45) 0 1px,transparent 1.4px),
    radial-gradient(circle at 27% 7%,rgba(255,255,255,.25) 0 1px,transparent 1.4px),
    radial-gradient(circle at 47% 11%,rgba(255,255,255,.35) 0 1px,transparent 1.4px),
    radial-gradient(circle at 68% 6%,rgba(255,255,255,.25) 0 1px,transparent 1.4px),
    radial-gradient(circle at 92% 23%,rgba(255,255,255,.2) 0 1px,transparent 1.4px),
    radial-gradient(circle at 80% 82%,rgba(255,255,255,.18) 0 1px,transparent 1.4px);
}

#root {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 34px 64px;
}

.app-shell {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 286px minmax(0,1fr);
  min-height: 100vh;
}

.side {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
  padding: 26px 18px;
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg,rgba(7,6,4,.97),rgba(13,11,8,.94));
  box-shadow: inset -1px 0 rgba(255,255,255,.05);
}

.side::before {
  content:"";
  position:absolute;
  left:18px;
  right:18px;
  bottom:-22px;
  height:230px;
  opacity:.25;
  border:1px solid rgba(214,170,61,.16);
  border-radius:20px 20px 0 0;
  background:
    linear-gradient(90deg,transparent,rgba(214,170,61,.16),transparent),
    repeating-linear-gradient(90deg,rgba(78,52,20,.75) 0 18px,rgba(15,12,8,.85) 18px 27px,rgba(121,78,28,.55) 27px 40px,rgba(10,8,5,.85) 40px 48px);
}

.school-mark {
  position: relative;
  text-align: center;
  padding: 6px 10px 23px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
}

.seal {
  width: 112px;
  height: 112px;
  margin: 0 auto 14px;
  border-radius: 34px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  background: linear-gradient(145deg,rgba(214,170,61,.18),rgba(0,0,0,.36));
  box-shadow: 0 0 0 5px rgba(214,170,61,.06), 0 22px 48px rgba(0,0,0,.42), inset 0 0 32px rgba(214,170,61,.08);
  overflow: hidden;
}

.seal img { width: 82%; height: 82%; object-fit: contain; filter: drop-shadow(0 7px 12px rgba(0,0,0,.4)); }
.seal-fallback { font-family: var(--display-font); font-size: 52px; font-weight: 800; color: var(--gold2); display: none; }

.school-title {
  font-family: var(--display-font);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .16em;
  line-height: 1.35;
  color: var(--gold2);
  text-transform: uppercase;
}

.school-sub {
  margin-top: 6px;
  color: var(--muted);
  font-family: Cormorant Garamond, serif;
  font-style: italic;
  font-size: 16px;
  letter-spacing: .08em;
}

.side-nav {
  position: relative;
  display: grid;
  gap: 8px;
  margin-top: 24px;
}

.side-nav a {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 14px 15px;
  border: 1px solid transparent;
  border-radius: 17px;
  color: var(--cream);
  background: transparent;
  cursor: pointer;
  font-weight: 700;
  text-align: left;
  text-decoration: none;
  transition: .16s ease;
}

.side-nav a:hover {
  transform: translateX(3px);
  border-color: rgba(214,170,61,.22);
  background: rgba(244,231,198,.055);
}

.side-nav a.active {
  color: #090805;
  background: linear-gradient(135deg,var(--gold2),var(--gold));
  box-shadow: 0 14px 32px rgba(214,170,61,.16);
}

.side-nav svg {
  width: 21px;
  height: 21px;
  stroke: currentColor;
  stroke-width: 1.9;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: 0 0 auto;
}

.side-quote {
  position: absolute;
  left: 22px;
  right: 22px;
  bottom: 44px;
  padding: 20px;
  border: 1px solid rgba(214,170,61,.2);
  border-radius: 20px;
  background: rgba(0,0,0,.24);
  color: var(--muted);
  font-family: Cormorant Garamond, serif;
  text-align: center;
  font-size: 18px;
  line-height: 1.45;
  box-shadow: inset 0 0 26px rgba(214,170,61,.035);
}

.side-quote b { color: var(--gold2); font-weight: 600; }

.main-shell {
  min-width: 0;
  display: grid;
  grid-template-rows: auto 1fr;
}

.hdr {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 24px 34px 18px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg,rgba(5,4,3,.94),rgba(5,4,3,.68));
  backdrop-filter: blur(16px);
  box-shadow: none;
  margin: 0;
}

.hdr-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  height: auto;
}

.hdr-logo {
  width: 64px;
  height: 64px;
  border-radius: 21px;
  object-fit: contain;
  padding: 8px;
  background: rgba(0,0,0,.34);
  flex-shrink: 0;
  border: 1px solid var(--line);
  box-shadow: inset 0 0 26px rgba(214,170,61,.07);
}

.hdr-brand { flex: 1; min-width: 0; }
.hdr-title {
  margin: 0;
  font-family: var(--display-font);
  font-size: clamp(26px,3vw,46px);
  letter-spacing: .13em;
  line-height: 1;
  color: var(--gold2);
  font-weight: 700;
}
.hdr-sub {
  margin-top: 8px;
  color: var(--muted);
  font-family: var(--display-font);
  font-size: 11px;
  letter-spacing: .32em;
  text-transform: uppercase;
}
.hdr-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.hdr-btn {
  padding: 10px 15px;
  font-size: 12px;
  font-weight: 800;
  border: 1px solid var(--line);
  background: rgba(0,0,0,.26);
  color: var(--cream);
  border-radius: 18px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.hdr-btn:hover, .hdr-btn.on {
  border-color: var(--gold2);
  color: #090805;
  background: linear-gradient(135deg,var(--gold2),var(--gold));
}

.page-body { padding-top: 30px; }

.page-body::before {
  content: "Welcome to the Fletcher reading room.";
  display: block;
  max-width: 1280px;
  margin: 0 auto 0;
  padding: 30px 30px 4px;
  border: 1px solid var(--line);
  border-bottom: none;
  border-radius: 30px 30px 0 0;
  background:
    linear-gradient(135deg,rgba(19,17,12,.92),rgba(19,16,10,.72)),
    radial-gradient(circle at 82% 0%,rgba(214,170,61,.16),transparent 38%);
  color: var(--cream);
  font-family: Cormorant Garamond, serif;
  font-size: 38px;
  font-weight: 600;
  box-shadow: var(--sh-lg);
}

.page-body::after {
  content: "Match students with books from the Fletcher Library collection using reader preferences, themes, similar titles, and librarian judgment.";
  display: block;
  max-width: 1280px;
  margin: -1px auto 22px;
  padding: 0 30px 28px;
  border: 1px solid var(--line);
  border-top: none;
  border-radius: 0 0 30px 30px;
  background:
    linear-gradient(135deg,rgba(19,17,12,.92),rgba(19,16,10,.72)),
    radial-gradient(circle at 82% 0%,rgba(214,170,61,.16),transparent 38%);
  color: var(--muted);
  font-size: 15px;
  line-height: 1.7;
}

.status-bar {
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  padding:14px 18px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r);
  margin-bottom:20px;
  box-shadow:var(--sh-sm);
}
.status-item { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800; color:var(--muted); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--dim); flex-shrink:0; }
.dot.ready { background:var(--gold2); box-shadow:0 0 12px rgba(214,170,61,.7); }
.dot.spin { background:var(--gold); animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.card, .editor, .search-panel-ish {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: var(--sh-sm);
}

.card-title, .editor-title {
  font-family: var(--display-font);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--gold2);
  margin-bottom: 14px;
  display:flex;
  align-items:center;
  gap:8px;
}
.card-title::before, .editor-title::before {
  content:'';
  display:block;
  width:4px;
  height:16px;
  background:var(--gold2);
  border-radius:2px;
}

.about-card p { font-family:Cormorant Garamond,serif; font-size:18px; color:var(--muted); line-height:1.65; margin-bottom:10px; }
.about-card strong { font-family:Inter,sans-serif; font-size:13px; font-weight:800; color:var(--cream); }
.feature-tags { display:flex; flex-wrap:wrap; gap:7px; }
.ftag { padding:6px 12px; background:rgba(214,170,61,.09); border:1px solid rgba(214,170,61,.22); border-radius:100px; font-size:11px; font-weight:800; color:var(--paper); }

.stats-row { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.stat-box { flex:1; min-width:100px; background:rgba(244,231,198,.045); border:1px solid var(--line2); border-radius:18px; padding:15px 12px; text-align:center; }
.stat-n { font-family:var(--display-font); font-size:28px; font-weight:800; color:var(--gold2); line-height:1; }
.stat-l { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-top:4px; }
.stat-cols { display:flex; gap:20px; flex-wrap:wrap; }
.stat-col { flex:1; min-width:170px; }
.stat-col-h { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--line2); }
.stat-row { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:6px 0; border-bottom:1px solid var(--line2); color:var(--muted); }
.stat-row span:last-child { font-weight:900; color:var(--gold2); }
.stat-empty { font-family:Cormorant Garamond,serif; font-size:16px; color:var(--dim); font-style:italic; }

.section { margin-bottom:20px; }
.sec-label {
  font-family:var(--display-font);
  font-size:12px;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--gold2);
  margin-bottom:8px;
}
.pills { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
.pill, .pill-add {
  padding:8px 16px;
  font-size:13px;
  font-weight:800;
  border:1px solid var(--line);
  background:rgba(0,0,0,.22);
  color:var(--cream);
  cursor:pointer;
  transition:all .15s;
  border-radius:100px;
}
.pill:hover, .pill-add:hover { border-color:var(--gold2); color:var(--gold2); background:rgba(214,170,61,.08); }
.pill.on, .pill.on-l {
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  border-color:var(--gold2);
  color:#090805;
}
.pill.on-l { border-radius:100px 0 0 100px; border-right:none; }
.pill-edit {
  padding:8px 11px;
  border-radius:0 100px 100px 0;
  background:rgba(0,0,0,.22);
  border:1px solid var(--gold2);
  border-left:none;
  color:var(--gold2);
  cursor:pointer;
  font-size:13px;
}
.profile-meta { margin-top:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.profile-note { font-family:Cormorant Garamond,serif; font-size:17px; color:var(--muted); font-style:italic; }
.profile-btn {
  font-size:12px;
  font-weight:800;
  padding:6px 12px;
  border:1px solid var(--line);
  background:rgba(0,0,0,.22);
  color:var(--cream);
  border-radius:12px;
  cursor:pointer;
}
.reluctant-tag { font-size:11px; font-weight:900; color:#090805; background:linear-gradient(135deg,var(--gold2),var(--gold)); border:1px solid var(--gold2); border-radius:100px; padding:4px 10px; }

.ed-row { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.field { display:flex; flex-direction:column; gap:5px; }
.field label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); }
.finput, .main-input, .main-textarea {
  width:100%;
  padding:11px 14px;
  font-size:15px;
  background:rgba(3,3,2,.56);
  border:1px solid rgba(214,170,61,.28);
  color:var(--cream);
  border-radius:18px;
  outline:none;
  font-family:Inter,sans-serif;
  transition:border-color .15s, box-shadow .15s;
  box-shadow:none;
}
.main-textarea { font-family:Cormorant Garamond,serif; font-size:18px; resize:vertical; line-height:1.55; }
.finput:focus, .main-input:focus, .main-textarea:focus { border-color:var(--gold2); box-shadow:0 0 0 4px rgba(214,170,61,.1); }
.finput::placeholder, .main-input::placeholder, .main-textarea::placeholder { color:var(--dim); }

.toggle { display:flex; align-items:center; gap:12px; padding:12px 14px; background:rgba(244,231,198,.045); border:1px solid var(--line2); border-radius:18px; cursor:pointer; transition:all .15s; margin-bottom:12px; }
.toggle:hover, .toggle.on { border-color:var(--gold2); background:rgba(214,170,61,.10); }
.toggle-sw { width:38px; height:22px; background:rgba(255,255,255,.14); border-radius:11px; position:relative; transition:background .15s; flex-shrink:0; }
.toggle-sw.on { background:var(--gold); }
.toggle-knob { position:absolute; top:3px; left:3px; width:16px; height:16px; background:#fff; border-radius:50%; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
.toggle-sw.on .toggle-knob { left:19px; }
.toggle-lbl { font-size:13px; font-weight:800; color:var(--cream); }
.toggle-sub { font-size:12px; color:var(--muted); }

.summary-hd { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px; padding-bottom:5px; border-bottom:1px solid var(--line2); }
.summary-sec { margin-bottom:12px; }
.summary-item { font-family:Cormorant Garamond,serif; font-size:17px; color:var(--muted); padding:2px 0; }

.tabs {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  border-bottom:none;
  margin-bottom:20px;
}
.tab {
  min-height:96px;
  padding:18px;
  font-family:var(--display-font);
  font-size:13px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
  background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(214,170,61,.035));
  border:1px solid rgba(214,170,61,.20);
  border-radius:20px;
  cursor:pointer;
  color:var(--gold2);
  transition:all .15s;
  margin-bottom:0;
}
.tab:hover { transform:translateY(-2px); border-color:rgba(214,170,61,.45); color:var(--gold2); }
.tab.on { color:var(--gold2); border-color:var(--gold2); background:linear-gradient(135deg,rgba(214,170,61,.17),rgba(255,255,255,.045)); box-shadow:inset 0 0 28px rgba(214,170,61,.08); }

.inp-sec { margin-bottom:16px; }
.inp-hint { font-size:12px; color:var(--dim); margin-top:6px; }

.dd-wrap { position:relative; }
.dd {
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  right:0;
  z-index:50;
  background:rgba(10,9,6,.98);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--sh-lg);
  overflow:hidden;
}
.dd-item { padding:12px 14px; font-size:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:baseline; gap:8px; border-bottom:1px solid var(--line2); transition:background .1s; }
.dd-item:hover, .dd-item.hi { background:rgba(214,170,61,.09); }
.dd-title { color:var(--cream); font-weight:700; font-family:Inter,sans-serif; }
.dd-author { color:var(--muted); font-size:13px; flex-shrink:0; font-style:italic; font-family:Cormorant Garamond,serif; }

.trope-sec { margin-bottom:16px; }
.trope-cat { font-family:var(--display-font); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.16em; color:var(--gold2); margin-bottom:8px; }
.trope-chips { display:flex; flex-wrap:wrap; gap:7px; }
.tchip {
  padding:7px 14px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  border:1px solid rgba(214,170,61,.24);
  background:rgba(0,0,0,.22);
  color:var(--cream);
  transition:all .15s;
  border-radius:100px;
}
.tchip:hover { border-color:var(--gold2); color:var(--gold2); background:rgba(214,170,61,.08); }
.tchip.sel { background:rgba(214,170,61,.12); border-color:var(--gold); color:var(--paper); }
.tchip.prio { background:linear-gradient(135deg,var(--gold2),var(--gold)); border-color:var(--gold2); color:#090805; font-weight:900; }
.trope-hint { font-family:Cormorant Garamond,serif; font-size:18px; color:var(--muted); font-style:italic; margin-bottom:14px; }

.chips { display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
.chip { display:flex; align-items:center; gap:6px; padding:6px 12px; background:rgba(244,231,198,.045); border:1px solid var(--line2); font-size:13px; color:var(--muted); border-radius:100px; font-family:Cormorant Garamond,serif; }
.chip.gold { border-color:rgba(214,170,61,.3); color:var(--gold2); background:rgba(214,170,61,.09); }
.chip-x { background:none; border:none; cursor:pointer; color:var(--dim); padding:0; font-size:16px; line-height:1; }

.liked-banner { display:flex; align-items:flex-start; gap:10px; padding:14px 16px; background:rgba(214,170,61,.09); border:1px solid rgba(214,170,61,.28); border-radius:18px; margin-bottom:16px; }
.liked-icon { font-size:16px; flex-shrink:0; margin-top:2px; color:var(--gold2); }
.liked-body { font-family:Cormorant Garamond,serif; font-size:17px; color:var(--muted); line-height:1.5; }
.liked-body strong { font-family:Inter,sans-serif; font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.06em; color:var(--gold2); display:block; margin-bottom:2px; }

.history { margin-bottom:16px; }
.history-chips { display:flex; flex-wrap:wrap; gap:7px; }
.hchip { display:flex; align-items:center; gap:7px; padding:7px 13px; background:rgba(0,0,0,.22); border:1px solid var(--line); border-radius:100px; font-size:12px; color:var(--muted); cursor:pointer; transition:all .15s; box-shadow:none; }
.hchip:hover { border-color:var(--gold2); color:var(--gold2); background:rgba(214,170,61,.08); }
.hmode { font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.05em; color:var(--gold2); }

.search-btn {

.results-hdr { display:flex; align-items:center; gap:14px; margin:27px 0 15px; }
.results-title { font-family:var(--display-font); font-size:15px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; color:var(--gold2); white-space:nowrap; }
.results-line { flex:1; height:1px; background:linear-gradient(to right,var(--line),transparent); }
.results-count { font-size:12px; font-weight:800; color:var(--muted); white-space:nowrap; }

.rcard {

}

@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.rnum {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;

  border:1px solid rgba(255,234,152,.65);

  font-weight:900;
  color:#090805;

}
.rinner { display:flex; gap:16px; }
.cover {

  height:120px;
  flex-shrink:0;
  background:

    radial-gradient(circle at 35% 20%,rgba(255,255,255,.18),transparent 30%),

  align-items:center;
  justify-content:center;
  font-size:28px;
  object-fit:cover;

}
.cover:hover { transform:scale(1.04); }
.rbody { flex:1; min-width:0; }
.rtitle-row { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:3px; }
.rtitle { font-family:Cormorant Garamond,serif; font-weight:600; font-size:27px; color:var(--cream); line-height:1.05; }
.heart-btn { background:none; border:none; cursor:pointer; font-size:23px; padding:0; flex-shrink:0; line-height:1; transition:transform .15s; color:var(--gold2)!important; }
.heart-btn:hover { transform:scale(1.2); }
.rmeta { font-size:13px; font-weight:600; color:var(--muted); margin-bottom:10px; }
.rseries { color:var(--gold2); margin-left:6px; }
.rreason {
  display:block;
  font-family:Inter,sans-serif;
  font-size:14px;
  color:#d5c7a1;
  line-height:1.65;
  padding-left:12px;
  border-left:2px solid rgba(214,170,61,.3);
}
.cursor { display:inline-block; width:2px; height:13px; background:var(--gold2); margin-left:2px; animation:blink .7s step-end infinite; vertical-align:middle; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.expand-btn { background:none; border:none; cursor:pointer; font-size:12px; font-weight:800; color:var(--muted); padding:0; margin-top:10px; display:flex; align-items:center; gap:5px; transition:color .15s; }
.expand-btn:hover { color:var(--gold2); }
.earrow { display:inline-block; transition:transform .2s; font-size:9px; }
.earrow.open { transform:rotate(90deg); }
.summary-box { margin-top:10px; padding:13px 14px; background:rgba(244,231,198,.045); border-radius:16px; font-family:Cormorant Garamond,serif; font-size:17px; color:var(--muted); line-height:1.65; font-style:italic; border-left:3px solid rgba(214,170,61,.3); animation:fadeUp .2s ease; }
.note-field { width:100%; margin-top:14px; padding:10px 13px; font-size:13px; background:rgba(244,231,198,.04); border:1px dashed rgba(214,170,61,.24); color:var(--cream); resize:none; font-family:Inter,sans-serif; outline:none; line-height:1.6; border-radius:16px; transition:border-color .15s, box-shadow .15s; }
.note-field:focus { border-color:var(--gold2); border-style:solid; box-shadow:0 0 0 4px rgba(214,170,61,.1); }
.note-field::placeholder { color:var(--dim); }

.ractions { display:flex; gap:9px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
.act-btn {
  padding:10px 20px;
  font-size:13px;
  font-weight:800;
  background:rgba(0,0,0,.22);
  border:1px solid var(--line);
  color:var(--cream);
  border-radius:16px;
  cursor:pointer;
  transition:all .15s;
  display:flex;
  align-items:center;
  gap:6px;
  box-shadow:none;
}
.act-btn:hover, .act-btn.primary:hover { border-color:var(--gold2); color:#090805; background:linear-gradient(135deg,var(--gold2),var(--gold)); }
.act-btn.primary { border-color:var(--gold2); color:var(--gold2); }

.loading-wrap { text-align:center; padding:2.5rem 0 2rem; }
.loading-video { width:190px; max-width:100%; border-radius:18px; box-shadow:var(--sh-lg); display:block; margin:0 auto 20px; border:1px solid var(--line); }
.loading-card { display:inline-block; background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:22px 30px; max-width:390px; width:100%; box-shadow:var(--sh); }
.lbars { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
.lbar { height:3px; background:rgba(244,231,198,.10); border-radius:2px; overflow:hidden; position:relative; }
.lbar::after { content:''; position:absolute; top:0; left:-100%; height:100%; background:linear-gradient(90deg,var(--gold3),var(--gold2)); border-radius:2px; animation:lslide 1.8s ease-in-out infinite; }
.lbar:nth-child(1)::after { width:80%; }
.lbar:nth-child(2)::after { width:95%; animation-delay:.15s; }
.lbar:nth-child(3)::after { width:70%; animation-delay:.3s; }
.lbar:nth-child(4)::after { width:88%; animation-delay:.45s; }
@keyframes lslide { 0%{left:-100%} 100%{left:110%} }
.ltext { font-size:12px; font-weight:900; color:var(--gold2); text-transform:uppercase; letter-spacing:.12em; border-top:1px solid var(--line2); padding-top:12px; animation:tfade 1.5s ease-in-out infinite; }
@keyframes tfade { 0%,100%{opacity:.5} 50%{opacity:1} }

.empty { text-align:center; padding:3rem 0; }
.empty-title { font-family:Cormorant Garamond,serif; font-size:24px; font-style:italic; color:var(--cream); margin-bottom:6px; }
.empty-sub { font-size:13px; color:var(--muted); margin-bottom:20px; }
.empty-actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.echip { padding:9px 18px; font-size:13px; font-weight:800; background:rgba(0,0,0,.22); border:1px solid var(--line); border-radius:100px; cursor:pointer; color:var(--cream); transition:all .15s; }
.echip:hover { border-color:var(--gold2); color:#090805; background:linear-gradient(135deg,var(--gold2),var(--gold)); }

.error-msg { font-size:13px; font-weight:800; color:var(--red); margin-bottom:14px; display:flex; align-items:center; gap:8px; padding:12px 14px; background:var(--red-lt); border:1px solid rgba(216,139,104,.32); border-radius:18px; }

.btn-row { display:flex; gap:8px; justify-content:space-between; align-items:center; flex-wrap:wrap; }
.btn { padding:10px 18px; font-size:13px; font-weight:800; border-radius:16px; cursor:pointer; transition:all .15s; font-family:Inter,sans-serif; }
.btn-primary { background:linear-gradient(135deg,var(--gold2),var(--gold)); color:#090805; border:1px solid var(--gold2); box-shadow:0 10px 20px rgba(214,170,61,.13); }
.btn-primary:hover { background:linear-gradient(135deg,#fff0ad,#e0b444); }
.btn-secondary { background:rgba(0,0,0,.22); color:var(--cream); border:1px solid var(--line); }
.btn-secondary:hover { border-color:var(--gold2); color:var(--gold2); }
.btn-danger { background:transparent; color:var(--red); border:1px solid rgba(216,139,104,.38); }
.btn-danger:hover { background:var(--red-lt); }

.toasts { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
.toast { font-size:13px; font-weight:800; padding:10px 20px; border-radius:100px; box-shadow:var(--sh-lg); animation:tIn .2s ease both; white-space:nowrap; }
.toast.success { background:linear-gradient(135deg,var(--gold2),var(--gold)); color:#090805; }
.toast.error { background:var(--red); color:#fff; }
.toast.info { background:var(--cream); color:#090805; }
@keyframes tIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.tiger { display:none !important; }

@media print {
  .side, .hdr, .tiger, .toasts, .search-btn, .ractions, .tabs, .history, .status-bar, .hdr-actions, .page-body::before, .page-body::after { display:none !important; }
  body { background:#fff; color:#000; }
  .app-shell { display:block; }
  .rcard { border:1px solid #ccc; box-shadow:none; page-break-inside:avoid; color:#000; background:#fff; }
  #root { max-width:100%; padding:1rem; }
}

@media(max-width:1120px) {
  .app-shell { grid-template-columns:1fr; }
  .side { display:none; }
  #root { padding-left:18px; padding-right:18px; }
  .hdr { padding-left:18px; padding-right:18px; }
  .tabs { grid-template-columns:1fr; }
}
@media(max-width:760px) {
  .hdr-actions { display:none; }
  .hdr-title { font-size:24px; }
  .hdr-sub { font-size:9px; letter-spacing:.22em; }
  .hdr-logo { width:52px; height:52px; }
  .rinner { flex-direction:column; }
  .cover { width:92px; height:132px; }
  .stats-row, .stat-cols, .ed-row { flex-direction:column; }
}

  
/* ── V2 PROFESSIONAL TRUST LAYER ─────────────────────────────────────── */
.trust-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr);
  gap: 16px;
  margin-bottom: 20px;
}

.system-panel,
.interpretation-panel,
.review-notice {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 20px;
  box-shadow: var(--sh-sm);
  position: relative;
  overflow: hidden;
}

.system-panel::before,
.interpretation-panel::before,
.review-notice::before {
  content: "";
  position: absolute;
  inset: 12px;
  border: 1px solid rgba(214,170,61,.10);
  border-radius: 18px;
  pointer-events: none;
}

.system-title,
.interpretation-title,
.review-title {
  position: relative;
  font-family: var(--display-font);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .16em;
  color: var(--gold2);
  text-transform: uppercase;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.system-grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px;
}

.system-metric {
  border: 1px solid var(--line2);
  border-radius: 16px;
  background: rgba(244,231,198,.045);
  padding: 12px;
}

.system-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 4px;
}

.system-value {
  color: var(--cream);
  font-weight: 900;
  font-size: 13px;
}

.system-value.ready { color: var(--gold2); }
.system-value.warn { color: #f3c27e; }
.system-value.fail { color: var(--red); }

.review-notice {
  margin-bottom: 20px;
  background: linear-gradient(135deg, rgba(214,170,61,.10), rgba(0,0,0,.18));
}

.review-copy {
  position: relative;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

.review-copy strong { color: var(--gold2); }

.interpretation-panel {
  margin-bottom: 18px;
}

.interpretation-grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 12px;
}

.interpretation-col {
  border: 1px solid var(--line2);
  border-radius: 16px;
  background: rgba(244,231,198,.045);
  padding: 14px;
}

.interpretation-col h4 {
  margin: 0 0 8px;
  font-family: var(--display-font);
  color: var(--gold2);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.interpretation-col ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

.interpretation-col li {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  padding: 4px 0;
  border-bottom: 1px solid rgba(244,231,198,.06);
}

.interpretation-col li:last-child { border-bottom: none; }

.interpretation-query {
  position: relative;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line2);
  color: var(--muted);
  font-family: Cormorant Garamond, serif;
  font-size: 17px;
  font-style: italic;
}

.professional-rubric {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px;
  margin-top: 14px;
}

.rubric-box {
  border: 1px solid var(--line2);
  border-radius: 16px;
  background: rgba(244,231,198,.04);
  padding: 12px;
}

.rubric-label {
  font-size: 10px;
  font-weight: 900;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 5px;
}

.rubric-text {
  color: #d5c7a1;
  font-size: 13px;
  line-height: 1.55;
}

.appeal-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 13px;
}

.appeal-tag,
.data-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid rgba(214,170,61,.22);
  border-radius: 999px;
  background: rgba(214,170,61,.08);
  color: var(--paper);
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 900;
}

.data-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.feedback-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 13px;
  padding-top: 12px;
  border-top: 1px solid rgba(214,170,61,.12);
}

.feedback-btn {
  border: 1px solid rgba(214,170,61,.22);
  background: rgba(0,0,0,.18);
  color: var(--muted);
  border-radius: 999px;
  padding: 7px 10px;
  font-size: 11px;
  font-weight: 900;
  cursor: pointer;
  transition: all .15s ease;
}

.feedback-btn:hover,
.feedback-btn.on {
  border-color: var(--gold2);
  background: linear-gradient(135deg,var(--gold2),var(--gold));
  color: #090805;
}

.engine-stamp {
  margin-top: 10px;
  color: var(--dim);
  font-size: 11px;
  font-weight: 800;
}

@media(max-width:900px) {
  .trust-grid,
  .interpretation-grid,
  .professional-rubric {
    grid-template-columns: 1fr;
  }
  .system-grid { grid-template-columns: 1fr; }
}


/* ── V3 WORKING NAVIGATION PANELS ─────────────────────────────────────── */
.side-nav a[data-view] { user-select: none; }

.view-panel {
  display: none;
  animation: fadeUp .28s ease both;
}

.view-panel.active {
  display: block;
}

.utility-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 16px;
  margin-bottom: 18px;
}

.utility-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 20px;
  box-shadow: var(--sh-sm);
}

.utility-card h3 {
  margin: 0 0 8px;
  font-family: var(--display-font);
  color: var(--gold2);
  font-size: 13px;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.utility-card p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

.saved-list-card {
  background: linear-gradient(145deg,rgba(19,17,12,.92),rgba(12,10,7,.9));
  border: 1px solid rgba(214,170,61,.24);
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: var(--sh-sm);
}

.saved-list-title {
  font-family: Cormorant Garamond, serif;
  font-size: 24px;
  color: var(--cream);
  font-weight: 700;
  line-height: 1.1;
}

.saved-list-meta {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  margin-top: 5px;
}

.saved-list-books {
  margin-top: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.saved-book-pill {
  border: 1px solid rgba(214,170,61,.22);
  border-radius: 999px;
  background: rgba(214,170,61,.08);
  color: var(--paper);
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 900;
}

.settings-list {
  display: grid;
  gap: 10px;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border: 1px solid var(--line2);
  border-radius: 16px;
  background: rgba(244,231,198,.045);
  padding: 13px 14px;
}

.setting-label {
  color: var(--cream);
  font-weight: 850;
  font-size: 13px;
}

.setting-help {
  color: var(--muted);
  font-size: 12px;
  margin-top: 2px;
}

.setting-toggle {
  min-width: 56px;
  height: 30px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(0,0,0,.22);
  padding: 3px;
  cursor: pointer;
  transition: all .15s ease;
}

.setting-toggle::after {
  content: "";
  display: block;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--muted);
  transition: all .15s ease;
}

.setting-toggle.on {
  background: linear-gradient(135deg,var(--gold2),var(--gold));
  border-color: var(--gold2);
}

.setting-toggle.on::after {
  transform: translateX(24px);
  background: #090805;
}

.profile-directory {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 14px;
}

.profile-directory-card {
  border: 1px solid rgba(214,170,61,.24);
  border-radius: 22px;
  background: var(--panel);
  padding: 18px;

const CATS   = [...new Set(TROPES.map(t=>t.cat))];
const STOP   = new Set(["the","and","for","that","with","this","she","her","his","him","they","their","was","are","have","has","been","from","but","not","all","can","its","you","who","one","had","what","when","into","more","will","about","after","also","some","such","than","then","them","these","those","very","just","each"]);

// ── UTILITIES ────────────────────────────────────────────────────────────
const uid      = () => Math.random().toString(36).slice(2,9);
const tokenize = t => (t||"").toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));

const lsSave   = (k,v)  => { try{localStorage.setItem(k,JSON.stringify(v));}catch{} };
function cosine(a,b){ let d=0,na=0,nb=0; for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];} return d/(Math.sqrt(na)*Math.sqrt(nb)||1); }

// ── CANDIDATES ───────────────────────────────────────────────────────────
async function getCandidates(books,queryText,bookEmbeddings,likedKws=[],n=70,excl=null,alreadyRead=new Set(),shown=new Set(),refAuthor=null){
  const pool=books.filter(b=>b.title!==excl&&!alreadyRead.has(b.title)&&!shown.has(b.title));
  const authorLast=refAuthor?refAuthor.split(',')[0].trim().toLowerCase():null;
  const sameAuthor=new Set(authorLast?pool.filter(b=>(b.author||'').toLowerCase().includes(authorLast)).map(b=>b.title):[]);

  if(bookEmbeddings&&Object.keys(bookEmbeddings).length>0){
    try{
      const res=await fetch(EMBED_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:queryText})});
      if(!res.ok) throw new Error(`embed ${res.status}`);
      const{embedding:qEmb}=await res.json();
      const lSet=new Set(likedKws);
      const scored=pool.map(b=>{
        const bEmb=bookEmbeddings[b.title];
        const sim=bEmb?cosine(qEmb,bEmb):0;
        const toks=tokenize(`${b.enriched_subjects||b.subjects||''} ${b.enriched_summary||b.summary||''}`);
        const likedBoost=toks.filter(t=>lSet.has(t)).length*0.01;
        const authorBoost=sameAuthor.has(b.title)?0.15:0;
        return{...b,_s:sim+likedBoost+authorBoost};
      }).sort((a,b)=>b._s-a._s);
      return scored.slice(0,n);
    }catch(err){console.warn('Embedding failed — keyword fallback:',err);}
  }

  const kws=tokenize(queryText),kSet=new Set(kws),lSet=new Set(likedKws);
  let scored=pool.map(b=>{
    const st=new Set(tokenize(b.enriched_subjects||b.subjects||''));
    const sm=new Set(tokenize(b.enriched_summary||b.summary||''));
    const ti=new Set(tokenize(b.title||''));
    const base=[...kSet].filter(k=>st.has(k)).length*3+[...kSet].filter(k=>sm.has(k)).length+[...kSet].filter(k=>ti.has(k)).length;
    const liked=[...lSet].filter(k=>st.has(k)).length*4+[...lSet].filter(k=>sm.has(k)).length*2;
    const authorBoost=sameAuthor.has(b.title)?10:0;
    return{...b,_s:base+liked+authorBoost};
  }).filter(b=>b._s>0);
  if(!scored.length) scored=pool;
  return scored.sort((a,b)=>b._s-a._s).slice(0,n);
}

// ── CLAUDE CALL ──────────────────────────────────────────────────────────
async function callClaude(candidates,ctx,excluded=[],priorityLabel=null,likedTitles=[],likedThemes="",prefNote="",reluctantNote="",didntLikeNote="",advisoryNote=""){
  const exclNote=excluded.length?`\n\nDo NOT recommend: ${excluded.join(", ")}`:"";
  const prioNote=priorityLabel?`\n\nMust-have: "${priorityLabel}" — every pick MUST feature this.`:"";
  const likedNote=likedTitles.length?`\n\nThis student loved: ${likedTitles.join(", ")}. Weight toward similar feel.`:"";
  const advisoryPrompt=advisoryNote?`\n\nLibrarian advisory notes for this reader:\n${advisoryNote}\nUse these notes to infer WHY the student liked or disliked books. Prioritize the underlying appeal factors, not just surface-level genre.`:"";
  const list=candidates.map((b,i)=>`${i+1}. "${b.title}" by ${b.author}\n   ${(b.enriched_summary||b.summary||"").slice(0,200)}`).join("\n\n");
  const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,
      system:"You are an expert school librarian recommending middle school and YA fiction. Return only valid JSON arrays, no markdown.",
      messages:[{role:"user",content:`${ctx}${prioNote}${likedNote}${advisoryPrompt}${likedThemes}${prefNote}${reluctantNote}${didntLikeNote}${exclNote}\n\nChoose 6 best matches:\n\n${list}\n\nReturn ONLY: [{"title":"...","author":"...","reason":"1-2 sentence explanation"}]`}]})});
  const raw=await res.text();
  if(!res.ok) throw new Error(`Worker ${res.status}`);
  let data; try{data=JSON.parse(raw);}catch(e){console.error("Worker JSON error:",raw);throw e;}
  const text=data.content?.[0]?.text||"[]";
  const clean=text.replace(/```json|```/g,"").trim();
  const jsonText=(clean.match(/\[[\s\S]*\]/)||[clean])[0];
  return JSON.parse(jsonText);
}

function Toasts({toasts}){ return <div className="toasts">{toasts.map(t=><div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>)}</div>; }

function TypewriterText({text}){
  const[displayed,setDisplayed]=React.useState("");
  const[done,setDone]=React.useState(false);
  React.useEffect(()=>{
    setDisplayed("");setDone(false);let i=0;
    const iv=setInterval(()=>{if(i<text.length){setDisplayed(text.slice(0,i+1));i++;}else{setDone(true);clearInterval(iv);}},16);
    return()=>clearInterval(iv);
  },[text]);
  return <span className="rreason">{displayed}{!done&&<span className="cursor"/>}</span>;
}

function cleanTagText(text){
  return (text||"").replace(/[_|;]/g," ").replace(/\s+/g," ").trim();
}

function appealTagsForBook(book){
  const source = `${book.enriched_subjects||book.subjects||""} ${book.enriched_summary||book.summary||""} ${book.reason||""}`.toLowerCase();
  const tags = [];
  const checks = [
    ["Fantasy", /fantasy|magic|magical|spell|wizard|witch|powers?/],
    ["Mystery", /mystery|murder|detective|clue|secret|investigation/],
    ["Fast-paced", /fast|action|battle|thrill|chase|adventure/],
    ["Friendship", /friend|friendship|found family|belonging/],
    ["Romance", /romance|love|crush|dating|enemies to lovers/],
    ["Realistic", /realistic|contemporary|school|family|grief/],
    ["Sports", /sports?|basketball|football|soccer|team|athlete/],
    ["Identity", /identity|self-discovery|belonging|coming of age/],
  ];
  checks.forEach(([label,re])=>{ if(re.test(source)&&!tags.includes(label)) tags.push(label); });
  const subjects=(book.enriched_subjects||book.subjects||"").split("|").map(cleanTagText).filter(Boolean).slice(0,3);
  subjects.forEach(s=>{ if(tags.length<5 && s.length<28 && !tags.some(t=>t.toLowerCase()===s.toLowerCase())) tags.push(s); });
  return tags.slice(0,5);
}

function dataQualityForBook(book){
  return [
    {label:"Catalog record", ok:!!book.title},
    {label:"Summary", ok:!!(book.enriched_summary||book.summary)},
    {label:"Subjects", ok:!!(book.enriched_subjects||book.subjects)},
    {label:"ISBN", ok:!!book.isbn},
  ];
}

function makeRequestInterpretation({mode,query,refBook,selTropes,priorityTrope,activeProfile,alreadyRead,didntLike}){
  const must=[], preferred=[], avoid=[];
  const q=(query||"").toLowerCase();

  if(mode==="similar" && refBook){
    must.push(`Similar appeal to "${refBook.title}"`);
    preferred.push(refBook.author?`May share tone or themes with ${refBook.author}`:"Matches the selected reference book");
  }

  if(mode==="tropes"){
    const labels=TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label);
    labels.forEach(label=>{
      if(priorityTrope && TROPES.find(t=>t.id===priorityTrope)?.label===label) must.push(label);
      else preferred.push(label);
    });
  }

  if(mode==="freetext"){
    if(/fantasy|magic|magical|powers?|witch|wizard|dragon/.test(q)) must.push("Fantasy or magical elements");
    if(/mystery|murder|detective|clue|crime|secret/.test(q)) must.push("Mystery / secrets / investigation");
    if(/girl|female|heroine|woman/.test(q)) preferred.push("Girl or female protagonist");
    if(/fast|action|quick|exciting|adventure/.test(q)) preferred.push("Fast-paced or adventurous");
    if(/easy|easier|not too hard|short|reluctant/.test(q)) preferred.push("Accessible difficulty");
    if(/romance|love|crush|dating/.test(q)) preferred.push("Romance element");
    if(/sports?|basketball|soccer|football|baseball/.test(q)) must.push("Sports story element");
    if(!must.length && !preferred.length) preferred.push("Natural-language reader request");
  }

  if(activeProfile?.likedBooks?.length) preferred.push(`Influenced by liked books: ${activeProfile.likedBooks.slice(0,3).join(", ")}`);
  const profileTaste=splitSignals(activeProfile?.tasteSignals);
  const profileAvoid=splitSignals(activeProfile?.avoidSignals);
  if(activeProfile?.advisoryNotes) preferred.push("Uses librarian advisory notes");
  if(profileTaste.length) preferred.push(`Taste signals: ${profileTaste.slice(0,4).join(", ")}`);
  if(profileAvoid.length) avoid.push(`Profile cautions: ${profileAvoid.slice(0,4).join(", ")}`);
  if(activeProfile?.reluctant) preferred.push("Reluctant-reader friendly pacing");
  if(alreadyRead?.size) avoid.push(`${alreadyRead.size} already-read title${alreadyRead.size===1?"":"s"}`);
  if(didntLike?.trim()) avoid.push(`Avoid qualities similar to: ${didntLike.trim()}`);

  if(!must.length) must.push("Relevant titles from the Fletcher catalog");
  if(!preferred.length) preferred.push("Strong appeal match");
  if(!avoid.length) avoid.push("No extra exclusions beyond catalog fit");

  return {must:must.slice(0,5), preferred:preferred.slice(0,6), avoid:avoid.slice(0,5), query: query || (refBook?.title || "Selected trope/theme search")};
}

function uniquePush(arr,value){
  if(value && !arr.some(x=>String(x).toLowerCase()===String(value).toLowerCase())) arr.push(value);
}

function containsAny(text,patterns){
  return patterns.some(p=>p.test(text));
}

function parseStructuredRequest({mode,query,refBook,selTropes,priorityTrope,activeProfile,didntLike}){
  const q=(query||"").toLowerCase();
  const combined=`${q} ${advisoryTextForProfile(activeProfile).toLowerCase()} ${didntLike||""}`;
  const must=[], prefer=[], avoid=[], cautions=[];

  if(mode==="similar" && refBook){
    uniquePush(must,`similar appeal to "${refBook.title}"`);
    uniquePush(prefer,"same tone, pacing, or story appeal as the reference title");
  }

  if(mode==="tropes"){
    TROPES.filter(t=>selTropes.has(t.id)).forEach(t=>{
      if(t.id===priorityTrope) uniquePush(must,t.label);
      else uniquePush(prefer,t.label);
    });
  }

  const rules=[
    ["fantasy or magic", [/fantasy|magic|magical|spell|wizard|witch|powers?|supernatural|secret world|hidden world/], "prefer"],
    ["mystery / investigation", [/mystery|murder|detective|clue|crime|investigation|secret|missing/], "prefer"],
    ["girl / female protagonist", [/girl|female|heroine|woman|she\b|her\b/], "prefer"],
    ["sports element", [/sports?|basketball|football|soccer|baseball|athlete|team/], "prefer"],
    ["romance element", [/romance|love|crush|dating|enemies to lovers|slow burn/], "prefer"],
    ["fast pacing", [/fast|quick|action|exciting|page[-\s]?turner|adventure|short chapters/], "prefer"],
    ["accessible difficulty", [/easy|easier|not too hard|reluctant|short|accessible|simple/], "prefer"],
    ["realistic fiction", [/realistic|contemporary|real life|school story|family story/], "prefer"],
    ["deep/emotional topics", [/grief|loss|trauma|serious|deep|emotional|depression|abuse|poverty/], "prefer"],
    ["friendship / found family", [/friendship|friends|found family|belonging/], "prefer"],
    ["not animal protagonists", [/not animals?|no animals?|avoid animals?|human girl|human protagonist|not dragons?|no dragons?/], "avoid"],
    ["avoid slow pacing", [/not slow|avoid slow|too slow|slow pacing|slow books/], "avoid"],
    ["avoid heavy romance", [/no romance|not romance|avoid romance|romance[-\s]?light/], "avoid"],
    ["avoid scary content", [/not scary|avoid horror|too scary|not too scary/], "avoid"],
    ["avoid childish tone", [/not childish|too young|babyish|feels young/], "avoid"],
  ];

  rules.forEach(([label,patterns,type])=>{
    if(containsAny(combined,patterns)){
      if(type==="avoid") uniquePush(avoid,label);
      else uniquePush(prefer,label);
    }
  });

  splitSignals(activeProfile?.tasteSignals).forEach(s=>uniquePush(prefer,s));
  splitSignals(activeProfile?.avoidSignals).forEach(s=>uniquePush(avoid,s));
  if(activeProfile?.advisoryNotes) uniquePush(prefer,"librarian advisory notes");
  if(activeProfile?.reluctant) uniquePush(prefer,"reluctant-reader friendly pacing");
  if(activeProfile?.likedBooks?.length) uniquePush(prefer,`appeal factors from liked books: ${activeProfile.likedBooks.slice(0,3).join(", ")}`);
  if(didntLike?.trim()) uniquePush(avoid,`qualities similar to disliked note: ${didntLike.trim()}`);

  if(!must.length) uniquePush(must,"books from the Fletcher Library catalog");
  if(!prefer.length) uniquePush(prefer,"strong reader appeal match");

  return {
    mode,
    mustHave: must.slice(0,8),
    softPreferences: prefer.slice(0,10),
    avoidSignals: avoid.slice(0,8),
    cautions: cautions.slice(0,6),
    originalQuery: query || refBook?.title || "Selected trope/theme request"
  };
}

function evidenceForBook(book,structured){
  const source=`${book.title||""} ${book.author||""} ${book.series||""} ${book.enriched_subjects||book.subjects||""} ${book.enriched_summary||book.summary||""} ${book.reason||""}`.toLowerCase();
  const matched=[], warnings=[];
  const simpleMatch=(label)=>{
    const normalized=String(label||"").toLowerCase();
    const bits=normalized.split(/[^a-z0-9]+/).filter(w=>w.length>3);
    if(!bits.length) return false;
    return bits.some(w=>source.includes(w));
  };

  (structured?.mustHave||[]).forEach(x=>{ if(simpleMatch(x)) uniquePush(matched,x); });
  (structured?.softPreferences||[]).forEach(x=>{ if(simpleMatch(x)) uniquePush(matched,x); });
  (structured?.avoidSignals||[]).forEach(x=>{ if(simpleMatch(x)) uniquePush(warnings,x); });

  // Special-case useful constraints that simple text matching misses.
  if((structured?.avoidSignals||[]).some(x=>/animal|dragon/i.test(x)) && /dragon|animal|cat|dog|wolf|horse|wings of fire/i.test(source)){
    uniquePush(warnings,"possible animal/dragon protagonist concern");
  }
  if((structured?.softPreferences||[]).some(x=>/accessible|easy|reluctant|short/i.test(x))){
    if(/graphic novel|short chapters|fast-paced|accessible|reluctant/i.test(source)) uniquePush(matched,"accessible/reluctant-reader signal");
    if(String(book.pages||"").match(/\d+/) && Number(String(book.pages).match(/\d+/)[0])>420) uniquePush(warnings,"longer book; check difficulty");
  }

  const score=Math.max(0, Math.min(100, 58 + matched.length*8 - warnings.length*10));
  return {matched:matched.slice(0,8), warnings:warnings.slice(0,6), score};
}

function validateRecommendations(recs,bookMap,alreadyRead,structured){
  const seen=new Set();
  return (recs||[]).filter(r=>{
    if(!r?.title) return false;
    const key=String(r.title).toLowerCase().trim();
    if(seen.has(key)) return false;
    seen.add(key);
    if(alreadyRead?.has(r.title)) return false;
    return true;
  }).map(r=>{
    const catalog=bookMap.get(String(r.title).toLowerCase().trim());
    return catalog?{...catalog,reason:r.reason||catalog.reason||""}:r;
  }).filter(r=>r?.title);
}

function BookSearch({books,exclude,onSelect,placeholder}){
  const[inp,setInp]=React.useState("");const[sugg,setSugg]=React.useState([]);const[hi,setHi]=React.useState(-1);
  const onChange=v=>{setInp(v);setHi(-1);if(v.length>1)setSugg(books.filter(b=>(b.title||"").toLowerCase().includes(v.toLowerCase())&&!exclude.has(b.title)).slice(0,6));else setSugg([]);};
  const pick=b=>{onSelect(b);setInp("");setSugg([]);setHi(-1);};
  const onKD=e=>{if(!sugg.length)return;if(e.key==="ArrowDown"){e.preventDefault();setHi(h=>Math.min(h+1,sugg.length-1));}else if(e.key==="ArrowUp"){e.preventDefault();setHi(h=>Math.max(h-1,-1));}else if(e.key==="Enter"&&hi>=0){e.preventDefault();pick(sugg[hi]);}else if(e.key==="Escape"){setSugg([]);setHi(-1);}};
  return <div className="dd-wrap">
    <input className="finput" style={{width:"100%"}} value={inp} onChange={e=>onChange(e.target.value)} onKeyDown={onKD} placeholder={placeholder||"Type a title…"}/>
    {sugg.length>0&&<div className="dd">{sugg.map((b,i)=><div key={i} className={`dd-item${hi===i?" hi":""}`} onClick={()=>pick(b)}><span className="dd-title">{b.title}</span><span className="dd-author">{b.author}</span></div>)}</div>}
  </div>;
}

function MainInput({value,onChange,onEnter,suggestions,onSelect,clearSugg}){
  const[hi,setHi]=React.useState(-1);
  const onKD=e=>{
    if(suggestions.length){
      if(e.key==="ArrowDown"){e.preventDefault();setHi(h=>Math.min(h+1,suggestions.length-1));}
      else if(e.key==="ArrowUp"){e.preventDefault();setHi(h=>Math.max(h-1,-1));}
      else if(e.key==="Enter"&&hi>=0){e.preventDefault();onSelect(suggestions[hi]);setHi(-1);}
      else if(e.key==="Enter"){e.preventDefault();clearSugg();onEnter();}
      else if(e.key==="Escape"){clearSugg();setHi(-1);}
    }else if(e.key==="Enter"){e.preventDefault();onEnter();}
  };
  return <div className="dd-wrap">
    <input className="main-input" value={value} onChange={e=>onChange(e.target.value)} onKeyDown={onKD} placeholder="Start typing a title…"/>
    {suggestions.length>0&&<div className="dd">{suggestions.map((b,i)=><div key={i} className={`dd-item${hi===i?" hi":""}`} onClick={()=>{onSelect(b);setHi(-1);}}><span className="dd-title">{b.title}</span><span className="dd-author">{b.author}</span></div>)}</div>}
  </div>;
}

function ChipList({items,onRemove,gold}){

function splitSignals(value){
  if(Array.isArray(value)) return value.map(x=>String(x).trim()).filter(Boolean);
  return String(value||"").split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);
}

function advisoryTextForProfile(profile){
  if(!profile) return "";
  const taste=splitSignals(profile.tasteSignals);
  const avoid=splitSignals(profile.avoidSignals);
  const parts=[];
  if(profile.advisoryNotes) parts.push(`Librarian advisory notes: ${profile.advisoryNotes}`);
  if(taste.length) parts.push(`Taste signals to prioritize: ${taste.join(", ")}`);
  if(avoid.length) parts.push(`Avoid or be cautious with: ${avoid.join(", ")}`);
  return parts.join("\n");
}

      .catch(()=>{setBookEmbeddings({});setEmbedReady(false);});

    const next=savedLists.filter(l=>l.id!==id);

  };

  const printSavedList=list=>{
    const html=`<html><head><title>${list.name}</title><style>body{font-family:Georgia,serif;padding:32px;line-height:1.5}h1{font-size:28px}h2{font-size:18px;margin-top:24px}.book{break-inside:avoid;margin:18px 0;padding-bottom:14px;border-bottom:1px solid #ccc}</style></head><body><h1>Fletcher Library Recommended Reads</h1><p><strong>${list.name}</strong><br>${new Date(list.createdAt).toLocaleString()}<br>${list.request||""}</p>${(list.books||[]).map((b,i)=>`<div class="book"><h2>${i+1}. ${b.title}</h2><p><em>${b.author||""}</em></p><p>${b.reason||""}</p></div>`).join("")}</body></html>`;
    const w=window.open("","_blank");w.document.write(html);w.document.close();w.focus();w.print();
  };

  const clearLocalDemo=()=>{
    if(!confirm("Clear profiles, analytics, saved lists, feedback, and notes from this browser?")) return;
    ["profiles","analytics","savedLists","feedback","appSettings"].forEach(k=>localStorage.removeItem(k));
    Object.keys(localStorage).filter(k=>k.startsWith("note:")).forEach(k=>localStorage.removeItem(k));
    location.reload();
  };

  const addToHistory=(label,m)=>setSearchHistory(p=>[{label,mode:m,id:Date.now()},...p.filter(e=>e.label!==label)].slice(0,5));

  const getLikedKws=()=>{
    if(!activeProfile?.likedBooks?.length) return[];
    const objs=books.filter(b=>activeProfile.likedBooks.includes(b.title));
    const st=objs.map(b=>b.enriched_subjects||b.subjects||"").join(" ");
    const sm=objs.map(b=>b.enriched_summary||b.summary||"").join(" ");
    return[...tokenize(st),...tokenize(st),...tokenize(st),...tokenize(sm)];
  };

  const getLikedThemes=()=>{
    if(!activeProfile?.likedBooks?.length) return"";
    const objs=books.filter(b=>activeProfile.likedBooks.includes(b.title));
    const all=objs.flatMap(b=>(b.enriched_subjects||b.subjects||"").split("|").map(s=>s.trim())).filter(Boolean);
    const unique=[...new Set(all)].slice(0,12);
    return unique.length?`\n\nThemes from books this student enjoyed: ${unique.join("; ")}. Prioritize books sharing these themes.`:"";
  };

  const onQueryChange=val=>{
    setQuery(val);setRefBook(null);
    if(mode==="similar"&&val.length>1) setSuggestions(books.filter(b=>(b.title||"").toLowerCase().includes(val.toLowerCase())).slice(0,6));
    else setSuggestions([]);
  };

  const toggleTrope=id=>{
    setSelTropes(prev=>{
      const n=new Set(prev);
      if(!n.has(id)){n.add(id);}
      else if(priorityTrope!==id){setPriorityTrope(id);}
      else{n.delete(id);setPriorityTrope(null);}
      return n;
    });
  };

  const switchMode=m=>{
    setMode(m);setResults(null);setError("");setQuery("");setRefBook(null);setRequestInterpretation(null);setStructuredRequest(null);
    setSuggestions([]);setSelTropes(new Set());setPriorityTrope(null);
    setShownTitles(new Set());lastSearch.current=null;
  };

  const buildParams=()=>{
    let ctx="",excl=null,priorityLabel=null;
    if(mode==="similar"){
      const ref=refBook||books.find(b=>(b.title||"").toLowerCase()===query.toLowerCase());
      if(!ref) return null;
      excl=ref.title;
      ctx=`A student loved "${ref.title}" by ${ref.author}.\n\nSummary: ${ref.enriched_summary||ref.summary||""}\n\nFind books with similar themes, characters, tone, and plot elements.`;
    } else if(mode==="tropes"){
      if(!selTropes.size) return null;
      const labels=TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label);
      if(priorityTrope) priorityLabel=TROPES.find(t=>t.id===priorityTrope)?.label;
      ctx=`A student wants books with: ${labels.join(", ")}. Find the best matches.`;
    } else {
      if(!query.trim()) return null;
      ctx=`A student wants: "${query}". Find the best matches.`;
    }
    return{ctx,excl,priorityLabel};
  };

  const buildQueryText=()=>{
    if(mode==="similar"&&refBook)
      return `${refBook.title} ${refBook.author} ${refBook.enriched_subjects||refBook.subjects||""} ${refBook.enriched_summary||refBook.summary||""}`;
    if(mode==="tropes"){
      const labels=TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label);
      return[...new Set(labels.flatMap(l=>{const id=TROPES.find(t=>t.label===l)?.id;return[...tokenize(l),...(TROPE_KEYWORDS[id]||[])]}))].join(' ');
    }
    return query;
  };

  const runSearch=async(params,shown,isMore=false)=>{
    const{ctx,excl,priorityLabel}=params;
    let queryText=buildQueryText();
    const advisoryNote=advisoryTextForProfile(activeProfile);
    if(advisoryNote) queryText += `\n\nReader profile advisory notes:\n${advisoryNote}`;
    if(structured) queryText += `\n\nStructured reader model:\nMust have: ${structured.mustHave.join(", ")}\nPrefer: ${structured.softPreferences.join(", ")}\nAvoid/check: ${structured.avoidSignals.join(", ")}`;
    const refAuthor=(mode==='similar'&&refBook)?refBook.author:null;
    const cands=await getCandidates(books,queryText,bookEmbeddings,getLikedKws(),70,excl,alreadyRead,shown,refAuthor);
    setSearchMeta({
      engine:(bookEmbeddings&&Object.keys(bookEmbeddings).length>0)?"Semantic candidates + Claude ranking":"Keyword candidates + Claude ranking",
      candidates:cands.length,
      lastRun:new Date().toLocaleTimeString(),
      mode
    });
    const prefNote=activeProfile?.notes?`\n\nStudent reading preferences: ${activeProfile.notes}. Please respect these.`:"";
    const reluctantNote=activeProfile?.reluctant?`\n\nThis is a reluctant reader — ONLY recommend fast-paced books with short chapters and high action.`:"";
    const didntLikeNote=didntLike.trim()?`\n\nThe student did NOT enjoy: "${didntLike.trim()}". Avoid books with these qualities.`:"";
    const recs=await callClaude(cands,ctx,[...alreadyRead,...shown],priorityLabel,activeProfile?.likedBooks||[],getLikedThemes(),prefNote,reluctantNote,didntLikeNote,advisoryNote);
    const enriched=recs.map(r=>({...(books.find(b=>b.title===r.title&&b.author===r.author)||books.find(b=>b.title===r.title)||r),...r}));
    setShownTitles(new Set([...shown,...enriched.map(b=>b.title)]));
    if(isMore) setResults(p=>[...(p||[]),...enriched]);
    else setResults(enriched);
    trackRecs(enriched);
  };

  const search=async()=>{
    setError("");setResults(null);setLoading(true);setShownTitles(new Set());lastSearch.current=null;
    try{
      const params=buildParams();
      if(!params){setError(mode==="similar"?"Please select a title from the list.":mode==="tropes"?"Please select at least one trope.":"Please describe what the student is looking for.");setLoading(false);return;}
      lastSearch.current=params;
      const structured=parseStructuredRequest({mode,query,refBook,selTropes,priorityTrope,activeProfile,didntLike});
      setStructuredRequest(structured);
      setRequestInterpretation(makeRequestInterpretation({mode,query,refBook,selTropes,priorityTrope,activeProfile,alreadyRead,didntLike}));
      const histLabel=mode==="similar"?query:mode==="tropes"?TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label).join(', '):query;
      addToHistory(histLabel,mode);
      await runSearch(params,new Set());
      trackSearch(mode,mode==="tropes"?[...selTropes]:[]);
    }catch(e){console.error(e);setSearchMeta({...searchMeta,engine:"Search failed",lastError:String(e)});setError("Search failed. Check the browser console, your Cloudflare Worker, and whether the catalog files are in the same GitHub folder.");}
    setLoading(false);
  };

  const searchMore=async()=>{
    if(!lastSearch.current) return;
    setLoadingMore(true);
    try{await runSearch(lastSearch.current,shownTitles,true);}
    catch{setError("Search failed. Please try again.");}
    setLoadingMore(false);
  };

  const copyResults=()=>{
    if(!results?.length) return;
    const text=results.map((b,i)=>`${ROMAN[i]||i+1}. ${b.title} by ${b.author}\n   ${b.reason||""}`).join('\n\n');
    navigator.clipboard.writeText(text).then(()=>addToast('📋 Recommendations copied')).catch(()=>addToast('Could not copy','error'));
  };

  const saveProfile=p=>{
    const updated=profiles.find(x=>x.id===p.id)?profiles.map(x=>x.id===p.id?p:x):[...profiles,p];
    saveProfiles(updated);setActiveProfileId(p.id);setAlreadyRead(new Set(p.alreadyRead||[]));setEditing(null);
    addToast('Student profile saved ✓');
  };

  const deleteProfile=id=>{
    saveProfiles(profiles.filter(p=>p.id!==id));
    if(activeProfileId===id){setActiveProfileId(null);setAlreadyRead(new Set());}
    setEditing(null);addToast('Profile deleted');
  };

  const loaded=bookCount>0;
  const modeLbls={similar:"Similar",tropes:"Trope",freetext:"Describe"};

  // Wire header buttons to React state via portal
  React.useEffect(()=>{
    const el=document.getElementById('hdr-btns');
    if(!el) return;
    const root=ReactDOM.createRoot?ReactDOM.createRoot(el):null;
    if(root){
      root.render(<>
        <button className={`hdr-btn${showAbout?" on":""}`} onClick={()=>{setShowAbout(p=>!p);setShowStats(false);}}>About</button>
        <button className={`hdr-btn${showStats?" on":""}`} onClick={()=>{setShowStats(p=>!p);setShowAbout(false);}}>Stats</button>
      </>);
    }
  },[showAbout,showStats]);

  return <div className="page-body">
    <div className={`view-panel ${(activeView==="dashboard"||activeView==="recommend")?"active":""}`} data-panel="recommend">

    {/* STATUS BAR */}
    <div className="status-bar">
      <div className="status-item"><div className={`dot${loaded?" ready":""}`}/><span>{loaded?`${bookCount.toLocaleString()} titles loaded`:"Loading catalog…"}</span></div>
      <div className="status-item">
        <div className={`dot${embedReady===true?" ready":embedReady===null?" spin":""}`}/>
        <span>{embedReady===null?"Initializing semantic search…":embedReady?"Semantic search ready":"Keyword search active"}</span>
      </div>
    </div>

    {appSettings.showStatus&&<SystemStatusPanel loaded={loaded} bookCount={bookCount} embedReady={embedReady} loadError={loadError} profiles={profiles} results={results} searchMeta={searchMeta}/>} 

    {showAbout&&<AboutPanel/>}
    {showStats&&<AnalyticsPanel analytics={analytics}/>}

    {loadError&&<div className="error-msg">⚠ Could not load the book catalog. Make sure {CSV_FILE} is in your repository.</div>}

    {loaded&&<>
      {/* STUDENT PROFILES */}
      <div className="section">
        <div className="sec-label">Student Profile</div>
        <div className="pills">
          <button className={`pill${!activeProfileId?" on":""}`} onClick={()=>selectProfile(null)}>No Profile</button>
          {profiles.map(p=><div key={p.id} style={{display:"flex",alignItems:"center"}}>
            <button className={`pill${activeProfileId===p.id?" on-l":""}`} onClick={()=>selectProfile(p.id)}>
              {p.initials} <span style={{fontSize:11,opacity:.7,marginLeft:2}}>{p.grade}</span>
            </button>
            {activeProfileId===p.id&&<button className="pill-edit" onClick={()=>setEditing(editing?.id===p.id?null:p)}>✎</button>}
          </div>)}
          {profiles.length<10&&<button className="pill-add" onClick={()=>setEditing({initials:"",grade:"6th",notes:"",reluctant:false,advisoryNotes:"",tasteSignals:[],avoidSignals:[],likedBooks:[],alreadyRead:[]})}>+ New Profile</button>}
        </div>
        {activeProfile&&<div className="profile-meta">
          {activeProfile.notes&&<span className="profile-note">"{activeProfile.notes}"</span>}
          <button className="profile-btn" onClick={()=>setShowSummary(p=>!p)}>{showSummary?"Hide":"View profile"}</button>
          {activeProfile.reluctant&&<span className="reluctant-tag">⚡ Reluctant reader</span>}
        </div>}
      </div>

      {showSummary&&activeProfile&&<ProfileSummary profile={activeProfile} onClose={()=>setShowSummary(false)}/>}
      {editing&&<ProfileEditor profile={editing} books={books} onSave={saveProfile} onDelete={deleteProfile} onCancel={()=>setEditing(null)}/>}

      {!editing&&<>
        {/* SEARCH HISTORY */}
        {searchHistory.length>0&&<div className="history">
          <div className="sec-label" style={{marginBottom:8}}>Recent searches</div>
          <div className="history-chips">
            {searchHistory.map(h=><div key={h.id} className="hchip" onClick={()=>{switchMode(h.mode);if(h.mode!=="tropes")setQuery(h.label);}}>
              <span className="hmode">{modeLbls[h.mode]}</span>
              <span>{h.label.length>42?h.label.slice(0,42)+'…':h.label}</span>
            </div>)}
          </div>
        </div>}

        {/* SEARCH MODES */}
        <div className="tabs">
          {[{id:"similar",label:"Find Similar"},{id:"tropes",label:"By Trope"},{id:"freetext",label:"Describe It"}].map(m=>(
            <button key={m.id} className={`tab${mode===m.id?" on":""}`} onClick={()=>switchMode(m.id)}>{m.label}</button>
          ))}
        </div>

        {mode==="similar"&&<div className="inp-sec">
          <div className="sec-label">Book title</div>
          <MainInput value={query} onChange={onQueryChange} onEnter={search} suggestions={suggestions}
            onSelect={b=>{setRefBook(b);setQuery(b.title);setSuggestions([]);}} clearSugg={()=>setSuggestions([])}/>
          <div className="inp-hint">Select a title from the suggestions, then click Find Books</div>
        </div>}

        {mode==="freetext"&&<div className="inp-sec">
          <div className="sec-label">Describe what the student is looking for</div>
          <textarea className="main-textarea" value={query} onChange={e=>setQuery(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();search();}}}
            rows={3} placeholder='e.g. "A fantasy with a strong female lead who discovers she has hidden powers"'/>
          <div className="inp-hint">Press Enter to search · Shift+Enter for a new line</div>
        </div>}

        {mode==="tropes"&&<div className="inp-sec">
          <p className="trope-hint">Select one or more tropes · Click again to mark as must-have (★)</p>
          {CATS.map(cat=><div key={cat} className="trope-sec">
            <div className="trope-cat">{cat}</div>
            <div className="trope-chips">
              {TROPES.filter(t=>t.cat===cat).map(t=>{
                const on=selTropes.has(t.id),isPrio=priorityTrope===t.id;
                return <button key={t.id} onClick={()=>toggleTrope(t.id)} className={`tchip${isPrio?" prio":on?" sel":""}`}>
                  {isPrio?"★ ":""}{t.label}
                </button>;
              })}
            </div>
          </div>)}
        </div>}

        {/* ALREADY READ */}
        <div className="inp-sec">
          <div className="sec-label">Exclude books already read</div>
          <BookSearch books={books} exclude={alreadyRead} onSelect={b=>setAlreadyRead(prev=>new Set([...prev,b.title]))} placeholder="Add a title to exclude…"/>
          <ChipList items={[...alreadyRead]} onRemove={t=>setAlreadyRead(prev=>{const n=new Set(prev);n.delete(t);return n;})}/>
        </div>

        {/* LIKED BANNER */}
        {activeProfile?.likedBooks?.length>0&&<div className="liked-banner">
          <span className="liked-icon">❤</span>
          <div className="liked-body">
            <strong>Influencing recommendations</strong>
            {activeProfile.likedBooks.join(", ")}
          </div>
        </div>}

        <ProfileInfluencePanel profile={activeProfile}/>
        <ConstraintSummaryPanel structured={structuredRequest}/>

        {/* DIDNT LIKE */}
        <div className="inp-sec">
          <div className="sec-label">What didn't the student enjoy? <span style={{color:"var(--text3)",fontWeight:400,textTransform:"none",letterSpacing:0,fontSize:12}}>(optional)</span></div>
          <input className="main-input" value={didntLike} onChange={e=>setDidntLike(e.target.value)} placeholder='e.g. "too slow, too much romance, confusing ending"'/>
        </div>

        {error&&<div className="error-msg"><span>⚠</span>{error}</div>}

        {loading&&<LoadingView stageMsg={stageMsg}/>}
        {loadingMore&&<LoadingView stageMsg={stageMsg}/>}

        {!loading&&<button className="search-btn" onClick={search} disabled={loadingMore}>Find Books</button>}

        {/* RESULTS */}
        {requestInterpretation&&<RequestInterpretation interpretation={requestInterpretation}/>}
        {results&&results.length>0&&!loading&&<div ref={resultsRef}>
          <div className="results-hdr">
            <span className="results-title">Recommendations</span>
            <div className="results-line"/>
            <span className="results-count">{results.length} titles</span>
          </div>
          {results.map((b,i)=><ResultCard key={`${b.title}-${i}`} book={b} index={i} activeProfile={activeProfile} onHeart={toggleHeart} onNoteSave={()=>addToast('Note saved ✓')} onFeedback={markFeedback} feedbackState={feedback} structuredRequest={structuredRequest}/>)}
          <div className="ractions">
            <button className="act-btn primary" onClick={saveCurrentList}>♡ Save This List</button>
            <button className="act-btn" onClick={()=>window.print()}>🖨 Print</button>
            <button className="act-btn" onClick={copyResults}>📋 Copy list</button>
            {!loadingMore&&<button className="act-btn primary" onClick={searchMore}>Load more →</button>}
          </div>
        </div>}

        {results&&results.length===0&&!loading&&<div className="empty">
          <p className="empty-title">No matching titles found.</p>
          <p className="empty-sub">Try broadening your search or using a different mode.</p>
          <div className="empty-actions">
            <div className="echip" onClick={()=>switchMode("freetext")}>Try describing it</div>
            <div className="echip" onClick={()=>switchMode("tropes")}>Browse by trope</div>
            <div className="echip" onClick={()=>setResults(null)}>Start over</div>
          </div>
        </div>}
      </>}
    </>}
    </div>

    <ProfileDirectoryPanel profiles={profiles} onSelect={selectProfile} onEdit={p=>setEditing(p)} onNew={()=>setEditing({initials:"",grade:"6th",notes:"",reluctant:false,advisoryNotes:"",tasteSignals:[],avoidSignals:[],likedBooks:[],alreadyRead:[]})}/>
    <InsightsPanel analytics={analytics} feedback={feedback} books={books} bookCount={bookCount}/>
    <SavedListsPanel savedLists={savedLists} onOpen={openSavedList} onDelete={deleteSavedList} onPrint={printSavedList}/>
    <SettingsPanelReal settings={appSettings} setSettings={setAppSettings} onExportProfiles={()=>exportJson("fletcher-readermatch-profiles.json",profiles)} onExportAnalytics={()=>exportJson("fletcher-readermatch-analytics.json",analytics)} onExportLists={()=>exportJson("fletcher-readermatch-saved-lists.json",savedLists)} onClearDemo={clearLocalDemo}/>

    <Toasts toasts={toasts}/>
  </div>;
}

const rootEl=document.getElementById("root");
if(ReactDOM.createRoot){ReactDOM.createRoot(rootEl).render(<App/>);}
else{ReactDOM.render(<App/>,rootEl);}
</script>

</body>
</html>
