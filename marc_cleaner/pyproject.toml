[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marc-cleaner"
version = "9.0"
description = "OPALS MARC Cleaner for Fletcher Library"
requires-python = ">=3.10"
dependencies = [
    "pymarc>=5.2,<6",
    "pandas>=2.0,<4",
    "python-stdnum>=1.19,<3",
    "PyYAML>=6,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
ui = ["gradio>=5,<7"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marc_cleaner = ["rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
