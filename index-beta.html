  const[didntLike,setDidntLike]=React.useState("");
  const[results,setResults]=React.useState(null);
  const[loading,setLoading]=React.useState(false);
  const[loadingMore,setLoadingMore]=React.useState(false);
  const[stageMsg,setStageMsg]=React.useState(STAGE_MSGS[0]);
  const[error,setError]=React.useState("");
  const[suggestions,setSuggestions]=React.useState([]);
  const[refBook,setRefBook]=React.useState(null);
  const[shownTitles,setShownTitles]=React.useState(new Set());
  const[toasts,setToasts]=React.useState([]);
  const[searchHistory,setSearchHistory]=React.useState([]);
  const[structuredRequest,setStructuredRequest]=React.useState(null);
  const[feedback,setFeedback]=React.useState(()=>lsLoad("feedback",{}));
  const[savedLists,setSavedLists]=React.useState(()=>lsLoad("savedLists",[]));
  const[showSavedLists,setShowSavedLists]=React.useState(false);
  const lastSearch=React.useRef(null);
  const[activeBook,setActiveBook]=React.useState(null);
  const[activeBookColor,setActiveBookColor]=React.useState('#1E1C2A');
  const[haveItSet,setHaveItSet]=React.useState(new Set());
  const[tblBatchLabel,setTblBatchLabel]=React.useState('');
  const[tableVisible,setTableVisible]=React.useState(false);
  const structuredRef=React.useRef(null);
  const stageRef=React.useRef(null);
  const resultsRef=React.useRef(null);

  React.useEffect(()=>{
    fetch(CSV_FILE).then(r=>{if(!r.ok)throw new Error();return r.text();})
      .then(t=>Papa.parse(t,{header:true,skipEmptyLines:true,complete:r=>{setBooks(r.data);setBookCount(r.data.length);updateStatus('catalog','ready',`${r.data.length.toLocaleString()} titles loaded`);}}))
      .catch(()=>{setLoadError(true);updateStatus('catalog','','Could not load catalog');});
  },[]);

  React.useEffect(()=>{
    fetch('book_embeddings.json').then(r=>{if(!r.ok)throw new Error();return r.json();})
      .then(d=>{setBookEmbeddings(d);updateStatus('embed','ready','Semantic search ready');})
      .catch(()=>{setBookEmbeddings({});updateStatus('embed','','Keyword search active');});
  },[]);

  React.useEffect(()=>{
    if(loading||loadingMore){let i=0;stageRef.current=setInterval(()=>{i=(i+1)%STAGE_MSGS.length;setStageMsg(STAGE_MSGS[i]);},2000);}
    else{if(stageRef.current)clearInterval(stageRef.current);setStageMsg(STAGE_MSGS[0]);}
    return()=>{if(stageRef.current)clearInterval(stageRef.current);};
  },[loading,loadingMore]);

  React.useEffect(()=>{
    if(results?.length&&resultsRef.current) setTimeout(()=>resultsRef.current.scrollIntoView({behavior:'smooth',block:'start'}),150);
  },[results]);

  React.useEffect(()=>{
    const el=document.getElementById('hero-btns');
    if(!el||!ReactDOM.createRoot) return;
    const root=ReactDOM.createRoot(el);
    root.render(<>
      <button className={`hero-btn${showAbout?" on":""}`} onClick={()=>{setShowAbout(p=>!p);setShowStats(false);}}>About</button>
      <button className={`hero-btn${showStats?" on":""}`} onClick={()=>{setShowStats(p=>!p);setShowAbout(false);}}>Stats</button>
    </>);
  },[showAbout,showStats]);

  React.useEffect(()=>{
    tblOnTap=(book,idx,color)=>{setActiveBook(book);setActiveBookColor(color);tblSetActive(idx);};
  },[]);
  React.useEffect(()=>{tblSyncHave(haveItSet);},[haveItSet]);
  React.useEffect(()=>{
    if(loading&&tableVisible){tblMkBooks([]);tblBuildStack();tblStartRock(true);tblStartLoad();}
    if(!loading&&tableVisible){tblStopLoad();tblStopRock();tblDust();tblRmStack();tblMkBooks(results||[]);setTimeout(()=>tblDeal(0),280);}
  },[loading]);

  const addToast=(msg,type='success')=>{const id=Date.now()+Math.random();setToasts(p=>[...p,{id,msg,type}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),2800);};
  const saveProfiles=p=>{setProfiles(p);lsSave("profiles",p);};
  const saveAnalytics=a=>{setAnalytics(a);lsSave("analytics",a);};
  const activeProfile=profiles.find(p=>p.id===activeProfileId)||null;

  const selectProfile=id=>{setActiveProfileId(id);setEditing(null);setResults(null);setShownTitles(new Set());lastSearch.current=null;setShowSummary(false);setStructuredRequest(null);setAlreadyRead(id?new Set(profiles.find(p=>p.id===id)?.alreadyRead||[]):new Set());setTableVisible(false);setActiveBook(null);setHaveItSet(new Set());tblMkBooks([]);};
  const toggleHeart=title=>{if(!activeProfile)return;const liked=activeProfile.likedBooks||[];const nowLiked=!liked.includes(title);const updated=nowLiked?[...liked,title]:liked.filter(t=>t!==title);saveProfiles(profiles.map(p=>p.id===activeProfileId?{...p,likedBooks:updated}:p));addToast(nowLiked?'❤ Added to liked books':'Removed from liked books');};
  const markFeedback=(title,key)=>{const next={...feedback,[title]:{...(feedback[title]||{}),[key]:!(feedback[title]?.[key])}};setFeedback(next);lsSave("feedback",next);addToast("Feedback saved ✓");};

  const saveCurrentList=()=>{
    if(!results?.length){addToast("Generate recommendations first","info");return;}
    const name=prompt("Name this list:",activeProfile?`${activeProfile.initials} — recommendations`:"Fletcher recommendations");
    if(!name) return;
    const list={id:uid(),name,createdAt:new Date().toISOString(),profileName:activeProfile?.initials||"",request:structuredRequest?.originalQuery||query||"",books:results};
    const next=[list,...savedLists];setSavedLists(next);lsSave("savedLists",next);setShowSavedLists(true);addToast("List saved ✓");
  };

  const openSavedList=list=>{setResults(list.books||[]);setStructuredRequest(null);addToast("Saved list loaded");setTimeout(()=>resultsRef.current?.scrollIntoView({behavior:'smooth',block:'start'}),150);};
  const deleteSavedList=id=>{const next=savedLists.filter(l=>l.id!==id);setSavedLists(next);lsSave("savedLists",next);addToast("List deleted");};
  const printSavedList=list=>{const html=`<html><head><title>${list.name}</title><style>body{font-family:Georgia,serif;padding:32px;line-height:1.5}h1{font-size:26px;margin-bottom:4px}.meta{color:#666;font-size:13px;margin-bottom:24px}h2{font-size:18px;margin-top:20px}.book{break-inside:avoid;margin:18px 0;padding-bottom:14px;border-bottom:1px solid #ddd}</style></head><body><h1>Fletcher Library — Recommended Reads</h1><p class="meta">${list.name} · ${new Date(list.createdAt).toLocaleString()}</p>${(list.books||[]).map((b,i)=>`<div class="book"><h2>${i+1}. ${b.title}</h2><p><em>${b.author||""}</em></p><p>${b.reason||""}</p></div>`).join("")}</body></html>`;const w=window.open("","_blank");w.document.write(html);w.document.close();w.focus();w.print();};
  const copySavedList=list=>{const text=(list.books||[]).map((b,i)=>`${i+1}. ${b.title} by ${b.author||""}\n   ${b.reason||""}`).join("\n\n");navigator.clipboard.writeText(text).then(()=>addToast('📋 List copied')).catch(()=>addToast('Could not copy','error'));};

  const trackSearch=(m,tropes=[])=>{const a={...analytics,totalSearches:(analytics.totalSearches||0)+1,searchModes:{...analytics.searchModes,[m]:(analytics.searchModes[m]||0)+1},tropeSearches:{...analytics.tropeSearches}};tropes.forEach(t=>{a.tropeSearches[t]=(a.tropeSearches[t]||0)+1;});saveAnalytics(a);};
  const trackRecs=recs=>{const a={...analytics,recommendedBooks:{...analytics.recommendedBooks}};recs.forEach(b=>{a.recommendedBooks[b.title]=(a.recommendedBooks[b.title]||0)+1;});saveAnalytics(a);};
  const addToHistory=(label,m)=>setSearchHistory(p=>[{label,mode:m,id:Date.now()},...p.filter(e=>e.label!==label)].slice(0,5));

  const getLikedKws=()=>{if(!activeProfile?.likedBooks?.length)return[];const objs=books.filter(b=>activeProfile.likedBooks.includes(b.title));const st=objs.map(b=>b.enriched_subjects||b.subjects||"").join(" ");const sm=objs.map(b=>b.enriched_summary||b.summary||"").join(" ");return[...tokenize(st),...tokenize(st),...tokenize(st),...tokenize(sm)];};
  const getLikedThemes=()=>{if(!activeProfile?.likedBooks?.length)return"";const objs=books.filter(b=>activeProfile.likedBooks.includes(b.title));const all=objs.flatMap(b=>(b.enriched_subjects||b.subjects||"").split("|").map(s=>s.trim())).filter(Boolean);const unique=[...new Set(all)].slice(0,12);return unique.length?`\n\nThemes from books this student enjoyed: ${unique.join("; ")}. Prioritize books sharing these themes.`:"";};
  const onQueryChange=val=>{setQuery(val);setRefBook(null);if(mode==="similar"&&val.length>1)setSuggestions(books.filter(b=>(b.title||"").toLowerCase().includes(val.toLowerCase())).slice(0,6));else setSuggestions([]);};
  const toggleTrope=id=>{setSelTropes(prev=>{const n=new Set(prev);if(!n.has(id)){n.add(id);}else if(priorityTrope!==id){setPriorityTrope(id);}else{n.delete(id);setPriorityTrope(null);}return n;});};
  const switchMode=m=>{setMode(m);setResults(null);setError("");setQuery("");setRefBook(null);setStructuredRequest(null);setSuggestions([]);setSelTropes(new Set());setPriorityTrope(null);setShownTitles(new Set());lastSearch.current=null;setTableVisible(false);setActiveBook(null);setHaveItSet(new Set());tblMkBooks([]);};

  const buildParams=()=>{
    let ctx="",excl=null,priorityLabel=null;
    if(mode==="similar"){const ref=refBook||books.find(b=>(b.title||"").toLowerCase()===query.toLowerCase());if(!ref)return null;excl=ref.title;ctx=`A student loved "${ref.title}" by ${ref.author}.\n\nSummary: ${ref.enriched_summary||ref.summary||""}\n\nFind books with similar themes, characters, tone, and plot elements.`;}
    else if(mode==="tropes"){if(!selTropes.size)return null;const labels=TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label);if(priorityTrope)priorityLabel=TROPES.find(t=>t.id===priorityTrope)?.label;ctx=`A student wants books with: ${labels.join(", ")}. Find the best matches.`;}
    else{if(!query.trim())return null;ctx=`A student wants: "${query}". Find the best matches.`;}
    return{ctx,excl,priorityLabel};
  };

  const buildQueryText=()=>{
    if(mode==="similar"&&refBook) return `${refBook.title} ${refBook.author} ${refBook.enriched_subjects||refBook.subjects||""} ${refBook.enriched_summary||refBook.summary||""}`;
    if(mode==="tropes"){const labels=TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label);return[...new Set(labels.flatMap(l=>{const id=TROPES.find(t=>t.label===l)?.id;return[...tokenize(l),...(TROPE_KEYWORDS[id]||[])]}))].join(' ');}
    return query;
  };

  const runSearch=async(params,shown,isMore=false)=>{
    const{ctx,excl,priorityLabel}=params;
    const queryText=buildQueryText();
    const refAuthor=(mode==='similar'&&refBook)?refBook.author:null;
    const advisoryNote=advisoryTextForProfile(activeProfile);
    const cands=await getCandidates(books,queryText,bookEmbeddings,getLikedKws(),70,excl,alreadyRead,shown,refAuthor);
    const prefNote=activeProfile?.notes?`\n\nStudent reading preferences: ${activeProfile.notes}. Please respect these.`:"";
    const reluctantNote=activeProfile?.reluctant?`\n\nThis is a reluctant reader — ONLY recommend fast-paced books with short chapters and high action.`:"";
    const didntLikeNote=didntLike.trim()?`\n\nThe student did NOT enjoy: "${didntLike.trim()}". Avoid books with these qualities.`:"";
    const recs=await callClaude(cands,ctx,[...alreadyRead,...shown],priorityLabel,activeProfile?.likedBooks||[],getLikedThemes(),prefNote,reluctantNote,didntLikeNote,advisoryNote,structuredRef.current);
    const enriched=recs.map(r=>({...(books.find(b=>b.title===r.title&&b.author===r.author)||books.find(b=>b.title===r.title)||r),...r}));
    setShownTitles(new Set([...shown,...enriched.map(b=>b.title)]));
    if(isMore) setResults(p=>[...(p||[]),...enriched]);
    else setResults(enriched);
    trackRecs(enriched);
    tblMkBooks(enriched);
    setTblBatchLabel(isMore?'Batch 2':'Batch 1');
  };

  const search=async()=>{
    setError("");setResults(null);setLoading(true);setShownTitles(new Set());lastSearch.current=null;setStructuredRequest(null);
    setActiveBook(null);setHaveItSet(new Set());setTableVisible(true);
    try{
      const params=buildParams();
      if(!params){setError(mode==="similar"?"Please select a title from the suggestions.":mode==="tropes"?"Please select at least one trope.":"Please describe what the student is looking for.");setLoading(false);return;}
      const structured=parseStructuredRequest({mode,query,refBook,selTropes,priorityTrope,activeProfile,alreadyRead,didntLike});
      setStructuredRequest(structured);
      structuredRef.current=structured;
      lastSearch.current=params;
      const histLabel=mode==="similar"?query:mode==="tropes"?TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label).join(', '):query;
      addToHistory(histLabel,mode);
      await runSearch(params,new Set());
      trackSearch(mode,mode==="tropes"?[...selTropes]:[]);
    }catch(e){console.error(e);setError("Search failed. Please check your connection and try again.");}
    setLoading(false);
  };

  const searchMore=async()=>{
    if(!lastSearch.current)return;
    setLoadingMore(true);setActiveBook(null);
    tblExit();
    setTimeout(()=>{tblBuildStack();tblStartRock(true);tblStartLoad();},6*28+200);
    try{await runSearch(lastSearch.current,shownTitles,true);}catch{setError("Search failed.");}
    setLoadingMore(false);
  };
  const bookAccent=hex=>{if(!hex||!hex.startsWith('#'))return'var(--border)';const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},.4)`;};
  const tblPrintList=()=>{if(!results?.length)return;const books=results.filter(b=>!haveItSet.has(b.title));if(!books.length){addToast('All marked checked out','info');return;}const html=`<html><head><title>Fletcher Library</title><style>body{font-family:Georgia,serif;padding:32px;max-width:680px;margin:0 auto}h1{font-size:24px}.meta{color:#666;font-size:13px;margin-bottom:24px;padding-bottom:12px;border-bottom:2px solid #9B6540}.book{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid #E8D8B8;break-inside:avoid}.bnum{font-size:11px;font-weight:700;color:#9B6540;width:20px;flex-shrink:0}.btit{font-size:15px;font-weight:700;margin-bottom:2px}.baut{font-size:12px;color:#7A5A30;margin-bottom:6px;font-style:italic}.blv{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid;display:inline-block;margin-bottom:6px}.ql{color:#2D7A4A;border-color:#2D7A4A}.st{color:#9B6540;border-color:#9B6540}.lh{color:#A0402A;border-color:#A0402A}.brsn{font-size:13px;color:#5A4030;line-height:1.6;font-style:italic}.footer{margin-top:24px;padding-top:12px;border-top:1px solid #E8D8B8;font-size:10px;color:#B0906A;text-align:center;text-transform:uppercase}</style></head><body><h1>Fletcher Library</h1><div class="meta">Recommended · ${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div>${books.map((b,i)=>{const p=parseInt(b.pages);const rl=!b.pages||isNaN(p)?null:p<250?['ql','Quick Read']:p<=350?['st','Standard']:['lh','Long Haul'];return\`<div class="book"><div class="bnum">${ROMAN[i]||i+1}</div><div><div class="btit">${b.title}</div><div class="baut">${b.author||''}</div>${rl?\`<span class="blv ${rl[0]}">${rl[1]}·${p}pp</span>\`:''}<div class="brsn">${b.reason||''}</div></div></div>\`;}).join('')}<div class="footer">The Fletcher Library Recommends</div></body></html>`;const w=window.open('','_blank');w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),400);};
  const copyResults=()=>{if(!results?.length)return;const text=results.map((b,i)=>`${ROMAN[i]||i+1}. ${b.title} by ${b.author}\n   ${b.reason||""}`).join('\n\n');navigator.clipboard.writeText(text).then(()=>addToast('📋 Copied')).catch(()=>addToast('Could not copy','error'));};
  const saveProfile=p=>{const updated=profiles.find(x=>x.id===p.id)?profiles.map(x=>x.id===p.id?p:x):[...profiles,p];saveProfiles(updated);setActiveProfileId(p.id);setAlreadyRead(new Set(p.alreadyRead||[]));setEditing(null);addToast('Profile saved ✓');};
  const deleteProfile=id=>{saveProfiles(profiles.filter(p=>p.id!==id));if(activeProfileId===id){setActiveProfileId(null);setAlreadyRead(new Set());}setEditing(null);addToast('Profile deleted');};

  const loaded=bookCount>0;
  const modeLbls={similar:"Similar",tropes:"Trope",freetext:"Describe"};

  return <div className="page">
    <Toasts toasts={toasts}/>

    {showAbout&&<AboutPanel/>}
    {showStats&&<AnalyticsPanel analytics={analytics}/>}
    {loadError&&<div className="error-msg">⚠ Could not load {CSV_FILE}. Make sure it's in your repository.</div>}

    {loaded&&<>
      {/* PROFILES */}
      <div className="gold-divider"><span>Student Profile</span></div>
      <div className="section">
        <div className="pills">
          <button className={`pill${!activeProfileId?" on":""}`} onClick={()=>selectProfile(null)}>No Profile</button>
          {profiles.map(p=><div key={p.id} style={{display:"flex",alignItems:"center"}}>
            <button className={`pill${activeProfileId===p.id?" on-l":""}`} onClick={()=>selectProfile(p.id)}>{p.initials} <span style={{fontSize:11,opacity:.6,marginLeft:2}}>{p.grade}</span></button>
            {activeProfileId===p.id&&<button className="pill-edit" onClick={()=>setEditing(editing?.id===p.id?null:p)}>✎</button>}
          </div>)}
          {profiles.length<10&&<button className="pill-add" onClick={()=>setEditing({initials:"",grade:"6th",notes:"",reluctant:false,advisoryNotes:"",tasteSignals:[],avoidSignals:[],likedBooks:[],alreadyRead:[]})}>+ New Profile</button>}
        </div>
        {activeProfile&&<div className="profile-meta">
          {activeProfile.notes&&<span className="profile-note">"{activeProfile.notes}"</span>}
          <button className="profile-btn" onClick={()=>setShowSummary(p=>!p)}>{showSummary?"Hide":"View profile"}</button>
          {activeProfile.reluctant&&<span className="reluctant-tag">⚡ Reluctant</span>}
          {(activeProfile.advisoryNotes||splitSignals(activeProfile.tasteSignals).length>0)&&<span className="advisory-badge">✦ Advisory notes active</span>}
        </div>}
      </div>

      {showSummary&&activeProfile&&<ProfileSummary profile={activeProfile} onClose={()=>setShowSummary(false)}/>}
      {editing&&<ProfileEditor profile={editing} books={books} onSave={saveProfile} onDelete={deleteProfile} onCancel={()=>setEditing(null)}/>}

      {!editing&&<>
        {/* SEARCH HISTORY */}
        {searchHistory.length>0&&<div className="history">
          <div className="sec-label" style={{marginBottom:8}}>Recent searches</div>
          <div className="hchips">{searchHistory.map(h=><div key={h.id} className="hchip" onClick={()=>{switchMode(h.mode);if(h.mode!=="tropes")setQuery(h.label);}}><span className="hmode">{modeLbls[h.mode]}</span><span>{h.label.length>42?h.label.slice(0,42)+'…':h.label}</span></div>)}</div>
        </div>}

        {/* SEARCH MODE TABS */}
        <div className="gold-divider"><span>Find Books</span></div>
        <div className="mode-tabs">
          <button className={`mode-tab${mode==="similar"?" on":""}`} onClick={()=>switchMode("similar")}>
            <span className="mode-tab-icon">🔍</span>
            <span className="mode-tab-label">Find Similar</span>
            <span className="mode-tab-desc">A student loved a book — find more like it</span>
          </button>
          <button className={`mode-tab${mode==="tropes"?" on":""}`} onClick={()=>switchMode("tropes")}>
            <span className="mode-tab-icon">✦</span>
            <span className="mode-tab-label">By Trope</span>
            <span className="mode-tab-desc">Select themes and narrative elements</span>
          </button>
          <button className={`mode-tab${mode==="freetext"?" on":""}`} onClick={()=>switchMode("freetext")}>
            <span className="mode-tab-icon">✍</span>
            <span className="mode-tab-label">Describe It</span>
            <span className="mode-tab-desc">Describe what the student wants in plain language</span>
          </button>
        </div>

        {mode==="similar"&&<div className="inp-sec"><div className="sec-label">Book title</div><MainInput value={query} onChange={onQueryChange} onEnter={search} suggestions={suggestions} onSelect={b=>{setRefBook(b);setQuery(b.title);setSuggestions([]);}} clearSugg={()=>setSuggestions([])}/><div className="inp-hint">Select a title from the suggestions, then click Find Books</div></div>}
        {mode==="freetext"&&<div className="inp-sec"><div className="sec-label">Describe what the student is looking for</div><textarea className="main-textarea" value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();search();}}} rows={3} placeholder='e.g. "A fantasy with a strong female lead who discovers she has hidden powers"'/><div className="inp-hint">Press Enter to search · Shift+Enter for a new line</div></div>}
        {mode==="tropes"&&<div className="inp-sec"><p className="trope-hint">Select one or more tropes · Click again to mark as must-have (★)</p>{CATS.map(cat=><div key={cat} className="trope-sec"><div className="trope-cat">{cat}</div><div className="trope-chips">{TROPES.filter(t=>t.cat===cat).map(t=>{const on=selTropes.has(t.id),isPrio=priorityTrope===t.id;return <button key={t.id} onClick={()=>toggleTrope(t.id)} className={`tchip${isPrio?" prio":on?" sel":""}`}>{isPrio?"★ ":""}{t.label}</button>;})}</div></div>)}</div>}

        <div className="inp-sec"><div className="sec-label">Exclude already read</div><BookSearch books={books} exclude={alreadyRead} onSelect={b=>setAlreadyRead(prev=>new Set([...prev,b.title]))} placeholder="Add a title to exclude…"/><ChipList items={[...alreadyRead]} onRemove={t=>setAlreadyRead(prev=>{const n=new Set(prev);n.delete(t);return n;})}/></div>

        {activeProfile?.likedBooks?.length>0&&<div className="liked-banner"><span style={{fontSize:16,marginTop:2}}>❤</span><div className="liked-body"><strong>Influencing recommendations</strong>{activeProfile.likedBooks.join(", ")}</div></div>}

        <div className="inp-sec"><div className="sec-label">What didn't the student enjoy? <span style={{color:"var(--text3)",fontWeight:400,textTransform:"none",letterSpacing:0,fontSize:12}}>(optional)</span></div><input className="main-input" value={didntLike} onChange={e=>setDidntLike(e.target.value)} placeholder='e.g. "too slow, too much romance"'/></div>

        {error&&<div className="error-msg"><span>⚠</span>{error}</div>}
        <button className="search-btn" onClick={search} disabled={loading||loadingMore}>Find Books</button>

        {structuredRequest&&!loading&&<ConstraintPanel structured={structuredRequest}/>}

        {tableVisible&&<div style={{marginTop:16}}>
          <div className="fletcher-table" id="fletcherTable">
            <div className="table-clip">
              <svg className="table-svg" viewBox="0 0 640 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <rect width="640" height="300" fill="#9B6540"/>
                <path d="M0,14 Q160,10 320,15 Q480,20 640,14" stroke="#7A4D28" strokeWidth="2.5" fill="none" opacity="0.5"/>
                <path d="M0,42 Q160,38 320,43 Q480,48 640,42" stroke="#B07848" strokeWidth="1.5" fill="none" opacity="0.4"/>
                <path d="M0,88 Q160,92 320,87 Q480,82 640,89" stroke="#C4885C" strokeWidth="1.5" fill="none" opacity="0.35"/>
                <path d="M0,137 Q160,133 320,138 Q480,143 640,137" stroke="#B07848" strokeWidth="1.5" fill="none" opacity="0.38"/>
                <path d="M0,189 Q160,193 320,188 Q480,183 640,190" stroke="#C4885C" strokeWidth="1.5" fill="none" opacity="0.36"/>
                <path d="M0,244 Q160,240 320,245 Q480,250 640,244" stroke="#B07848" strokeWidth="1.5" fill="none" opacity="0.38"/>
                <ellipse cx="105" cy="88" rx="24" ry="15" stroke="#6B4020" strokeWidth="1.5" fill="none" opacity="0.28"/>
                <ellipse cx="530" cy="200" rx="19" ry="12" stroke="#6B4020" strokeWidth="1.5" fill="none" opacity="0.24"/>
                <rect width="640" height="300" fill="url(#tsheen)"/>
                <defs><radialGradient id="tsheen" cx="50%" cy="35%" r="65%"><stop offset="0%" stopColor="rgba(255,255,255,0.1)"/><stop offset="55%" stopColor="rgba(255,255,255,0.02)"/><stop offset="100%" stopColor="rgba(0,0,0,0.22)"/></radialGradient></defs>
              </svg>
              <div className="table-vignette"></div>
            </div>
            <div className="table-overlay" id="tableOverlay"></div>
            <div className="tbl-lbl" id="tblLoadingLbl">
              <div className="tbl-dots"><div className="tbl-dot"/><div className="tbl-dot"/><div className="tbl-dot"/></div>
              <div className="tbl-ltxt" id="tblLoadingTxt">Scanning…</div>
            </div>
            <div id="deckArea"></div>
          </div>
          <div className="tbl-info-area" style={{borderColor:activeBook?bookAccent(activeBookColor):'var(--border)'}}>
            {!activeBook&&<div className="tbl-info-empty">{results&&results.length>0?'Tap a book to see the full recommendation':'Searching…'}</div>}
            {activeBook&&<div className="tbl-info-card">
              <TblCoverImg isbn={activeBook.isbn} color={activeBookColor}/>
              <div className="tbl-info-right">
                <div className="tbl-badges">
                  <span className="fletcher-rec-badge">The Fletcher Library Recommends</span>
                  <TblReadingLevel pages={activeBook.pages}/>
                </div>
                <div>
                  <div className="tbl-info-title">{activeBook.title}</div>
                  <div className="tbl-info-author">{activeBook.author}{activeBook.series&&` · ${activeBook.series}`}</div>
                </div>
                <div className="tbl-info-divider" style={{background:bookAccent(activeBookColor)}}></div>
                <div className="tbl-info-reason" style={{borderLeftColor:bookAccent(activeBookColor)}}>{activeBook.reason}</div>
                <div className="tbl-info-actions">
                  <button className={`tbl-have-btn${haveItSet.has(activeBook.title)?' on':''}`} onClick={()=>{const t=activeBook.title;setHaveItSet(p=>{const n=new Set(p);n.has(t)?n.delete(t):n.add(t);return n;});}}>
                    {haveItSet.has(activeBook.title)?'✓ Marked as checked out':'Mark as checked out'}
                  </button>
                  {activeProfile&&<button className="tbl-heart-sm" onClick={()=>toggleHeart(activeBook.title)}>{activeProfile.likedBooks?.includes(activeBook.title)?'♥':'♡'}</button>}
                </div>
              </div>
            </div>}
          </div>
          {results&&results.length>0&&!loading&&<div className="tbl-bottom">
            {!loadingMore&&<button className="act-btn primary" onClick={searchMore}>Load more →</button>}
            <button className="act-btn" onClick={tblPrintList}>Print list</button>
            <button className="act-btn" onClick={copyResults}>Copy</button>
            <button className="act-btn primary" onClick={saveCurrentList}>Save List</button>
            {tblBatchLabel&&<span className="tbl-batch">{tblBatchLabel}</span>}
          </div>}
          <div style={{textAlign:"center",marginTop:12}}>
            <button className="profile-btn" onClick={()=>setShowSavedLists(p=>!p)}>{showSavedLists?"Hide saved lists":"View saved lists"}{savedLists.length>0?` (${savedLists.length})`:""}</button>
          </div>
        </div>}

        {(!results||results.length===0)&&savedLists.length>0&&!loading&&<div style={{textAlign:"center",margin:"20px 0"}}><button className="profile-btn" onClick={()=>setShowSavedLists(p=>!p)}>{showSavedLists?"Hide":"View saved lists"} ({savedLists.length})</button></div>}

        {showSavedLists&&<SavedListsPanel savedLists={savedLists} onOpen={openSavedList} onDelete={deleteSavedList} onPrint={printSavedList} onCopy={copySavedList}/>}

        {results&&results.length===0&&!loading&&<div className="empty"><p className="empty-title">No matching titles found.</p><p className="empty-sub">Try broadening your search or switching modes.</p><div className="empty-actions"><div className="echip" onClick={()=>switchMode("freetext")}>Try describing it</div><div className="echip" onClick={()=>switchMode("tropes")}>Browse by trope</div><div className="echip" onClick={()=>setResults(null)}>Start over</div></div></div>}
      </>}
    </>}
  </div>;
}

const rootEl=document.getElementById("root");
if(ReactDOM.createRoot){ReactDOM.createRoot(rootEl).render(<App/>);}
else{ReactDOM.render(<App/>,rootEl);}
</script>
</body>
</html>
