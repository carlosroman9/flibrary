<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fletcher Library Assistant</title>
  <link rel="icon" href="logo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --page:      #F4F1EC;
      --surface:   #FFFFFF;
      --surface2:  #F9F7F4;
      --surface3:  #EDE9E2;
      --ink:       #1C1917;
      --ink2:      #57534E;
      --ink3:      #A8A29E;
      --forest:    #1D3D2F;
      --forest-lt: #EBF2EE;
      --forest-bd: #A7C4B5;
      --amber:     #B45309;
      --amber-lt:  #FEF3C7;
      --amber-bd:  #F59E0B;
      --border:    #E7E2DA;
      --border2:   #D6CFC4;
      --green:     #15803D;
      --red:       #B91C1C;
      --red-lt:    #FEF2F2;
      --r:         10px;
      --sh-sm:     0 1px 3px rgba(28,25,23,.07), 0 1px 2px rgba(28,25,23,.05);
      --sh:        0 4px 12px rgba(28,25,23,.08), 0 2px 4px rgba(28,25,23,.04);
      --sh-lg:     0 12px 32px rgba(28,25,23,.12), 0 4px 12px rgba(28,25,23,.06);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--page);
      color: var(--ink);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    #root { max-width: 820px; margin: 0 auto; padding: 0 1.5rem 6rem; }

    /* ── TOASTS ── */
    .toasts { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
    .toast { font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:600; padding:10px 22px; border-radius:100px; box-shadow:var(--sh-lg); animation:tIn .2s ease both; white-space:nowrap; }
    .toast.success { background:var(--forest); color:#fff; }
    .toast.error   { background:var(--red); color:#fff; }
    .toast.info    { background:var(--ink); color:#fff; }
    @keyframes tIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    /* ── HEADER ── */
    .hdr {
      background: var(--forest);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(29,61,47,.25);
    }
    .hdr-inner {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 72px;
    }
    .hdr-logo-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .hdr-logo {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: contain;
      background: rgba(255,255,255,0.12);
      padding: 5px;
      border: 1.5px solid rgba(255,255,255,0.2);
      display: block;
    }
    .hdr-divider {
      width: 1px;
      height: 36px;
      background: rgba(255,255,255,.2);
      flex-shrink: 0;
    }
    .hdr-brand { flex: 1; }
    .hdr-school {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.55);
      line-height: 1;
      margin-bottom: 4px;
    }
    .hdr-title {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1;
      letter-spacing: -.01em;
    }
    .hdr-actions { display: flex; gap: 6px; align-items: center; }
    .hdr-btn {
      padding: 7px 15px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid rgba(255,255,255,.25);
      background: transparent;
      color: rgba(255,255,255,.8);
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .hdr-btn:hover, .hdr-btn.on {
      background: rgba(255,255,255,.15);
      border-color: rgba(255,255,255,.5);
      color: #fff;
    }

    /* ── PAGE ── */
    .page-body { padding-top: 24px; }

    /* ── STATUS BAR ── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 10px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      margin-bottom: 24px;
      box-shadow: var(--sh-sm);
    }
    .status-item { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:500; color:var(--ink2); }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--ink3); flex-shrink:0; }
    .dot.ready { background:var(--green); box-shadow:0 0 6px rgba(21,128,61,.4); }
    .dot.spin { background:var(--amber-bd); animation:pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── CARDS / PANELS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: var(--sh-sm);
    }
    .card-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--forest);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title::before {
      content: '';
      display: block;
      width: 3px;
      height: 14px;
      background: var(--forest);
      border-radius: 2px;
    }

    /* ── ABOUT ── */
    .about-card p { font-family:'Lora',serif; font-size:15px; color:var(--ink2); line-height:1.8; margin-bottom:10px; }
    .about-card strong { font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:600; color:var(--ink); }
    .feature-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
    .ftag { padding:4px 12px; background:var(--forest-lt); border:1px solid var(--forest-bd); border-radius:100px; font-size:11px; font-weight:600; color:var(--forest); }

    /* ── ANALYTICS ── */
    .stats-row { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
    .stat-box { flex:1; min-width:80px; background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:14px 12px; text-align:center; }
    .stat-n { font-family:'Fraunces',serif; font-size:30px; font-weight:700; color:var(--forest); line-height:1; }
    .stat-l { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--ink3); margin-top:5px; }
    .stat-cols { display:flex; gap:20px; flex-wrap:wrap; }
    .stat-col { flex:1; min-width:150px; }
    .stat-col-h { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink3); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border); }
    .stat-row { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:5px 0; border-bottom:1px solid var(--border); color:var(--ink2); }
    .stat-row:last-child { border-bottom:none; }
    .stat-row span:last-child { font-weight:700; color:var(--forest); }
    .stat-empty { font-family:'Lora',serif; font-size:14px; color:var(--ink3); font-style:italic; }

    /* ── PROFILE SECTION ── */
    .section { margin-bottom: 22px; }
    .sec-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink3);
      margin-bottom: 10px;
    }
    .pills { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .pill { padding:6px 16px; font-size:13px; font-weight:500; border:1.5px solid var(--border); background:var(--surface); color:var(--ink2); cursor:pointer; transition:all .15s; border-radius:100px; box-shadow:var(--sh-sm); }
    .pill:hover { border-color:var(--forest); color:var(--forest); background:var(--forest-lt); }
    .pill.on { background:var(--forest); border-color:var(--forest); color:#fff; box-shadow:0 2px 8px rgba(29,61,47,.25); }
    .pill.on-l { border-radius:100px 0 0 100px; background:var(--forest); border-color:var(--forest); color:#fff; border-right:none; box-shadow:none; }
    .pill-edit { padding:6px 11px; border-radius:0 100px 100px 0; background:var(--surface); border:1.5px solid var(--forest); border-left:none; color:var(--forest); cursor:pointer; font-size:13px; transition:all .15s; }
    .pill-edit:hover { background:var(--forest-lt); }
    .pill-add { padding:6px 16px; font-size:13px; font-weight:500; border:1.5px dashed var(--border2); background:transparent; color:var(--ink3); cursor:pointer; border-radius:100px; transition:all .15s; }
    .pill-add:hover { border-color:var(--forest); color:var(--forest); }
    .profile-meta { margin-top:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .profile-note { font-family:'Lora',serif; font-size:14px; color:var(--ink2); font-style:italic; }
    .profile-btn { font-size:12px; font-weight:600; padding:4px 12px; border:1.5px solid var(--border); background:transparent; color:var(--ink2); border-radius:6px; cursor:pointer; transition:all .15s; }
    .profile-btn:hover { border-color:var(--forest); color:var(--forest); }
    .reluctant-tag { font-size:11px; font-weight:700; color:var(--amber); background:var(--amber-lt); border:1px solid #FDE68A; border-radius:100px; padding:3px 10px; }

    /* ── EDITOR ── */
    .editor { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:22px; margin-bottom:16px; box-shadow:var(--sh-sm); }
    .editor-title { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--forest); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
    .editor-title::before { content:''; display:block; width:3px; height:14px; background:var(--forest); border-radius:2px; }
    .ed-row { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
    .field { display:flex; flex-direction:column; gap:5px; }
    .field label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink3); }
    .finput { padding:9px 13px; font-size:14px; font-family:'Plus Jakarta Sans',sans-serif; background:var(--surface2); border:1.5px solid var(--border); color:var(--ink); border-radius:8px; outline:none; transition:border-color .15s, box-shadow .15s; }
    .finput:focus { border-color:var(--forest); box-shadow:0 0 0 3px var(--forest-lt); }
    .finput::placeholder { color:var(--ink3); }

    .toggle { display:flex; align-items:center; gap:12px; padding:11px 14px; background:var(--surface2); border:1.5px solid var(--border); border-radius:9px; cursor:pointer; transition:all .15s; margin-bottom:12px; }
    .toggle:hover, .toggle.on { border-color:var(--forest); background:var(--forest-lt); }
    .toggle-sw { width:38px; height:22px; background:var(--border2); border-radius:11px; position:relative; transition:background .15s; flex-shrink:0; }
    .toggle-sw.on { background:var(--forest); }
    .toggle-knob { position:absolute; top:3px; left:3px; width:16px; height:16px; background:#fff; border-radius:50%; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .toggle-sw.on .toggle-knob { left:19px; }
    .toggle-info { flex:1; }
    .toggle-lbl { font-size:13px; font-weight:600; color:var(--ink); }
    .toggle-sub { font-size:12px; color:var(--ink3); }

    /* ── SUMMARY ── */
    .summary-hd { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink3); margin-bottom:6px; padding-bottom:5px; border-bottom:1px solid var(--border); }
    .summary-sec { margin-bottom:12px; }
    .summary-item { font-family:'Lora',serif; font-size:14px; color:var(--ink2); padding:2px 0; }

    /* ── TABS ── */
    .tabs { display:flex; border-bottom:2px solid var(--border); margin-bottom:22px; }
    .tab { padding:10px 20px; font-size:13px; font-weight:600; background:transparent; border:none; border-bottom:2.5px solid transparent; cursor:pointer; color:var(--ink3); transition:all .15s; margin-bottom:-2px; white-space:nowrap; font-family:'Plus Jakarta Sans',sans-serif; }
    .tab:hover { color:var(--ink2); }
    .tab.on { color:var(--forest); border-bottom-color:var(--forest); }

    /* ── INPUTS ── */
    .inp-sec { margin-bottom:18px; }
    .main-input { width:100%; padding:12px 16px; font-size:15px; font-family:'Plus Jakarta Sans',sans-serif; background:var(--surface); border:1.5px solid var(--border); color:var(--ink); border-radius:10px; outline:none; transition:border-color .15s, box-shadow .15s; box-shadow:var(--sh-sm); }
    .main-input:focus { border-color:var(--forest); box-shadow:0 0 0 3px var(--forest-lt); }
    .main-input::placeholder { color:var(--ink3); }
    .main-textarea { width:100%; padding:12px 16px; font-size:15px; font-family:'Lora',serif; background:var(--surface); border:1.5px solid var(--border); color:var(--ink); border-radius:10px; outline:none; resize:vertical; line-height:1.75; transition:border-color .15s, box-shadow .15s; box-shadow:var(--sh-sm); }
    .main-textarea:focus { border-color:var(--forest); box-shadow:0 0 0 3px var(--forest-lt); }
    .main-textarea::placeholder { color:var(--ink3); }
    .inp-hint { font-size:12px; color:var(--ink3); margin-top:6px; }

    /* ── DROPDOWN ── */
    .dd-wrap { position:relative; }
    .dd { position:absolute; top:calc(100% + 5px); left:0; right:0; z-index:50; background:var(--surface); border:1.5px solid var(--border); border-radius:10px; box-shadow:var(--sh-lg); overflow:hidden; }
    .dd-item { padding:11px 16px; font-size:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:baseline; gap:8px; border-bottom:1px solid var(--border); transition:background .1s; }
    .dd-item:last-child { border-bottom:none; }
    .dd-item:hover, .dd-item.hi { background:var(--surface2); }
    .dd-title { color:var(--ink); font-weight:600; }
    .dd-author { color:var(--ink3); font-size:12px; flex-shrink:0; font-style:italic; font-family:'Lora',serif; }

    /* ── TROPES ── */
    .trope-sec { margin-bottom:16px; }
    .trope-cat { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--ink3); margin-bottom:8px; }
    .trope-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .tchip { padding:6px 14px; font-size:12px; font-weight:600; cursor:pointer; border:1.5px solid var(--border); background:var(--surface); color:var(--ink2); transition:all .15s; border-radius:100px; box-shadow:var(--sh-sm); font-family:'Plus Jakarta Sans',sans-serif; }
    .tchip:hover { border-color:var(--forest); color:var(--forest); background:var(--forest-lt); }
    .tchip.sel { background:var(--forest-lt); border-color:var(--forest); color:var(--forest); font-weight:700; }
    .tchip.prio { background:var(--forest); border-color:var(--forest); color:#fff; }
    .trope-hint { font-family:'Lora',serif; font-size:14px; color:var(--ink3); font-style:italic; margin-bottom:16px; }

    /* ── CHIPS ── */
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .chip { display:flex; align-items:center; gap:5px; padding:4px 12px; background:var(--surface2); border:1px solid var(--border); font-size:13px; color:var(--ink2); border-radius:100px; font-family:'Lora',serif; }
    .chip.gold { border-color:#FDE68A; color:var(--amber); background:var(--amber-lt); }
    .chip-x { background:none; border:none; cursor:pointer; color:var(--ink3); padding:0; font-size:16px; line-height:1; transition:color .1s; }
    .chip-x:hover { color:var(--red); }

    /* ── LIKED BANNER ── */
    .liked-banner { display:flex; align-items:flex-start; gap:10px; padding:13px 16px; background:var(--amber-lt); border:1.5px solid #FDE68A; border-radius:10px; margin-bottom:18px; }
    .liked-icon { font-size:16px; flex-shrink:0; margin-top:2px; }
    .liked-body { font-family:'Lora',serif; font-size:14px; color:var(--ink2); line-height:1.5; }
    .liked-body strong { font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--amber); display:block; margin-bottom:3px; }

    /* ── HISTORY ── */
    .history { margin-bottom:18px; }
    .history-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .hchip { display:flex; align-items:center; gap:7px; padding:5px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:100px; font-size:12px; font-weight:500; color:var(--ink2); cursor:pointer; transition:all .15s; box-shadow:var(--sh-sm); }
    .hchip:hover { border-color:var(--forest); color:var(--forest); background:var(--forest-lt); }
    .hmode { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--amber); }

    /* ── SEARCH BUTTON ── */
    .search-btn { width:100%; padding:14px; font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; font-weight:700; letter-spacing:.02em; background:var(--forest); color:#fff; border:none; border-radius:11px; cursor:pointer; transition:all .2s; margin-bottom:26px; box-shadow:0 4px 16px rgba(29,61,47,.3); }
    .search-btn:hover { background:#162F24; box-shadow:0 6px 22px rgba(29,61,47,.4); transform:translateY(-1px); }
    .search-btn:active { transform:translateY(0); box-shadow:0 2px 8px rgba(29,61,47,.3); }
    .search-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }

    /* ── RESULTS ── */
    .results-hdr { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
    .results-title { font-family:'Fraunces',serif; font-size:22px; font-weight:700; color:var(--ink); letter-spacing:-.02em; }
    .results-line { flex:1; height:1px; background:linear-gradient(to right,var(--border),transparent); }
    .results-count { font-size:12px; font-weight:600; color:var(--ink3); white-space:nowrap; }

    .rcard { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:20px; margin-bottom:12px; border-left:4px solid var(--amber-bd); animation:fadeUp .35s ease both; box-shadow:var(--sh-sm); transition:box-shadow .2s, transform .2s; }
    .rcard:hover { box-shadow:var(--sh); transform:translateY(-1px); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .rnum { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:7px; background:var(--amber-lt); border:1px solid #FDE68A; font-family:'Fraunces',serif; font-size:12px; font-weight:700; color:var(--amber); margin-bottom:10px; }
    .rinner { display:flex; gap:16px; }
    .cover { width:64px; height:92px; flex-shrink:0; background:var(--surface2); border:1px solid var(--border); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:24px; object-fit:cover; transition:transform .2s; }
    .cover:hover { transform:scale(1.04); }
    .rbody { flex:1; min-width:0; }
    .rtitle-row { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:4px; }
    .rtitle { font-family:'Fraunces',serif; font-weight:700; font-size:18px; color:var(--ink); line-height:1.2; letter-spacing:-.01em; }
    .heart-btn { background:none; border:none; cursor:pointer; font-size:20px; padding:0; flex-shrink:0; line-height:1; transition:transform .15s; }
    .heart-btn:hover { transform:scale(1.2); }
    .rmeta { font-size:12px; font-weight:500; color:var(--ink3); margin-bottom:10px; }
    .rseries { color:var(--forest); margin-left:6px; font-weight:600; }
    .rreason { font-family:'Lora',serif; font-size:14px; color:var(--ink2); line-height:1.7; padding-left:12px; border-left:2px solid #FDE68A; }
    .cursor { display:inline-block; width:2px; height:13px; background:var(--amber-bd); margin-left:2px; animation:blink .7s step-end infinite; vertical-align:middle; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .expand-btn { background:none; border:none; cursor:pointer; font-size:12px; font-weight:600; color:var(--ink3); padding:0; margin-top:9px; display:flex; align-items:center; gap:4px; transition:color .15s; font-family:'Plus Jakarta Sans',sans-serif; }
    .expand-btn:hover { color:var(--forest); }
    .earrow { display:inline-block; transition:transform .2s; font-size:9px; }
    .earrow.open { transform:rotate(90deg); }

const CATS   = [...new Set(TROPES.map(t=>t.cat))];
const STOP   = new Set(["the","and","for","that","with","this","she","her","his","him","they","their","was","are","have","has","been","from","but","not","all","can","its","you","who","one","had","what","when","into","more","will","about","after","also","some","such","than","then","them","these","those","very","just","each"]);

// ── UTILITIES ────────────────────────────────────────────────────────────
const uid      = () => Math.random().toString(36).slice(2,9);
const tokenize = t => (t||"").toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));
const lsLoad   = (k,fb) => { try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;} };
const lsSave   = (k,v)  => { try{localStorage.setItem(k,JSON.stringify(v));}catch{} };
function cosine(a,b){ let d=0,na=0,nb=0; for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];} return d/(Math.sqrt(na)*Math.sqrt(nb)||1); }

// ── CANDIDATES ───────────────────────────────────────────────────────────
async function getCandidates(books,queryText,bookEmbeddings,likedKws=[],n=70,excl=null,alreadyRead=new Set(),shown=new Set(),refAuthor=null){
  const pool=books.filter(b=>b.title!==excl&&!alreadyRead.has(b.title)&&!shown.has(b.title));
  const authorLast=refAuthor?refAuthor.split(',')[0].trim().toLowerCase():null;
  const sameAuthor=new Set(authorLast?pool.filter(b=>(b.author||'').toLowerCase().includes(authorLast)).map(b=>b.title):[]);
  if(bookEmbeddings&&Object.keys(bookEmbeddings).length>0){
    try{
      const res=await fetch(EMBED_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:queryText})});
      if(!res.ok) throw new Error(`embed ${res.status}`);
      const{embedding:qEmb}=await res.json();
      const lSet=new Set(likedKws);
      const scored=pool.map(b=>{
        const bEmb=bookEmbeddings[b.title];
        const sim=bEmb?cosine(qEmb,bEmb):0;
        const toks=tokenize(`${b.enriched_subjects||b.subjects||''} ${b.enriched_summary||b.summary||''}`);
        const likedBoost=toks.filter(t=>lSet.has(t)).length*0.01;
        const authorBoost=sameAuthor.has(b.title)?0.15:0;
        return{...b,_s:sim+likedBoost+authorBoost};
      }).sort((a,b)=>b._s-a._s);
      return scored.slice(0,n);
    }catch(err){console.warn('Embedding failed — keyword fallback:',err);}
  }
  const kws=tokenize(queryText),kSet=new Set(kws),lSet=new Set(likedKws);
  let scored=pool.map(b=>{
    const st=new Set(tokenize(b.enriched_subjects||b.subjects||''));
    const sm=new Set(tokenize(b.enriched_summary||b.summary||''));
    const ti=new Set(tokenize(b.title||''));
    const base=[...kSet].filter(k=>st.has(k)).length*3+[...kSet].filter(k=>sm.has(k)).length+[...kSet].filter(k=>ti.has(k)).length;
    const liked=[...lSet].filter(k=>st.has(k)).length*4+[...lSet].filter(k=>sm.has(k)).length*2;
    const authorBoost=sameAuthor.has(b.title)?10:0;
    return{...b,_s:base+liked+authorBoost};
  }).filter(b=>b._s>0);
  if(!scored.length) scored=pool;
  return scored.sort((a,b)=>b._s-a._s).slice(0,n);
}

// ── CLAUDE ───────────────────────────────────────────────────────────────
async function callClaude(candidates,ctx,excluded=[],priorityLabel=null,likedTitles=[],likedThemes="",prefNote="",reluctantNote="",didntLikeNote=""){
  const exclNote=excluded.length?`\n\nDo NOT recommend: ${excluded.join(", ")}`:"";
  const prioNote=priorityLabel?`\n\nMust-have: "${priorityLabel}" — every pick MUST feature this.`:"";
  const likedNote=likedTitles.length?`\n\nThis student loved: ${likedTitles.join(", ")}. Weight toward similar feel.`:"";
  const list=candidates.map((b,i)=>`${i+1}. "${b.title}" by ${b.author}\n   ${(b.enriched_summary||b.summary||"").slice(0,200)}`).join("\n\n");
  const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,
      system:"You are an expert school librarian recommending middle school and YA fiction. Return only valid JSON arrays, no markdown.",
      messages:[{role:"user",content:`${ctx}${prioNote}${likedNote}${likedThemes}${prefNote}${reluctantNote}${didntLikeNote}${exclNote}\n\nChoose 6 best matches:\n\n${list}\n\nReturn ONLY: [{"title":"...","author":"...","reason":"1-2 sentence explanation"}]`}]})});
  const raw=await res.text();
  if(!res.ok) throw new Error(`Worker ${res.status}`);
  let data; try{data=JSON.parse(raw);}catch(e){console.error("Worker JSON error:",raw);throw e;}
  const text=data.content?.[0]?.text||"[]";
  const clean=text.replace(/```json|```/g,"").trim();
  const jsonText=(clean.match(/\[[\s\S]*\]/)||[clean])[0];
  return JSON.parse(jsonText);
}

// ── COMPONENTS ───────────────────────────────────────────────────────────
function Toasts({toasts}){ return <div className="toasts">{toasts.map(t=><div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>)}</div>; }

function CoverImg({isbn}){
  const[failed,setFailed]=React.useState(false);
  if(!isbn||failed) return <div className="cover">📖</div>;
  return <img className="cover" src={`https://covers.openlibrary.org/b/isbn/${isbn.replace(/[^0-9X]/g,"")}-M.jpg`} alt="" onError={()=>setFailed(true)}/>;
}

function TypewriterText({text}){
  const[displayed,setDisplayed]=React.useState("");
  const[done,setDone]=React.useState(false);
  React.useEffect(()=>{
    setDisplayed("");setDone(false);let i=0;
    const iv=setInterval(()=>{if(i<text.length){setDisplayed(text.slice(0,i+1));i++;}else{setDone(true);clearInterval(iv);}},16);
    return()=>clearInterval(iv);
  },[text]);
  return <span className="rreason">{displayed}{!done&&<span className="cursor"/>}</span>;
}

function NoteField({title,onSave}){

}

function BookSearch({books,exclude,onSelect,placeholder}){
  const[inp,setInp]=React.useState("");const[sugg,setSugg]=React.useState([]);const[hi,setHi]=React.useState(-1);
  const onChange=v=>{setInp(v);setHi(-1);if(v.length>1)setSugg(books.filter(b=>(b.title||"").toLowerCase().includes(v.toLowerCase())&&!exclude.has(b.title)).slice(0,6));else setSugg([]);};
  const pick=b=>{onSelect(b);setInp("");setSugg([]);setHi(-1);};
  const onKD=e=>{if(!sugg.length)return;if(e.key==="ArrowDown"){e.preventDefault();setHi(h=>Math.min(h+1,sugg.length-1));}else if(e.key==="ArrowUp"){e.preventDefault();setHi(h=>Math.max(h-1,-1));}else if(e.key==="Enter"&&hi>=0){e.preventDefault();pick(sugg[hi]);}else if(e.key==="Escape"){setSugg([]);setHi(-1);}};
  return <div className="dd-wrap">
    <input className="finput" style={{width:"100%"}} value={inp} onChange={e=>onChange(e.target.value)} onKeyDown={onKD} placeholder={placeholder||"Type a title…"}/>
    {sugg.length>0&&<div className="dd">{sugg.map((b,i)=><div key={i} className={`dd-item${hi===i?" hi":""}`} onClick={()=>pick(b)}><span className="dd-title">{b.title}</span><span className="dd-author">{b.author}</span></div>)}</div>}
  </div>;
}

function MainInput({value,onChange,onEnter,suggestions,onSelect,clearSugg}){
  const[hi,setHi]=React.useState(-1);
  const onKD=e=>{
    if(suggestions.length){
      if(e.key==="ArrowDown"){e.preventDefault();setHi(h=>Math.min(h+1,suggestions.length-1));}
      else if(e.key==="ArrowUp"){e.preventDefault();setHi(h=>Math.max(h-1,-1));}
      else if(e.key==="Enter"&&hi>=0){e.preventDefault();onSelect(suggestions[hi]);setHi(-1);}
      else if(e.key==="Enter"){e.preventDefault();clearSugg();onEnter();}
      else if(e.key==="Escape"){clearSugg();setHi(-1);}
    }else if(e.key==="Enter"){e.preventDefault();onEnter();}
  };
  return <div className="dd-wrap">
    <input className="main-input" value={value} onChange={e=>onChange(e.target.value)} onKeyDown={onKD} placeholder="Start typing a title…"/>
    {suggestions.length>0&&<div className="dd">{suggestions.map((b,i)=><div key={i} className={`dd-item${hi===i?" hi":""}`} onClick={()=>{onSelect(b);setHi(-1);}}><span className="dd-title">{b.title}</span><span className="dd-author">{b.author}</span></div>)}</div>}
  </div>;
}

function ChipList({items,onRemove,gold}){
  if(!items.length) return null;
  return <div className="chips">{items.map((t,i)=><div key={i} className={`chip${gold?" gold":""}`}><span>{t}</span><button className="chip-x" onClick={()=>onRemove(t)}>×</button></div>)}</div>;
}

function ProfileSummary({profile,onClose}){
  return <div className="card" style={{marginBottom:16}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <div className="card-title" style={{marginBottom:0}}>Profile — {profile.initials} · {profile.grade}</div>
      <button className="profile-btn" onClick={onClose}>Close</button>
    </div>
    {profile.notes&&<div className="summary-sec"><div className="summary-hd">Reading preferences</div><div className="summary-item" style={{fontStyle:"italic"}}>"{profile.notes}"</div></div>}
    {profile.reluctant&&<div className="summary-sec"><div className="summary-hd">Reader type</div><div className="summary-item"><span className="reluctant-tag">⚡ Reluctant reader</span></div></div>}
    <div className="summary-sec"><div className="summary-hd">Liked books ({(profile.likedBooks||[]).length})</div>{(profile.likedBooks||[]).length?profile.likedBooks.map((t,i)=><div key={i} className="summary-item">❤ {t}</div>):<div className="summary-item" style={{color:"var(--ink3)"}}>None recorded</div>}</div>
    <div className="summary-sec"><div className="summary-hd">Already read ({(profile.alreadyRead||[]).length})</div>{(profile.alreadyRead||[]).length?profile.alreadyRead.map((t,i)=><div key={i} className="summary-item">✓ {t}</div>):<div className="summary-item" style={{color:"var(--ink3)"}}>None recorded</div>}</div>
  </div>;
}

function ProfileEditor({profile,books,onSave,onDelete,onCancel}){
  const isNew=!profile.id;
  const[initials,setInitials]=React.useState(profile.initials||"");
  const[grade,setGrade]=React.useState(profile.grade||"6th");
  const[notes,setNotes]=React.useState(profile.notes||"");
  const[reluctant,setReluctant]=React.useState(profile.reluctant||false);
  const[liked,setLiked]=React.useState(profile.likedBooks||[]);
  const[read,setRead]=React.useState(profile.alreadyRead||[]);
  const save=()=>{if(!initials.trim()){alert("Please enter initials.");return;}onSave({...profile,id:profile.id||uid(),initials:initials.trim().toUpperCase(),grade,notes,reluctant,likedBooks:liked,alreadyRead:read});};
  return <div className="editor">
    <div className="editor-title">{isNew?"New Student Profile":"Edit Student Profile"}</div>
    <div className="ed-row">
      <div className="field" style={{flex:"0 0 82px"}}><label>Initials</label><input className="finput" value={initials} onChange={e=>setInitials(e.target.value)} maxLength={5} placeholder="A.R." style={{textAlign:"center",fontWeight:700}}/></div>
      <div className="field" style={{flex:"0 0 92px"}}><label>Grade</label><select className="finput" value={grade} onChange={e=>setGrade(e.target.value)} style={{background:"var(--surface2)"}}>{GRADES.map(g=><option key={g}>{g}</option>)}</select></div>
      <div className="field" style={{flex:1,minWidth:130}}><label>Reading preferences</label><input className="finput" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="e.g. loves fantasy, avoids romance…"/></div>
    </div>
    <div className={`toggle${reluctant?" on":""}`} onClick={()=>setReluctant(p=>!p)}>
      <div className={`toggle-sw${reluctant?" on":""}`}><div className="toggle-knob"/></div>
      <div className="toggle-info"><div className="toggle-lbl">⚡ Reluctant reader</div><div className="toggle-sub">Prioritize short, fast-paced books with high action</div></div>
    </div>
    <div style={{marginBottom:12}}>
      <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"var(--ink3)",marginBottom:6}}>Liked books</div>
      <BookSearch books={books} exclude={new Set(liked)} onSelect={b=>setLiked(prev=>[...prev,b.title])} placeholder="Add a book they enjoy…"/>
      <ChipList items={liked} onRemove={t=>setLiked(prev=>prev.filter(x=>x!==t))} gold/>
    </div>
    <div style={{marginBottom:16}}>
      <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"var(--ink3)",marginBottom:6}}>Already read</div>
      <BookSearch books={books} exclude={new Set(read)} onSelect={b=>setRead(prev=>[...prev,b.title])} placeholder="Add a book they've finished…"/>
      <ChipList items={read} onRemove={t=>setRead(prev=>prev.filter(x=>x!==t))}/>
    </div>
    <div className="btn-row">
      <div style={{display:"flex",gap:8}}><button className="btn btn-primary" onClick={save}>{isNew?"Save Profile":"Update Profile"}</button><button className="btn btn-secondary" onClick={onCancel}>Cancel</button></div>
      {!isNew&&<button className="btn btn-danger" onClick={()=>onDelete(profile.id)}>Delete Profile</button>}
    </div>
  </div>;
}

function AnalyticsPanel({analytics}){
  const topTropes=Object.entries(analytics.tropeSearches||{}).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topBooks=Object.entries(analytics.recommendedBooks||{}).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const sm=analytics.searchModes||{};
  return <div className="card" style={{marginBottom:16}}>
    <div className="card-title">Usage Statistics</div>
    <div className="stats-row">{[["Total",analytics.totalSearches||0],["Find Similar",sm.similar||0],["By Trope",sm.tropes||0],["Describe It",sm.freetext||0]].map(([l,v])=>(<div key={l} className="stat-box"><div className="stat-n">{v}</div><div className="stat-l">{l}</div></div>))}</div>
    <div className="stat-cols">
      <div className="stat-col"><div className="stat-col-h">Top tropes</div>{topTropes.length?topTropes.map(([id,n])=>{const label=TROPES.find(t=>t.id===id)?.label||id;return <div key={id} className="stat-row"><span>{label}</span><span>{n}</span></div>;}): <span className="stat-empty">No searches yet</span>}</div>
      <div className="stat-col"><div className="stat-col-h">Most recommended</div>{topBooks.length?topBooks.map(([title,n])=><div key={title} className="stat-row"><span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginRight:8}}>{title}</span><span>{n}</span></div>):<span className="stat-empty">No data yet</span>}</div>
    </div>
  </div>;
}

function AboutPanel(){
  return <div className="card about-card" style={{marginBottom:16}}>
    <div className="card-title">About This Tool</div>
    <p>The Fletcher Library Assistant uses AI-powered semantic search to match students with books from the Fletcher Middle School fiction catalog. It combines vector embeddings, enriched MARC data, and Claude AI to surface the most relevant titles — understanding context and meaning, not just keywords.</p>
    <p><strong>Find Similar</strong> — Enter a title a student loved and the system finds books with matching themes, tone, and characters. <strong>By Trope</strong> — Browse narrative themes and select what a student is looking for. <strong>Describe It</strong> — Type a freeform description in plain language.</p>
    <p><strong>Student Profiles</strong> — Save reading preferences, liked books, and already-read lists per student. Liked books actively shape recommendation results.</p>
    <div className="feature-tags">{["3,500+ Fiction Titles","Voyage AI Embeddings","Claude Sonnet","Enriched MARC Data","Student Profiles","Privacy-First"].map(t=><span key={t} className="ftag">{t}</span>)}</div>
  </div>;
}

function LoadingView({stageMsg}){
  return <div className="loading-wrap">
    <video className="loading-video" src="A_–_second_seamless_loop_for.mp4" autoPlay muted loop playsInline/>
    <div className="loading-card">
      <div className="lbars"><div className="lbar"/><div className="lbar"/><div className="lbar"/><div className="lbar"/></div>
      <div className="ltext">{stageMsg}</div>
    </div>
  </div>;
}

// ── APP ──────────────────────────────────────────────────────────────────
function App(){
  const[books,setBooks]=React.useState([]);
  const[bookCount,setBookCount]=React.useState(0);
  const[bookEmbeddings,setBookEmbeddings]=React.useState(null);
  const[embedReady,setEmbedReady]=React.useState(null);
  const[loadError,setLoadError]=React.useState(false);
  const[profiles,setProfiles]=React.useState(()=>lsLoad("profiles",[]));
  const[activeProfileId,setActiveProfileId]=React.useState(null);
  const[editing,setEditing]=React.useState(null);
  const[showStats,setShowStats]=React.useState(false);
  const[showAbout,setShowAbout]=React.useState(false);
  const[showSummary,setShowSummary]=React.useState(false);
  const[analytics,setAnalytics]=React.useState(()=>lsLoad("analytics",DEFAULT_ANALYTICS));
  const[mode,setMode]=React.useState("similar");
  const[query,setQuery]=React.useState("");
  const[selTropes,setSelTropes]=React.useState(new Set());
  const[priorityTrope,setPriorityTrope]=React.useState(null);
  const[alreadyRead,setAlreadyRead]=React.useState(new Set());
  const[didntLike,setDidntLike]=React.useState("");
  const[results,setResults]=React.useState(null);
  const[loading,setLoading]=React.useState(false);
  const[loadingMore,setLoadingMore]=React.useState(false);
  const[stageMsg,setStageMsg]=React.useState(STAGE_MSGS[0]);
  const[error,setError]=React.useState("");
  const[suggestions,setSuggestions]=React.useState([]);
  const[refBook,setRefBook]=React.useState(null);
  const[shownTitles,setShownTitles]=React.useState(new Set());
  const[toasts,setToasts]=React.useState([]);
  const[searchHistory,setSearchHistory]=React.useState([]);
  const lastSearch=React.useRef(null);
  const stageRef=React.useRef(null);
  const resultsRef=React.useRef(null);

  React.useEffect(()=>{
    fetch(CSV_FILE).then(r=>{if(!r.ok)throw new Error();return r.text();})
      .then(t=>Papa.parse(t,{header:true,skipEmptyLines:true,complete:r=>{setBooks(r.data);setBookCount(r.data.length);}}))
      .catch(()=>setLoadError(true));
  },[]);

  React.useEffect(()=>{
    fetch('book_embeddings.json').then(r=>{if(!r.ok)throw new Error();return r.json();})
      .then(d=>{setBookEmbeddings(d);setEmbedReady(true);})
      .catch(()=>{setBookEmbeddings({});setEmbedReady(false);});
  },[]);

  React.useEffect(()=>{
    if(loading||loadingMore){let i=0;stageRef.current=setInterval(()=>{i=(i+1)%STAGE_MSGS.length;setStageMsg(STAGE_MSGS[i]);},2000);}
    else{if(stageRef.current)clearInterval(stageRef.current);setStageMsg(STAGE_MSGS[0]);}
    return()=>{if(stageRef.current)clearInterval(stageRef.current);};
  },[loading,loadingMore]);

  React.useEffect(()=>{
    if(results?.length&&resultsRef.current) setTimeout(()=>resultsRef.current.scrollIntoView({behavior:'smooth',block:'start'}),150);
  },[results]);

  // Wire header buttons
  React.useEffect(()=>{
    const el=document.getElementById('hdr-btns');
    if(!el||!ReactDOM.createRoot) return;
    const root=ReactDOM.createRoot(el);
    root.render(<>
      <button className={`hdr-btn${showAbout?" on":""}`} onClick={()=>{setShowAbout(p=>!p);setShowStats(false);}}>About</button>
      <button className={`hdr-btn${showStats?" on":""}`} onClick={()=>{setShowStats(p=>!p);setShowAbout(false);}}>Stats</button>
    </>);
  },[showAbout,showStats]);

  const addToast=(msg,type='success')=>{const id=Date.now()+Math.random();setToasts(p=>[...p,{id,msg,type}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),2800);};
  const saveProfiles=p=>{setProfiles(p);lsSave("profiles",p);};
  const saveAnalytics=a=>{setAnalytics(a);lsSave("analytics",a);};
  const activeProfile=profiles.find(p=>p.id===activeProfileId)||null;

  const selectProfile=id=>{setActiveProfileId(id);setEditing(null);setResults(null);setShownTitles(new Set());lastSearch.current=null;setShowSummary(false);setAlreadyRead(id?new Set(profiles.find(p=>p.id===id)?.alreadyRead||[]):new Set());};
  const toggleHeart=title=>{if(!activeProfile)return;const liked=activeProfile.likedBooks||[];const nowLiked=!liked.includes(title);const updated=nowLiked?[...liked,title]:liked.filter(t=>t!==title);saveProfiles(profiles.map(p=>p.id===activeProfileId?{...p,likedBooks:updated}:p));addToast(nowLiked?'❤ Added to liked books':'Removed from liked books');};
  const trackSearch=(m,tropes=[])=>{const a={...analytics,totalSearches:(analytics.totalSearches||0)+1,searchModes:{...analytics.searchModes,[m]:(analytics.searchModes[m]||0)+1},tropeSearches:{...analytics.tropeSearches}};tropes.forEach(t=>{a.tropeSearches[t]=(a.tropeSearches[t]||0)+1;});saveAnalytics(a);};
  const trackRecs=recs=>{const a={...analytics,recommendedBooks:{...analytics.recommendedBooks}};recs.forEach(b=>{a.recommendedBooks[b.title]=(a.recommendedBooks[b.title]||0)+1;});saveAnalytics(a);};
  const addToHistory=(label,m)=>setSearchHistory(p=>[{label,mode:m,id:Date.now()},...p.filter(e=>e.label!==label)].slice(0,5));
  const getLikedKws=()=>{if(!activeProfile?.likedBooks?.length)return[];const objs=books.filter(b=>activeProfile.likedBooks.includes(b.title));const st=objs.map(b=>b.enriched_subjects||b.subjects||"").join(" ");const sm=objs.map(b=>b.enriched_summary||b.summary||"").join(" ");return[...tokenize(st),...tokenize(st),...tokenize(st),...tokenize(sm)];};
  const getLikedThemes=()=>{if(!activeProfile?.likedBooks?.length)return"";const objs=books.filter(b=>activeProfile.likedBooks.includes(b.title));const all=objs.flatMap(b=>(b.enriched_subjects||b.subjects||"").split("|").map(s=>s.trim())).filter(Boolean);const unique=[...new Set(all)].slice(0,12);return unique.length?`\n\nThemes from books this student enjoyed: ${unique.join("; ")}. Prioritize books sharing these themes.`:"";};
  const onQueryChange=val=>{setQuery(val);setRefBook(null);if(mode==="similar"&&val.length>1)setSuggestions(books.filter(b=>(b.title||"").toLowerCase().includes(val.toLowerCase())).slice(0,6));else setSuggestions([]);};
  const toggleTrope=id=>{setSelTropes(prev=>{const n=new Set(prev);if(!n.has(id)){n.add(id);}else if(priorityTrope!==id){setPriorityTrope(id);}else{n.delete(id);setPriorityTrope(null);}return n;});};
  const switchMode=m=>{setMode(m);setResults(null);setError("");setQuery("");setRefBook(null);setSuggestions([]);setSelTropes(new Set());setPriorityTrope(null);setShownTitles(new Set());lastSearch.current=null;};

  const buildParams=()=>{
    let ctx="",excl=null,priorityLabel=null;
    if(mode==="similar"){const ref=refBook||books.find(b=>(b.title||"").toLowerCase()===query.toLowerCase());if(!ref)return null;excl=ref.title;ctx=`A student loved "${ref.title}" by ${ref.author}.\n\nSummary: ${ref.enriched_summary||ref.summary||""}\n\nFind books with similar themes, characters, tone, and plot elements.`;}
    else if(mode==="tropes"){if(!selTropes.size)return null;const labels=TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label);if(priorityTrope)priorityLabel=TROPES.find(t=>t.id===priorityTrope)?.label;ctx=`A student wants books with: ${labels.join(", ")}. Find the best matches.`;}
    else{if(!query.trim())return null;ctx=`A student wants: "${query}". Find the best matches.`;}
    return{ctx,excl,priorityLabel};
  };

  const buildQueryText=()=>{
    if(mode==="similar"&&refBook)return `${refBook.title} ${refBook.author} ${refBook.enriched_subjects||refBook.subjects||""} ${refBook.enriched_summary||refBook.summary||""}`;
    if(mode==="tropes"){const labels=TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label);return[...new Set(labels.flatMap(l=>{const id=TROPES.find(t=>t.label===l)?.id;return[...tokenize(l),...(TROPE_KEYWORDS[id]||[])]}))].join(' ');}
    return query;
  };

  const runSearch=async(params,shown,isMore=false)=>{
    const{ctx,excl,priorityLabel}=params;
    const queryText=buildQueryText();
    const refAuthor=(mode==='similar'&&refBook)?refBook.author:null;
    const cands=await getCandidates(books,queryText,bookEmbeddings,getLikedKws(),70,excl,alreadyRead,shown,refAuthor);
    const prefNote=activeProfile?.notes?`\n\nStudent reading preferences: ${activeProfile.notes}. Please respect these.`:"";
    const reluctantNote=activeProfile?.reluctant?`\n\nThis is a reluctant reader — ONLY recommend fast-paced books with short chapters and high action.`:"";
    const didntLikeNote=didntLike.trim()?`\n\nThe student did NOT enjoy: "${didntLike.trim()}". Avoid books with these qualities.`:"";
    const recs=await callClaude(cands,ctx,[...alreadyRead,...shown],priorityLabel,activeProfile?.likedBooks||[],getLikedThemes(),prefNote,reluctantNote,didntLikeNote);
    const enriched=recs.map(r=>({...(books.find(b=>b.title===r.title&&b.author===r.author)||books.find(b=>b.title===r.title)||r),...r}));
    setShownTitles(new Set([...shown,...enriched.map(b=>b.title)]));
    if(isMore)setResults(p=>[...(p||[]),...enriched]);else setResults(enriched);
    trackRecs(enriched);
  };

  const search=async()=>{
    setError("");setResults(null);setLoading(true);setShownTitles(new Set());lastSearch.current=null;
    try{
      const params=buildParams();
      if(!params){setError(mode==="similar"?"Please select a title from the suggestions.":mode==="tropes"?"Please select at least one trope.":"Please describe what the student is looking for.");setLoading(false);return;}
      lastSearch.current=params;
      const histLabel=mode==="similar"?query:mode==="tropes"?TROPES.filter(t=>selTropes.has(t.id)).map(t=>t.label).join(', '):query;
      addToHistory(histLabel,mode);
      await runSearch(params,new Set());
      trackSearch(mode,mode==="tropes"?[...selTropes]:[]);
    }catch(e){console.error(e);setError("Search failed. Please check your connection and try again.");}
    setLoading(false);
  };

  const searchMore=async()=>{if(!lastSearch.current)return;setLoadingMore(true);try{await runSearch(lastSearch.current,shownTitles,true);}catch{setError("Search failed. Please try again.");}setLoadingMore(false);};
  const copyResults=()=>{if(!results?.length)return;const text=results.map((b,i)=>`${ROMAN[i]||i+1}. ${b.title} by ${b.author}\n   ${b.reason||""}`).join('\n\n');navigator.clipboard.writeText(text).then(()=>addToast('📋 Recommendations copied')).catch(()=>addToast('Could not copy','error'));};
  const saveProfile=p=>{const updated=profiles.find(x=>x.id===p.id)?profiles.map(x=>x.id===p.id?p:x):[...profiles,p];saveProfiles(updated);setActiveProfileId(p.id);setAlreadyRead(new Set(p.alreadyRead||[]));setEditing(null);addToast('Profile saved ✓');};
  const deleteProfile=id=>{saveProfiles(profiles.filter(p=>p.id!==id));if(activeProfileId===id){setActiveProfileId(null);setAlreadyRead(new Set());}setEditing(null);addToast('Profile deleted');};

  const loaded=bookCount>0;
  const modeLbls={similar:"Similar",tropes:"Trope",freetext:"Describe"};

  return <div className="page-body">
    <Toasts toasts={toasts}/>

    <div className="status-bar">
      <div className="status-item"><div className={`dot${loaded?" ready":""}`}/><span>{loaded?`${bookCount.toLocaleString()} titles loaded`:"Loading catalog…"}</span></div>
      <div className="status-item"><div className={`dot${embedReady===true?" ready":embedReady===null?" spin":""}`}/><span>{embedReady===null?"Initializing semantic search…":embedReady?"Semantic search ready":"Keyword search active"}</span></div>
    </div>

    {showAbout&&<AboutPanel/>}
    {showStats&&<AnalyticsPanel analytics={analytics}/>}
    {loadError&&<div className="error-msg">⚠ Could not load the book catalog. Make sure {CSV_FILE} is in your repository.</div>}

    {loaded&&<>
      <div className="section">
        <div className="sec-label">Student Profile</div>
        <div className="pills">
          <button className={`pill${!activeProfileId?" on":""}`} onClick={()=>selectProfile(null)}>No Profile</button>
          {profiles.map(p=><div key={p.id} style={{display:"flex",alignItems:"center"}}>
            <button className={`pill${activeProfileId===p.id?" on-l":""}`} onClick={()=>selectProfile(p.id)}>{p.initials} <span style={{fontSize:11,opacity:.7,marginLeft:2}}>{p.grade}</span></button>
            {activeProfileId===p.id&&<button className="pill-edit" onClick={()=>setEditing(editing?.id===p.id?null:p)}>✎</button>}
          </div>)}
          {profiles.length<10&&<button className="pill-add" onClick={()=>setEditing({initials:"",grade:"6th",notes:"",reluctant:false,likedBooks:[],alreadyRead:[]})}>+ New Profile</button>}
        </div>
        {activeProfile&&<div className="profile-meta">
          {activeProfile.notes&&<span className="profile-note">"{activeProfile.notes}"</span>}
          <button className="profile-btn" onClick={()=>setShowSummary(p=>!p)}>{showSummary?"Hide":"View profile"}</button>
          {activeProfile.reluctant&&<span className="reluctant-tag">⚡ Reluctant reader</span>}
        </div>}
      </div>

      {showSummary&&activeProfile&&<ProfileSummary profile={activeProfile} onClose={()=>setShowSummary(false)}/>}
      {editing&&<ProfileEditor profile={editing} books={books} onSave={saveProfile} onDelete={deleteProfile} onCancel={()=>setEditing(null)}/>}

      {!editing&&<>
        {searchHistory.length>0&&<div className="history">
          <div className="sec-label" style={{marginBottom:8}}>Recent searches</div>
          <div className="history-chips">{searchHistory.map(h=><div key={h.id} className="hchip" onClick={()=>{switchMode(h.mode);if(h.mode!=="tropes")setQuery(h.label);}}><span className="hmode">{modeLbls[h.mode]}</span><span>{h.label.length>42?h.label.slice(0,42)+'…':h.label}</span></div>)}</div>
        </div>}

        <div className="tabs">{[{id:"similar",label:"Find Similar"},{id:"tropes",label:"By Trope"},{id:"freetext",label:"Describe It"}].map(m=>(<button key={m.id} className={`tab${mode===m.id?" on":""}`} onClick={()=>switchMode(m.id)}>{m.label}</button>))}</div>

        {mode==="similar"&&<div className="inp-sec"><div className="sec-label">Book title</div><MainInput value={query} onChange={onQueryChange} onEnter={search} suggestions={suggestions} onSelect={b=>{setRefBook(b);setQuery(b.title);setSuggestions([]);}} clearSugg={()=>setSuggestions([])}/><div className="inp-hint">Select a title from the suggestions, then click Find Books</div></div>}
        {mode==="freetext"&&<div className="inp-sec"><div className="sec-label">Describe what the student is looking for</div><textarea className="main-textarea" value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();search();}}} rows={3} placeholder='e.g. "A fantasy with a strong female lead who discovers she has hidden powers"'/><div className="inp-hint">Press Enter to search · Shift+Enter for a new line</div></div>}
        {mode==="tropes"&&<div className="inp-sec"><p className="trope-hint">Select one or more tropes · Click again to mark as must-have (★)</p>{CATS.map(cat=><div key={cat} className="trope-sec"><div className="trope-cat">{cat}</div><div className="trope-chips">{TROPES.filter(t=>t.cat===cat).map(t=>{const on=selTropes.has(t.id),isPrio=priorityTrope===t.id;return <button key={t.id} onClick={()=>toggleTrope(t.id)} className={`tchip${isPrio?" prio":on?" sel":""}`}>{isPrio?"★ ":""}{t.label}</button>;})}</div></div>)}</div>}

        <div className="inp-sec"><div className="sec-label">Exclude books already read</div><BookSearch books={books} exclude={alreadyRead} onSelect={b=>setAlreadyRead(prev=>new Set([...prev,b.title]))} placeholder="Add a title to exclude…"/><ChipList items={[...alreadyRead]} onRemove={t=>setAlreadyRead(prev=>{const n=new Set(prev);n.delete(t);return n;})}/></div>

        {activeProfile?.likedBooks?.length>0&&<div className="liked-banner"><span className="liked-icon">❤</span><div className="liked-body"><strong>Influencing recommendations</strong>{activeProfile.likedBooks.join(", ")}</div></div>}

        <div className="inp-sec"><div className="sec-label">What didn't the student enjoy? <span style={{color:"var(--ink3)",fontWeight:400,textTransform:"none",letterSpacing:0,fontSize:12}}>(optional)</span></div><input className="main-input" value={didntLike} onChange={e=>setDidntLike(e.target.value)} placeholder='e.g. "too slow, too much romance, confusing ending"'/></div>

        {error&&<div className="error-msg"><span>⚠</span>{error}</div>}
        {loading&&<LoadingView stageMsg={stageMsg}/>}
        {loadingMore&&<LoadingView stageMsg={stageMsg}/>}
        {!loading&&<button className="search-btn" onClick={search} disabled={loadingMore}>Find Books</button>}

        {results&&results.length>0&&!loading&&<div ref={resultsRef}>
          <div className="results-hdr"><span className="results-title">Recommendations</span><div className="results-line"/><span className="results-count">{results.length} titles</span></div>
          {results.map((b,i)=><ResultCard key={`${b.title}-${i}`} book={b} index={i} activeProfile={activeProfile} onHeart={toggleHeart} onNoteSave={()=>addToast('Note saved ✓')}/>)}
          <div className="ractions">
            <button className="act-btn" onClick={()=>window.print()}>🖨 Print</button>
            <button className="act-btn" onClick={copyResults}>📋 Copy list</button>
            {!loadingMore&&<button className="act-btn primary" onClick={searchMore}>Load more →</button>}
          </div>
        </div>}

        {results&&results.length===0&&!loading&&<div className="empty"><p className="empty-title">No matching titles found.</p><p className="empty-sub">Try broadening your search or using a different mode.</p><div className="empty-actions"><div className="echip" onClick={()=>switchMode("freetext")}>Try describing it</div><div className="echip" onClick={()=>switchMode("tropes")}>Browse by trope</div><div className="echip" onClick={()=>setResults(null)}>Start over</div></div></div>}
      </>}
    </>}
  </div>;
}

const rootEl=document.getElementById("root");
if(ReactDOM.createRoot){ReactDOM.createRoot(rootEl).render(<App/>);}
else{ReactDOM.render(<App/>,rootEl);}
</script>
</body>
</html>
